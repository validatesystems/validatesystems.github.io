<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    />
    <title>Bem Me Queira</title>
    <style>
      :root {
        --bg1: #fdf8f4;
        --ink: #3e2f2b;
        --muted: #92776e;
        --accent: #d9b59c;
        --font-main: "Georgia", serif;
        --font-script: "Segoe Script", cursive;
      }

      [data-theme="dark"] {
        --bg1: #1e1a19;
        --ink: #f2e8e4;
        --muted: #bfa59a;
        --accent: #eac3a6;
      }

      html,
      body {
        margin: 0;
        padding: 0;
        height: 100%;
        -webkit-font-smoothing: antialiased;
        -moz-osx-font-smoothing: grayscale;
        text-rendering: optimizeLegibility;
        scroll-behavior: smooth;
      }

      body {
        background: var(--bg1);
        font-family: var(--font-main);
        color: var(--ink);
        overflow-x: hidden;
        overflow-y: auto;
        display: flex;
        justify-content: center;
        align-items: flex-start;
        transition: background 0.6s ease, color 0.6s ease;
        padding: env(safe-area-inset-top) 16px env(safe-area-inset-bottom);
        box-sizing: border-box;
      }

      .background {
        position: fixed;
        inset: 0;
        z-index: -1;
        transition: background 0.6s ease;
        background: linear-gradient(to bottom right, var(--bg1), #fffdfc);
      }
      [data-theme="dark"] .background {
        background: linear-gradient(to bottom right, var(--bg1), #2a2523);
      }

      .container {
        max-width: 600px;
        width: 100%;
        padding: 80px 16px 40px;
        line-height: 1.7;
        font-size: 1.1rem;
        opacity: 0;
        transform: translateY(20px);
        transition: opacity 1s ease, transform 1s ease;
        background: transparent;
      }
      .container.show {
        opacity: 1;
        transform: translateY(0);
      }

      .verse-intro {
        font-size: 1rem;
        text-align: center;
        color: var(--muted);
        opacity: 0;
        animation: fadeIntro 6s ease-in forwards;
        margin-bottom: 0.5rem;
        white-space: pre-line;
        padding: 0 8px;
      }
      @keyframes fadeIntro {
        0% {
          opacity: 0;
          transform: translateY(-10px);
        }
        100% {
          opacity: 1;
          transform: translateY(0);
        }
      }

      h1 {
        font-family: var(--font-script);
        font-size: 2.2rem;
        color: var(--accent);
        text-align: center;
        margin-bottom: 0.2rem;
        padding: 0 8px;
      }
      .sub {
        font-size: 0.95rem;
        text-align: center;
        color: var(--muted);
        margin-bottom: 2rem;
        padding: 0 8px;
      }

      .fade-line {
        opacity: 0;
        transition: opacity 1.5s ease;
        padding: 0 8px;
      }
      .fade-line.visible {
        opacity: 1;
      }

      .final {
        text-align: center;
        font-weight: bold;
        margin-top: 60px;
        font-size: 1.2rem;
        color: var(--muted);
        opacity: 0;
        transition: opacity 2s ease;
        padding: 0 8px;
      }
      .final.visible {
        opacity: 1;
      }

      .easter-egg {
        position: fixed;
        bottom: 12px;
        left: 12px;
        font-size: 0.8rem;
        color: var(--muted);
        opacity: 0;
        pointer-events: none;
        animation: fadeinout 12s ease-in-out infinite;
        max-width: 90vw;
      }
      @keyframes fadeinout {
        0%,
        100% {
          opacity: 0;
        }
        20%,
        80% {
          opacity: 0.6;
        }
        50% {
          opacity: 1;
        }
      }

      .button-group {
        position: fixed;
        top: 16px;
        right: 16px;
        display: flex;
        gap: 8px;
        z-index: 10;
      }
      .button-group button {
        background: none;
        border: 1px solid var(--muted);
        color: var(--muted);
        padding: 4px 10px;
        font-size: 0.8rem;
        border-radius: 6px;
        cursor: pointer;
        transition: all 0.3s ease;
      }

      #signature {
        opacity: 0;
        font-size: 0.9rem;
        text-align: right;
        color: var(--muted);
        margin-top: 20px;
        transition: opacity 2s ease 0.5s;
        padding: 0 8px;
      }
      #signature.visible {
        opacity: 1;
      }

      /* ——— Letra sincronizada ——— */
      .lyric-wrap {
        margin-top: 1.25rem;
      }
      .lyric-line {
        opacity: 0.25;
        transition: opacity 0.4s ease;
        padding: 0.2rem 8px;
        text-align: center;
      }
      .lyric-line.active {
        opacity: 1;
      }

      @media (max-width: 480px) {
        h1 {
          font-size: 1.7rem;
        }
        .container {
          padding-top: 64px;
          font-size: 1rem;
        }
        .final {
          font-size: 1rem;
        }
        .sub {
          font-size: 0.9rem;
        }
      }
    </style>
  </head>
  <body>
    <div class="background"></div>
    <div class="button-group">
      <button id="audioToggle">🔊</button>
      <button id="themeToggle">Alternar tema</button>
      <button id="lrcToggle">Ouvir a música</button>
    </div>

    <audio id="bgAudio" src="./assets/bem_me_queira.mp3" loop></audio>

    <div class="easter-egg">De tanto ser, se tornou</div>
    <div class="container" id="content">
      <div class="verse-intro">
        Ela ama o mar porque encontra lá<br />a outra metade da tua imensidão
      </div>
      <h1>Bem Me Queira</h1>
      <div class="sub">
        Essa página não é pra te contar algo. É pra te lembrar de quem você já
        é.
      </div>
      <div id="text"></div>
      <div class="final" id="finalLine">Talvez... seja você.</div>
      <div id="signature">por quem observa de longe<br />._.. ...</div>
    </div>

    <script>
      // ====== Fluxo ORIGINAL ======
      const lines = [
        "Algumas pessoas não pedem licença para tocar.",
        "Não falam alto. Não se impõem.",
        "Mas deixam marca.",
        "\n",
        "São do tipo que bagunçam o mundo com silêncio.",
        "Que fazem o caos parecer orquestrado.",
        "Que sorriem como se nem soubessem o efeito disso.",
        "\n",
        "Ninguém sabe bem de onde vêm.",
        "Só que, quando passam, deixam a brisa com cheiro de coisa boa.",
        "\n",
        "Talvez você conheça alguém assim.",
      ];

      const textContainer = document.getElementById("text");
      const finalLine = document.getElementById("finalLine");
      const signature = document.getElementById("signature");
      const container = document.getElementById("content");
      const audio = document.getElementById("bgAudio");

      let delay = 500;
      window.__bmqTimers = [];
      let __lrcVerses = null;
      let __lrcRaf = null;
      let __isLrc = false;

      function startOriginalFlow() {
        container.classList.add("show");
        lines.forEach((line) => {
          const t = setTimeout(() => {
            const p = document.createElement("p");
            p.classList.add("fade-line");
            if (line.trim() === "") p.innerHTML = "<br />";
            else p.textContent = line;
            textContainer.appendChild(p);
            setTimeout(() => p.classList.add("visible"), 50);
            window.scrollTo({
              top: document.body.scrollHeight,
              behavior: "smooth",
            });
          }, delay);
          window.__bmqTimers.push(t);
          delay += 2500;
        });
        const t1 = setTimeout(() => {
          finalLine.classList.add("visible");
          window.scrollTo({
            top: document.body.scrollHeight,
            behavior: "smooth",
          });
        }, delay + 1000);
        const t2 = setTimeout(() => {
          signature.classList.add("visible");
          window.scrollTo({
            top: document.body.scrollHeight,
            behavior: "smooth",
          });
        }, delay + 2500);
        window.__bmqTimers.push(t1, t2);
      }
      window.addEventListener("DOMContentLoaded", startOriginalFlow);

      // Tema
      const toggleButton = document.getElementById("themeToggle");
      toggleButton.addEventListener("click", () => {
        const root = document.documentElement;
        const cur = root.getAttribute("data-theme") || "light";
        root.setAttribute("data-theme", cur === "dark" ? "light" : "dark");
      });
      const prefersDark = window.matchMedia(
        "(prefers-color-scheme: dark)"
      ).matches;
      document.documentElement.setAttribute(
        "data-theme",
        prefersDark ? "dark" : "light"
      );
      document.documentElement.setAttribute("data-theme", "dark");

      // Áudio toggle
      const audioToggle = document.getElementById("audioToggle");
      let isMuted = false;
      audioToggle.addEventListener("click", () => {
        isMuted = !isMuted;
        audio.muted = isMuted;
        audioToggle.textContent = isMuted ? "🔈" : "🔊";
      });

      // ====== LRC helpers ======
      function parseLRC(text) {
        let globalOffset = 0; // ms
        const out = [];
        text.split("\n").forEach((line) => {
          const off = line.match(/^\s*\[offset:([+-]?\d+)\]\s*$/i);
          if (off) {
            globalOffset = parseInt(off[1], 10) || 0;
            return;
          }
          const stamps = [...line.matchAll(/\[(\d{2}):(\d{2})(?:\.(\d+))?\]/g)];
          if (!stamps.length) return;
          const textPart = line
            .replace(/\[(\d{2}):(\d{2})(?:\.(\d+))?\]/g, "")
            .trim();
          stamps.forEach((m) => {
            const min = parseInt(m[1], 10);
            const sec = parseInt(m[2], 10);
            const fracStr = m[3] || "";
            const frac = fracStr
              ? parseInt(fracStr, 10) / Math.pow(10, fracStr.length)
              : 0;
            let t = min * 60 + sec + frac; // s
            t += globalOffset / 1000;
            out.push({ time: t, text: textPart });
          });
        });
        return out.sort((a, b) => a.time - b.time);
      }

      async function loadLRC() {
        if (__lrcVerses) return __lrcVerses;
        const res = await fetch("./assets/bem_me_queira.lrc", {
          cache: "no-store",
        });
        if (!res.ok) throw new Error("Falha ao carregar LRC");
        const txt = await res.text();
        __lrcVerses = parseLRC(txt);
        return __lrcVerses;
      }

      function clearOriginalFlow() {
        (window.__bmqTimers || []).forEach((t) => clearTimeout(t));
        window.__bmqTimers = [];
        textContainer.innerHTML = "";
        finalLine.classList.remove("visible");
        signature.classList.remove("visible");
      }

      function stopLrcSync() {
        if (__lrcRaf) cancelAnimationFrame(__lrcRaf);
        __lrcRaf = null;
      }

      function showBackButton() {
        const btn = document.getElementById("lrcToggle");
        btn.textContent = "Voltar";
        btn.onclick = exitLrcMode;
      }
      function showListenButton() {
        const btn = document.getElementById("lrcToggle");
        btn.textContent = "Ouvir a música";
        btn.onclick = enableLrcMode;
      }

      const USER_OFFSET = 0; // ajuste fino base (negativo = adianta a letra) em segundos
      let __audioListenersBound = false;

      async function enableLrcMode() {
        if (__isLrc) return;
        __isLrc = true;
        showBackButton();
        clearOriginalFlow();
        try {
          await loadLRC();
        } catch (err) {
          console.error(err);
          alert("Não consegui carregar a letra sincronizada.");
          __isLrc = false;
          showListenButton();
          startOriginalFlow();
          return;
        }

        // inicia áudio
        try {
          isMuted = false;
          audio.muted = false;
          audio.currentTime = 0;
          await audio.play();
        } catch (e) {
          console.warn("Play bloqueado:", e);
        }

        const wrap = document.createElement("div");
        wrap.className = "lyric-wrap";
        textContainer.appendChild(wrap);
        __lrcVerses.forEach((v) => {
          const d = document.createElement("div");
          d.className = "lyric-line";
          d.textContent = v.text;
          wrap.appendChild(d);
          v.el = d;
          v._seen = false;
        });

        if (__lrcRaf) cancelAnimationFrame(__lrcRaf);
        let lastIndex = -1;
        let dynamicOffset = USER_OFFSET; // pode ser recalibrado automaticamente
        let calibrated = false; // apenas uma vez por entrada no modo

        const sync = () => {
          const t = audio.currentTime + dynamicOffset; // aplica offset (adianta/atrasa letra)
          for (let i = 0; i < __lrcVerses.length; i++) {
            const cur = __lrcVerses[i];
            const next = __lrcVerses[i + 1];
            const on = t >= cur.time && (!next || t < next.time);
            cur.el.classList.toggle("active", on);

            // Calibração automática (uma vez): mede atraso/adianto na primeira ativação real
            if (on && !calibrated && !cur._seen) {
              const diff = t - cur.time; // >0 = letra atrasada; <0 = adiantada
              if (Math.abs(diff) > 0.12) {
                // Corrige em uma tacada só, limitado para evitar overshoot
                const correction = Math.max(-0.8, Math.min(0.8, -diff));
                dynamicOffset += correction;
              }
              calibrated = true;
            }
            if (on) cur._seen = true;

            if (on && lastIndex !== i) {
              lastIndex = i;
              cur.el.scrollIntoView({ behavior: "smooth", block: "center" });
            }
          }
          __lrcRaf = requestAnimationFrame(sync);
        };

        // inicia RAF quando realmente estiver tocando
        if (audio.readyState >= 2) requestAnimationFrame(sync);
        else
          audio.addEventListener("playing", () => requestAnimationFrame(sync), {
            once: true,
          });

        // listeners para pausar/retomar raf apropriadamente (uma vez)
        if (!__audioListenersBound) {
          __audioListenersBound = true;
          audio.addEventListener(
            "pause",
            () => {
              if (__lrcRaf) cancelAnimationFrame(__lrcRaf);
            },
            { passive: true }
          );
          audio.addEventListener(
            "seeking",
            () => {
              if (__lrcRaf) cancelAnimationFrame(__lrcRaf);
            },
            { passive: true }
          );
          audio.addEventListener(
            "ratechange",
            () => {
              /* se alterar velocidade, remove calibração */
            },
            { passive: true }
          );
          audio.addEventListener(
            "playing",
            () => {
              if (!__isLrc) return;
              if (__lrcRaf) cancelAnimationFrame(__lrcRaf);
              __lrcRaf = requestAnimationFrame(sync);
            },
            { passive: true }
          );
        }
      }

      function exitLrcMode() {
        __isLrc = false;
        stopLrcSync();
        try {
          audio.pause();
          audio.currentTime = 0;
        } catch (_) {}
        showListenButton();
        clearOriginalFlow();
        delay = 500;
        startOriginalFlow();
        window.scrollTo({ top: 0, behavior: "smooth" });
      }
      {
        __isLrc = false;
        stopLrcSync();
        try {
          audio.pause();
          audio.currentTime = 0;
        } catch (_) {}
        showListenButton();
        clearOriginalFlow();
        delay = 500;
        startOriginalFlow();
        window.scrollTo({ top: 0, behavior: "smooth" });
      }

      // wire initial button
      document.getElementById("lrcToggle").onclick = enableLrcMode;
    </script>
  </body>
</html>
