<!DOCTYPE html>
<html lang="pt-BR" data-theme="light">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <meta name="color-scheme" content="light dark" />
    <title>Boa noite 19/11/2025</title>

    <style>
      :root {
        --bg-light1: #faf8ff;
        --bg-light2: #eef6ff;
        --bg-dark1: #050510;
        --bg-dark2: #161623;

        --card-light: rgba(255, 255, 255, 0.82);
        --card-dark: rgba(10, 10, 20, 0.86);

        --fg-light: #111827;
        --fg-dark: #e5e7eb;

        --accent: #7c3aed;
        --accent-soft: rgba(124, 58, 237, 0.18);
        --accent-soft-strong: rgba(124, 58, 237, 0.32);

        --muted: #6b7280;
        --muted-dark: #9ca3af;

        --glass: blur(14px);
        --transition: 0.35s ease;
      }

      html[data-theme="light"] {
        --bg1: var(--bg-light1);
        --bg2: var(--bg-light2);
        --card: var(--card-light);
        --fg: var(--fg-light);
        --muted-final: var(--muted);
      }

      html[data-theme="dark"] {
        --bg1: var(--bg-dark1);
        --bg2: var(--bg-dark2);
        --card: var(--card-dark);
        --fg: var(--fg-dark);
        --muted-final: var(--muted-dark);
      }

      html,
      body {
        margin: 0;
        padding: 0;
      }

      body {
        min-height: 100vh;
        font-family: system-ui, -apple-system, BlinkMacSystemFont, "Inter",
          sans-serif;
        color: var(--fg);
        background: radial-gradient(
            circle at 0% 0%,
            rgba(124, 58, 237, 0.18),
            transparent 50%
          ),
          radial-gradient(
            circle at 100% 100%,
            rgba(96, 165, 250, 0.16),
            transparent 52%
          ),
          linear-gradient(145deg, var(--bg1), var(--bg2));
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 20px;
        transition: background var(--transition), color var(--transition);
        text-align: justify;
      }

      .toggle-theme {
        position: fixed;
        top: 14px;
        right: 14px;
        background: var(--card);
        border: 1px solid var(--accent-soft);
        padding: 8px 10px;
        border-radius: 999px;
        cursor: pointer;
        transition: transform var(--transition), box-shadow var(--transition),
          background var(--transition), border-color var(--transition);
        backdrop-filter: var(--glass);
        font-size: 1.1rem;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        box-shadow: 0 6px 18px rgba(0, 0, 0, 0.12);
      }

      .toggle-theme span {
        font-size: 0.8rem;
        margin-left: 6px;
        color: var(--muted-final);
      }

      .wrapper {
        max-width: 440px;
        width: 100%;
      }

      .card {
        background: var(--card);
        backdrop-filter: var(--glass);
        border-radius: 26px;
        padding: 22px 20px;
        box-shadow: 0 10px 32px rgba(15, 23, 42, 0.24);
        border: 1px solid rgba(148, 163, 184, 0.22);
        transition: var(--transition);
        position: relative;
        overflow: hidden;
      }

      .card:hover {
        transform: translateY(-3px);
        box-shadow: 0 16px 40px rgba(15, 23, 42, 0.32);
        border-color: var(--accent-soft-strong);
      }

      .chip-row,
      .meta-row,
      .footer-row {
        position: relative;
        z-index: 2;
      }

      .chip-row {
        display: flex;
        justify-content: space-between;
        margin-bottom: 12px;
      }

      .chip {
        padding: 5px 11px;
        border-radius: 999px;
        background: rgba(255, 255, 255, 0.05);
        border: 1px solid var(--accent-soft);
        font-size: 0.74rem;
        letter-spacing: 0.12em;
        text-transform: uppercase;
        color: var(--muted-final);
        display: inline-flex;
        align-items: center;
        gap: 6px;
      }

      .time-label {
        font-size: 0.7rem;
        color: var(--muted-final);
        display: inline-flex;
        align-items: center;
        gap: 6px;
      }

      .dot {
        width: 5px;
        height: 5px;
        border-radius: 999px;
        background: var(--accent);
      }

      .meta-row {
        display: flex;
        gap: 12px;
        margin-bottom: 14px;
        font-size: 0.78rem;
        color: var(--muted-final);
      }

      .pill {
        display: inline-flex;
        align-items: center;
        gap: 6px;
        padding: 5px 9px;
        border-radius: 999px;
        background: rgba(255, 255, 255, 0.04);
      }

      .pill strong {
        color: var(--fg);
      }

      .message-bubble {
        background: rgba(255, 255, 255, 0.06);
        border: 1px solid rgba(148, 163, 184, 0.35);
        border-radius: 18px;
        padding: 14px;
        position: relative;
        backdrop-filter: var(--glass);
      }

      .message-bubble::after {
        content: "";
        position: absolute;
        bottom: -7px;
        right: 26px;
        width: 14px;
        height: 14px;
        background: inherit;
        border-right: inherit;
        border-bottom: inherit;
        transform: rotate(45deg);
      }

      .msg {
        margin: 0 0 12px;
        font-size: 1.02rem;
        line-height: 1.6;
      }

      .footer-row {
        display: flex;
        justify-content: flex-end;
        font-size: 0.72rem;
        color: var(--muted-final);
        margin-top: 10px;
      }

      .checks {
        color: #22c55e;
      }
    </style>
  </head>

  <body>
    <button class="toggle-theme" id="themeToggle">🌓 <span>tema</span></button>

    <div class="wrapper">
      <div class="card">
        <div class="chip-row">
          <div class="chip">
            <span class="emoji">💌</span>
            <span>Mensagem</span>
          </div>
          <div class="time-label"><span class="dot"></span> agora mesmo</div>
        </div>

        <div class="meta-row">
          <div class="pill"><span>De:</span> <strong>._.. ...</strong></div>
          <div class="pill"><span>Para:</span> <strong>Cléia</strong></div>
        </div>

        <div class="message-bubble">
          <p class="msg">Boa noite, Cléia. 🌙✨</p>
          <p class="msg">
            Que teu fim de dia te devolva em descanso o quanto dedicastes ao
            mundo hoje.
          </p>
          <p class="msg">
            Se sentir uma brisa diferente no seu rosto, fui eu.🫂❤️
          </p>
          <p class="msg">Dorme bem. Fica bem.</p>
        </div>

        <div class="footer-row">
          <span class="checks">✔✔</span> lida em pensamento
        </div>
      </div>
    </div>

    <script>
      const root = document.documentElement;
      const themeToggle = document.getElementById("themeToggle");

      themeToggle.addEventListener("click", () => {
        const actual = root.getAttribute("data-theme");
        const next = actual === "light" ? "dark" : "light";
        root.setAttribute("data-theme", next);
      });
    </script>
  </body>
</html>
