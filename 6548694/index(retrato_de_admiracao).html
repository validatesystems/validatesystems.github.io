<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <meta name="color-scheme" content="light dark" />
    <link rel="stylesheet" href="./modal.css" />
    <script type="module" src="./modal.js"></script>
    <script type="module" src="./comment.js"></script>
    <script>
      // Configuração do endpoint e segredo (ajuste aqui uma vez)
      window.COMMENT_CONFIG = {
        GAS_ENDPOINT:
          "https://script.google.com/macros/s/AKfycbzaoXScQkYEQN7jpXEEEcvduWEyCVXZXfSFbLWv7vCKfQwMUd3_kSqaF7H6dypC70kiBg/exec",
        SECRET: "6548694", // exemplo; troque se quiser
      };
    </script>
    <title>Retrato de admiração — papel manuscrito</title>

    <!-- Fontes: manuscrita + assinatura -->
    <link
      href="https://fonts.googleapis.com/css2?family=Caveat:wght@400;600;700&family=Great+Vibes&display=swap"
      rel="stylesheet"
    />

    <style>
      /* Corrige cortes por conta do padding + vw no mobile */
      *,
      *::before,
      *::after {
        box-sizing: border-box;
      }

      :root {
        --bg1: #fbf7ff;
        --bg2: #fff8f1;
        --ink: #2a1d3a;
        --muted: #6f5d83;
        --paper: #fffef9;
        --rule: rgba(62, 122, 235, 0.18);
        --margin-rule: rgba(235, 62, 62, 0.35);
        --accent: #b47aff;
      }

      @media (prefers-color-scheme: dark) {
        :root {
          --bg1: #100f1a;
          --bg2: #221a2d;
          --ink: #ece7ff; /* tinta clara no dark */
          --muted: #b4a8d6;
          --paper: #1d1b26; /* papel levemente escuro */
          --rule: rgba(180, 200, 255, 0.15);
          --margin-rule: rgba(255, 120, 120, 0.25);
          --accent: #7cc2ff;
        }
      }

      body {
        margin: 0;
        font-family: "Caveat", cursive;
        background: linear-gradient(120deg, var(--bg1), var(--bg2));
        color: var(--ink);
        min-height: 100vh;
        display: grid;
        place-items: center;
        padding: 20px;
      }

      .paper {
        position: relative;
        width: min(900px, 100%);
        margin: 0 auto;
        padding: 34px clamp(32px, 4vw, 56px) 34px 96px; /* mais respiro à direita */
        background: var(--paper);
        border-radius: 16px;
        box-shadow: 0 10px 30px rgba(0, 0, 0, 0.1);
        border: 1px solid rgba(0, 0, 0, 0.06);
        background-image: linear-gradient(
            90deg,
            transparent 78px,
            var(--margin-rule) 78px,
            var(--margin-rule) 80px,
            transparent 80px
          ),
          repeating-linear-gradient(
            to bottom,
            transparent 0 28px,
            var(--rule) 28px 29px
          );
        background-size: 100% 100%, 100% 29px;
      }

      .paper::after {
        /* textura leve */
        content: "";
        position: absolute;
        inset: 0;
        pointer-events: none;
        background: radial-gradient(
            1200px 600px at 20% 10%,
            rgba(0, 0, 0, 0.04),
            transparent 60%
          ),
          radial-gradient(
            900px 700px at 80% 90%,
            rgba(0, 0, 0, 0.03),
            transparent 60%
          );
        mix-blend-mode: multiply;
        opacity: 0.5;
        border-radius: 16px;
      }

      h1 {
        text-align: center;
        margin: 0 0 18px 0;
        font-weight: 700;
        color: var(--accent);
        font-size: clamp(1.6rem, 1.2rem + 2vw, 2.3rem);
      }

      .message {
        font-size: clamp(1.15rem, 1rem + 1.2vw, 1.8rem);
        line-height: 1.65;
        margin: 16px 0;
        opacity: 1;
        white-space: normal;
        overflow: visible;
        word-break: break-word;
        overflow-wrap: anywhere; /* garante quebra */
        hyphens: auto;
      }

      .controls {
        display: flex;
        gap: 10px;
        margin-top: 16px;
        justify-content: center;
      }

      button {
        padding: 10px 16px;
        border: none;
        border-radius: 12px;
        cursor: pointer;
        background: var(--accent);
        color: #fff;
        font-family: "Caveat", cursive;
        font-size: 1.25rem;
      }
      button:hover {
        opacity: 0.92;
      }

      /* Responsivo p/ smartphones */
      @media (max-width: 640px) {
        body {
          padding: 12px;
        }
        .paper {
          width: 100%; /* não ultrapassa viewport */
          padding: 26px clamp(26px, 6vw, 48px) 26px 78px; /* mais respiro à direita */
          background-image: linear-gradient(
              90deg,
              transparent 66px,
              var(--margin-rule) 66px,
              var(--margin-rule) 68px,
              transparent 68px
            ),
            repeating-linear-gradient(
              to bottom,
              transparent 0 26px,
              var(--rule) 26px 27px
            );
          background-size: 100% 100%, 100% 27px;
        }
        .message {
          font-size: clamp(1.05rem, 0.95rem + 3.5vw, 1.5rem);
          line-height: 1.6;
        }
      }

      /* ===== Assinatura ===== */
      .signature {
        margin-top: 28px;
        text-align: right;
        color: var(--ink);
        opacity: 0; /* aparece ao final */
        transform: translateY(6px);
        transition: opacity 0.6s ease, transform 0.6s ease;
      }
      .signature span {
        display: inline-block;
        font-family: "Great Vibes", "Caveat", cursive;
        font-size: clamp(1.6rem, 1.1rem + 2.2vw, 2.6rem);
        letter-spacing: 0.6px;
      }
      .signature svg {
        display: inline-block;
        height: 18px;
        width: 120px;
        margin-left: 10px;
        vertical-align: middle;
      }
      .signature path {
        stroke: var(--ink);
        stroke-width: 2;
        fill: none;
        stroke-linecap: round;
        stroke-dasharray: 400;
        stroke-dashoffset: 400;
      }
      .signature.show {
        opacity: 1;
        transform: translateY(0);
      }
      .signature.show path {
        animation: write-underline 1.2s ease forwards;
      }
      @keyframes write-underline {
        to {
          stroke-dashoffset: 0;
        }
      }
    </style>
  </head>

  <body>
    <main class="paper" role="main">
      <h1>💌 Retrato de admiração</h1>

      <div id="textos" aria-live="polite"></div>

      <!-- Assinatura (aparece no final com sublinhado desenhado) -->
      <div id="assinatura" class="signature" aria-label="Assinatura">
        <span>._.. ...</span>
        <svg viewBox="0 0 120 18" aria-hidden="true">
          <path d="M2 12 C 20 18, 40 6, 58 12 S 100 18, 118 10" />
        </svg>
      </div>

      <div class="controls">
        <button id="rever" type="button">Ler de novo</button>
        <button
          id="openComment"
          class="btn-comment"
          aria-label="Abrir comentário"
        >
          💬 Comentar
        </button>
      </div>
    </main>

    <script>
      const mensagens = [
        "Cléia, te admiro de verdade, seu jeito anormal de ser. Consigo te ver como você é, mesmo faltando muitas partes que só o tempo mostraria. A sua essência é linda e não requer de provas, sua luz faz isso.",
        "Você brilha intensamente quando sorri, mas eu sei que trava batalhas internas. Ninguém entenderia essa contradição, mas eu sim. Isso me encanta? Sim, porque demonstra força, resistência e beleza, como um diamante lapidado.",
        "Como um diamante: em dias de luz, brilha e encanta; em dias escuros, resiste ao frio e ao tempo.",
        "Felizes as pessoas que têm a oportunidade de conviver com você e que saibam te ler. De verdade, te acho incrível. Quando digo isso, considero tudo até os seus desequilíbrios (quem não tem?).",
        "O que importa é que sua presença traz calma, você vai rir disso, eu sei, mas acredite em mim.",
        "Sabe, eu acho que até seu lado sombrio gosta da sua luz, afinal você não é normal (e eu admiro isso, é lindo).",
        "Gostaria de dizer isso pessoalmente, mas já imagino você rindo de cada palavra dita, eu não conseguiria terminar de falar porque estaria rindo junto com você.",
        "(...) Aqui escrevi uma coisa que vai ficar só em pensamento (existem limites!). Quem sabe um dia eu te fale.",
        "Quero que você saiba de tudo isso sem piadas ou memes.",
      ];

      const container = document.getElementById("textos");
      const btn = document.getElementById("rever");
      const elSig = document.getElementById("assinatura");
      const elSigPath = elSig.querySelector("path");

      // digitação caractere a caractere, velocidade humana irregular
      async function typeText(p, text) {
        p.textContent = "";
        for (let i = 0; i < text.length; i++) {
          p.textContent += text[i];
          const delay = 25 + Math.random() * 45; // 25–70ms por caractere
          await new Promise((res) => setTimeout(res, delay));
        }
      }

      async function mostrarMensagens() {
        container.innerHTML = "";

        // esconde e reseta assinatura
        elSig.classList.remove("show");
        const len = elSigPath.getTotalLength();
        elSigPath.style.strokeDasharray = len;
        elSigPath.style.strokeDashoffset = len;

        // escreve um parágrafo por vez
        for (const msg of mensagens) {
          const p = document.createElement("p");
          p.className = "message";
          container.appendChild(p);

          await typeText(p, msg); // espera terminar o parágrafo atual
          await new Promise((res) => setTimeout(res, 420)); // pausa curtinha antes do próximo
        }

        // pequena pausa e revela a assinatura com sublinhado animado
        await new Promise((res) => setTimeout(res, 280));
        elSig.classList.add("show");
      }

      btn.addEventListener("click", mostrarMensagens);
      mostrarMensagens();
    </script>
  </body>
</html>
