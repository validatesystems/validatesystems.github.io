<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <title>Mapa de refúgios</title>

    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=DM+Serif+Display&family=Inter:wght@300;400;500&display=swap"
    />

    <style>
      :root {
        --bg1: #020617;
        --bg2: #020617;
        --bg-accent1: #1f2937;
        --bg-accent2: #0f172a;
        --glow: #fbbf24;
        --text-main: #f9fafb;
        --text-soft: #cbd5f5;
        --paper: #fdfaf3;
        --ink: #1f2933;
        --soft-ink: #6b6b6b;
      }

      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      html,
      body {
        height: 100%;
      }

      body {
        min-height: 100vh;
        font-family: "Inter", system-ui, -apple-system, BlinkMacSystemFont,
          "Segoe UI", sans-serif;
        color: var(--text-main);
        background: radial-gradient(circle at 0% 0%, #0b1220, transparent 55%),
          radial-gradient(circle at 100% 0%, #1f2937, transparent 55%),
          radial-gradient(circle at 50% 100%, #020617, transparent 60%),
          linear-gradient(160deg, var(--bg1), var(--bg2));
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 18px;
        position: relative;
        overflow: auto;
      }

      /* ruído suave de fundo */
      body::before {
        content: "";
        position: fixed;
        inset: 0;
        pointer-events: none;
        background-image: url("https://www.transparenttextures.com/patterns/asfalt-light.png");
        opacity: 0.22;
        mix-blend-mode: soft-light;
        z-index: 0;
      }

      .shell {
        position: relative;
        z-index: 1;
        width: 100%;
        max-width: 620px;
      }

      .card {
        background: radial-gradient(circle at 10% 0%, #1f2937, #020617);
        border-radius: 26px;
        padding: 24px 22px 18px;
        box-shadow: 0 26px 70px rgba(0, 0, 0, 0.8),
          0 0 0 1px rgba(148, 163, 184, 0.35);
        border: 1px solid rgba(30, 64, 175, 0.9);
        position: relative;
        overflow: hidden;
        animation: cardIn 650ms ease-out;
      }

      @keyframes cardIn {
        from {
          opacity: 0;
          transform: translateY(18px) scale(0.97);
          filter: blur(3px);
        }
        to {
          opacity: 1;
          transform: translateY(0) scale(1);
          filter: blur(0);
        }
      }

      .chip {
        display: inline-flex;
        align-items: center;
        gap: 6px;
        padding: 4px 12px;
        border-radius: 999px;
        font-size: 11px;
        letter-spacing: 0.16em;
        text-transform: uppercase;
        color: var(--text-soft);
        background: rgba(15, 23, 42, 0.8);
        border: 1px solid rgba(148, 163, 184, 0.7);
        margin-bottom: 14px;
      }

      .chip-dot {
        width: 8px;
        height: 8px;
        border-radius: 999px;
        background: var(--glow);
        box-shadow: 0 0 0 5px rgba(250, 204, 21, 0.24);
        animation: pulseChip 3.4s ease-in-out infinite;
      }

      @keyframes pulseChip {
        0% {
          transform: scale(1);
          box-shadow: 0 0 0 5px rgba(250, 204, 21, 0.24);
        }
        50% {
          transform: scale(1.12);
          box-shadow: 0 0 0 9px rgba(250, 204, 21, 0.06);
        }
        100% {
          transform: scale(1);
          box-shadow: 0 0 0 5px rgba(250, 204, 21, 0.24);
        }
      }

      h1 {
        font-family: "DM Serif Display", serif;
        font-size: 1.8rem;
        margin-bottom: 4px;
        color: #e5e7eb;
      }

      .subtitle {
        font-size: 0.9rem;
        color: var(--text-soft);
        margin-bottom: 20px;
      }

      .map-wrapper {
        position: relative;
        margin-bottom: 18px;
      }

      .map-hint {
        font-size: 0.8rem;
        color: var(--text-soft);
        margin-bottom: 10px;
      }

      .map-area {
        position: relative;
        border-radius: 999px;
        background: radial-gradient(circle at 30% 10%, #1f2937, #020617 70%);
        border: 1px solid rgba(148, 163, 184, 0.6);
        box-shadow: 0 22px 46px rgba(0, 0, 0, 0.9),
          0 0 0 1px rgba(15, 23, 42, 0.9);
        height: 260px;
        overflow: hidden;
      }

      @media (min-width: 520px) {
        .map-area {
          height: 280px;
        }
      }

      .map-area::before {
        content: "";
        position: absolute;
        inset: -20%;
        background: radial-gradient(
            circle at 10% 20%,
            rgba(148, 163, 184, 0.18),
            transparent 55%
          ),
          radial-gradient(
            circle at 80% 80%,
            rgba(30, 64, 175, 0.35),
            transparent 60%
          );
        opacity: 0.8;
        pointer-events: none;
      }

      .map-lines {
        position: absolute;
        inset: 10%;
        opacity: 0.28;
      }

      .map-lines svg {
        width: 100%;
        height: 100%;
      }

      .ref-point {
        position: absolute;
        width: 18px;
        height: 18px;
        border-radius: 999px;
        background: radial-gradient(circle at 30% 30%, #fef9c3, #facc15);
        box-shadow: 0 0 12px rgba(250, 204, 21, 0.9),
          0 0 0 1px rgba(15, 23, 42, 0.9);
        display: flex;
        align-items: center;
        justify-content: center;
        cursor: pointer;
        transform: translate(-50%, -50%);
        transition: transform 0.18s ease, box-shadow 0.18s ease,
          opacity 0.18s ease;
      }

      .ref-point::after {
        content: "";
        position: absolute;
        width: 34px;
        height: 34px;
        border-radius: 999px;
        border: 1px solid rgba(250, 204, 21, 0.32);
        opacity: 0;
        transform: scale(0.8);
        transition: opacity 0.18s ease, transform 0.18s ease;
      }

      .ref-point:hover {
        transform: translate(-50%, -50%) scale(1.08);
        box-shadow: 0 0 16px rgba(250, 204, 21, 1),
          0 0 0 1px rgba(15, 23, 42, 0.9);
      }

      .ref-point.active {
        box-shadow: 0 0 26px rgba(250, 204, 21, 1),
          0 0 0 2px rgba(15, 23, 42, 1);
      }

      .ref-point.active::after {
        opacity: 1;
        transform: scale(1);
      }

      .ref-label {
        position: absolute;
        transform: translate(-50%, calc(-50% - 20px));
        font-size: 0.7rem;
        color: var(--text-soft);
        text-shadow: 0 1px 3px rgba(0, 0, 0, 0.9);
        pointer-events: none;
        white-space: nowrap;
        opacity: 0.8;
      }

      .ref-card {
        margin-top: 12px;
        background: var(--paper);
        border-radius: 14px;
        padding: 14px 14px 12px;
        box-shadow: 0 16px 32px rgba(0, 0, 0, 0.5),
          0 0 0 1px rgba(0, 0, 0, 0.12);
        position: relative;
        overflow: hidden;
        color: var(--ink);
        transform-origin: center top;
        transition: opacity 0.25s ease, transform 0.25s ease;
      }

      .ref-card.hidden {
        opacity: 0;
        transform: translateY(8px) scale(0.98);
        pointer-events: none;
      }

      .ref-card::before {
        content: "";
        position: absolute;
        inset: 0;
        background-image: url("https://www.transparenttextures.com/patterns/paper-1.png");
        opacity: 0.4;
        pointer-events: none;
      }

      .ref-card-inner {
        position: relative;
        z-index: 1;
      }

      .ref-title {
        font-family: "DM Serif Display", serif;
        font-size: 1.08rem;
        margin-bottom: 6px;
      }

      .ref-text {
        font-size: 0.96rem;
        line-height: 1.7;
        color: var(--soft-ink);
      }

      .ref-foot {
        margin-top: 10px;
        display: flex;
        justify-content: space-between;
        align-items: center;
        gap: 6px;
        font-size: 0.78rem;
        color: var(--soft-ink);
      }

      .ref-tag {
        padding: 2px 9px;
        border-radius: 999px;
        border: 1px solid rgba(15, 23, 42, 0.35);
        background: rgba(249, 250, 251, 0.86);
        font-size: 0.7rem;
        text-transform: uppercase;
        letter-spacing: 0.13em;
        color: #4b5563;
      }

      .ref-btn-reset {
        border: none;
        background: transparent;
        color: #4b5563;
        cursor: pointer;
        font-size: 0.76rem;
        text-decoration: underline;
        padding: 3px 0;
      }

      .signature {
        margin-top: 16px;
        text-align: right;
        font-size: 0.78rem;
        color: var(--text-soft);
      }

      @media (max-width: 480px) {
        .card {
          padding: 20px 16px 18px;
          border-radius: 22px;
        }

        h1 {
          font-size: 1.6rem;
        }

        .subtitle {
          font-size: 0.86rem;
        }

        .map-area {
          height: 240px;
        }

        .ref-card {
          padding: 12px 12px 10px;
        }

        .ref-title {
          font-size: 1rem;
        }

        .ref-text {
          font-size: 0.92rem;
        }
      }
    </style>
  </head>

  <body>
    <div class="shell">
      <article class="card">
        <div class="chip">
          <span class="chip-dot"></span>
          mapa de refúgios
        </div>

        <h1>Cléia, olha o teu mapa.</h1>
        <p class="subtitle">
          Espalhei alguns lugares inventados onde tua cabeça pode descansar um
          pouco. É só tocar em um desses pontos de luz.
        </p>

        <section class="map-wrapper">
          <p class="map-hint">
            toque em um ponto do mapa para abrir um refúgio.
          </p>

          <div class="map-area" id="mapArea">
            <div class="map-lines">
              <svg viewBox="0 0 100 100" preserveAspectRatio="none">
                <polyline
                  points="10,35 28,18 50,22 68,40 82,65 60,80 34,78 18,58 10,35"
                  fill="none"
                  stroke="rgba(148,163,184,0.55)"
                  stroke-width="0.6"
                  stroke-linecap="round"
                  stroke-linejoin="round"
                />
              </svg>
            </div>

            <!-- Pontos do mapa (inseridos via JS) -->
          </div>

          <div class="ref-card hidden" id="refCard">
            <div class="ref-card-inner">
              <h2 class="ref-title" id="refTitle"></h2>
              <p class="ref-text" id="refText"></p>
              <div class="ref-foot">
                <span class="ref-tag" id="refTag"></span>
                <button class="ref-btn-reset" id="resetBtn">
                  voltar ao mapa
                </button>
              </div>
            </div>
          </div>
        </section>

        <p class="signature">._.. ...</p>
      </article>
    </div>

    <script>
      const refugios = [
        {
          id: "silencio",
          x: "18%",
          y: "36%",
          label: "silêncio leve",
          titulo: "Refúgio do silêncio",
          texto:
            "Aqui, o silêncio não te cobra resposta, não te aperta e não te julga. Ele só encosta em você com cuidado e te deixa existir no teu próprio tempo.",
          tag: "pausa",
        },
        {
          id: "abraco",
          x: "36%",
          y: "20%",
          label: "abraço escondido",
          titulo: "Refúgio do abraço escondido",
          texto:
            "Não é abraço de verdade, mas tem a intenção certa. É aquele tipo de abraço que acalma sem apertar, que diz sem falar: eu sei que seu dia não é leve, mas eu torço pela parte sua que segue em pé.",
          tag: "aconchego",
        },
        {
          id: "pensamento",
          x: "54%",
          y: "28%",
          label: "pensamento desfocado",
          titulo: "Refúgio do pensamento desfocado",
          texto:
            "Quando sua cabeça fica cheia demais, aqui as coisas desfocam por alguns instantes. Não é para esquecer, é só para dar um intervalo entre o peso e o próximo passo.",
          tag: "respiro",
        },
        {
          id: "riso",
          x: "70%",
          y: "44%",
          label: "riso bobo",
          titulo: "Refúgio do riso bobo",
          texto:
            "O lugar onde mora aquele seu riso curto, meio contido, meio de canto de boca. Ele aparece quando você nem percebe e, por alguns segundos, o mundo fica menos sério.",
          tag: "leveza",
        },
        {
          id: "onda",
          x: "82%",
          y: "66%",
          label: "onda mansa",
          titulo: "Refúgio da onda mansa",
          texto:
            "É como se um pedacinho de litoral silencioso coubesse na palma da tua mão. Aqui, tudo em volta desacelera, e você lembra que também merece mar calmo de vez em quando.",
          tag: "calma",
        },
        {
          id: "dia",
          x: "58%",
          y: "80%",
          label: "dia que não pede nada",
          titulo: "Refúgio do dia que não pede nada",
          texto:
            "Sabe aquele dia que não exige força, nem pressa, nem sorriso no automático? Aqui, nada te cobra postura ou coragem. Você pode só existir, sem performance.",
          tag: "descanso",
        },
        {
          id: "versao",
          x: "26%",
          y: "74%",
          label: "versão escondida",
          titulo: "Refúgio da versão tua que você esconde",
          texto:
            "A parte bonita que você finge que é normal e deixa passar como se fosse qualquer coisa. Aqui, essa versão sua não é cenário de fundo. Ela é protagonista.",
          tag: "essência",
        },
      ];

      const mapArea = document.getElementById("mapArea");
      const refCard = document.getElementById("refCard");
      const refTitle = document.getElementById("refTitle");
      const refText = document.getElementById("refText");
      const refTag = document.getElementById("refTag");
      const resetBtn = document.getElementById("resetBtn");

      let activeId = null;

      function createPoints() {
        refugios.forEach((ref) => {
          const point = document.createElement("button");
          point.type = "button";
          point.className = "ref-point";
          point.style.left = ref.x;
          point.style.top = ref.y;
          point.dataset.refId = ref.id;

          const label = document.createElement("div");
          label.className = "ref-label";
          label.textContent = ref.label;

          label.style.left = ref.x;
          label.style.top = ref.y;

          point.addEventListener("click", () => openRefugio(ref.id));

          mapArea.appendChild(point);
          mapArea.appendChild(label);
        });
      }

      function openRefugio(id) {
        const ref = refugios.find((r) => r.id === id);
        if (!ref) return;

        activeId = id;

        // atualizar visual dos pontos
        document.querySelectorAll(".ref-point").forEach((p) => {
          if (p.dataset.refId === id) {
            p.classList.add("active");
          } else {
            p.classList.remove("active");
          }
        });

        // preencher card
        refTitle.textContent = ref.titulo;
        refText.textContent = ref.texto;
        refTag.textContent = ref.tag;

        // mostrar card
        refCard.classList.remove("hidden");
      }

      function resetMap() {
        activeId = null;
        document.querySelectorAll(".ref-point").forEach((p) => {
          p.classList.remove("active");
        });
        refCard.classList.add("hidden");
      }

      resetBtn.addEventListener("click", resetMap);

      createPoints();
    </script>
    <script src="./js/card-telemetry.js"></script>
  </body>
</html>
