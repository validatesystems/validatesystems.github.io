<!DOCTYPE html>
<html lang="pt-BR" data-theme="light">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <meta name="color-scheme" content="light dark" />
    <title>Interior que mora em você</title>

    <style>
      :root {
        --bg-light1: #f5f7ff;
        --bg-light2: #e9f5ff;
        --bg-dark1: #050814;
        --bg-dark2: #0b1220;

        --card-light: rgba(255, 255, 255, 0.92);
        --card-dark: rgba(15, 23, 42, 0.94);

        --fg-light: #0f172a;
        --fg-dark: #e5e7eb;

        --muted-light: #6b7280;
        --muted-dark: #9ca3af;

        --accent: #7c3aed;
        --accent-soft: rgba(124, 58, 237, 0.18);
        --accent-soft-2: rgba(56, 189, 248, 0.18);

        --glass: blur(16px);
        --transition: 0.35s ease;
      }

      html[data-theme="light"] {
        --bg1: var(--bg-light1);
        --bg2: var(--bg-light2);
        --card: var(--card-light);
        --fg: var(--fg-light);
        --muted: var(--muted-light);
      }

      html[data-theme="dark"] {
        --bg1: var(--bg-dark1);
        --bg2: var(--bg-dark2);
        --card: var(--card-dark);
        --fg: var(--fg-dark);
        --muted: var(--muted-dark);
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        font-family: system-ui, -apple-system, BlinkMacSystemFont, "Inter",
          sans-serif;
        background: radial-gradient(
            circle at 10% 15%,
            rgba(96, 165, 250, 0.18),
            transparent 60%
          ),
          radial-gradient(
            circle at 90% 85%,
            rgba(124, 58, 237, 0.22),
            transparent 60%
          ),
          linear-gradient(145deg, var(--bg1), var(--bg2));
        min-height: 100vh;
        display: flex;
        justify-content: center;
        align-items: center;
        padding: 26px 18px;
        color: var(--fg);
        transition: background var(--transition), color var(--transition);
      }

      .toggle-theme {
        position: fixed;
        top: 14px;
        right: 14px;
        background: var(--card);
        border: 1px solid var(--accent-soft);
        padding: 7px 11px;
        border-radius: 999px;
        cursor: pointer;
        backdrop-filter: var(--glass);
        display: inline-flex;
        align-items: center;
        gap: 6px;
        font-size: 0.9rem;
        transition: var(--transition);
      }

      .toggle-theme span {
        font-size: 0.8rem;
        color: var(--muted);
      }

      .wrapper {
        max-width: 540px;
        width: 100%;
      }

      .card-shell {
        position: relative;
        margin-bottom: 14px;
      }

      .card {
        background: var(--card);
        border-radius: 24px;
        padding: 22px 20px 20px;
        box-shadow: 0 18px 54px rgba(15, 23, 42, 0.34);
        border: 1px solid rgba(148, 163, 184, 0.34);
        backdrop-filter: var(--glass);
        position: relative;
        overflow: hidden;
        opacity: 0;
        transform: translateY(8px);
        transition: opacity 0.3s ease, transform 0.3s ease,
          background var(--transition), border-color var(--transition);
      }

      .card.visible {
        opacity: 1;
        transform: translateY(0);
      }

      .card::before {
        content: "";
        position: absolute;
        width: 160px;
        height: 160px;
        border-radius: 50%;
        background: radial-gradient(
          circle,
          rgba(124, 58, 237, 0.26),
          transparent 70%
        );
        top: -70px;
        right: -40px;
        opacity: 0.5;
        pointer-events: none;
      }

      .card::after {
        content: "";
        position: absolute;
        width: 120px;
        height: 120px;
        border-radius: 50%;
        background: radial-gradient(
          circle,
          rgba(56, 189, 248, 0.22),
          transparent 70%
        );
        bottom: -60px;
        left: -30px;
        opacity: 0.45;
        pointer-events: none;
      }

      .card.highlight {
        border-style: solid;
        border-width: 1px;
        border-color: rgba(124, 58, 237, 0.65);
        box-shadow: 0 20px 60px rgba(88, 28, 135, 0.55);
      }

      .card-footer {
        border-style: dashed;
        border-color: rgba(148, 163, 184, 0.7);
        background: rgba(15, 23, 42, 0.04);
      }

      .label-row {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-bottom: 8px;
        position: relative;
        z-index: 1;
      }

      .chip {
        display: inline-flex;
        align-items: center;
        gap: 6px;
        padding: 4px 10px;
        border-radius: 999px;
        border: 1px solid var(--accent-soft);
        font-size: 0.72rem;
        letter-spacing: 0.16em;
        text-transform: uppercase;
        color: var(--muted);
        background: rgba(15, 23, 42, 0.03);
      }

      .chip span.emoji {
        font-size: 0.95rem;
      }

      .small-tag {
        font-size: 0.72rem;
        color: var(--muted);
      }

      h1 {
        margin: 6px 0 12px;
        font-size: 1.35rem;
        position: relative;
        z-index: 1;
      }

      .step-label {
        font-size: 0.8rem;
        color: var(--muted);
        margin-bottom: 8px;
        position: relative;
        z-index: 1;
      }

      .msg {
        font-size: 1.04rem;
        line-height: 1.72;
        margin: 0;
        text-align: justify;
        position: relative;
        z-index: 1;
      }

      .msg strong {
        font-weight: 600;
      }

      .controls {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 10px;
      }

      .buttons {
        display: inline-flex;
        gap: 8px;
      }

      button.nav-btn {
        border: 0;
        border-radius: 999px;
        padding: 7px 13px;
        font-size: 0.86rem;
        cursor: pointer;
        display: inline-flex;
        align-items: center;
        gap: 6px;
        background: rgba(15, 23, 42, 0.06);
        color: var(--fg);
        transition: background 0.2s ease, transform 0.15s ease,
          opacity 0.2s ease;
      }

      button.nav-btn.primary {
        background: linear-gradient(
          120deg,
          rgba(124, 58, 237, 0.9),
          rgba(56, 189, 248, 0.9)
        );
        color: #f9fafb;
      }

      button.nav-btn:disabled {
        opacity: 0.45;
        cursor: default;
        transform: none;
      }

      button.nav-btn:not(:disabled):active {
        transform: scale(0.97);
      }

      .progress {
        display: inline-flex;
        align-items: center;
        gap: 4px;
      }

      .dot {
        width: 7px;
        height: 7px;
        border-radius: 999px;
        background: rgba(148, 163, 184, 0.6);
      }

      .dot.active {
        background: linear-gradient(
          120deg,
          rgba(124, 58, 237, 0.95),
          rgba(56, 189, 248, 0.95)
        );
      }

      .step-counter {
        font-size: 0.78rem;
        color: var(--muted);
        margin-left: 6px;
      }

      @media (max-width: 480px) {
        .card {
          padding: 20px 16px 18px;
          border-radius: 20px;
        }

        h1 {
          font-size: 1.24rem;
        }

        .msg {
          font-size: 0.98rem;
        }

        .controls {
          flex-direction: column-reverse;
          align-items: stretch;
        }

        .buttons {
          justify-content: space-between;
        }

        .progress {
          justify-content: center;
        }
      }
    </style>
  </head>

  <body>
    <button class="toggle-theme" id="themeToggle">🌓 <span>tema</span></button>

    <div class="wrapper">
      <div class="card-shell">
        <div id="card" class="card">
          <div class="label-row" id="labelRow">
            <div class="chip">
              <span class="emoji" id="chipEmoji">🌾</span>
              <span id="chipText">interior por fora e por dentro</span>
            </div>
            <span class="small-tag" id="smallTag">hoje, casa da mãe</span>
          </div>

          <h1 id="title">Cléia, o interior que mora em você</h1>

          <div class="step-label" id="stepLabel"></div>

          <p class="msg" id="message"></p>
        </div>
      </div>

      <div class="controls">
        <div class="progress" id="progress"></div>

        <div class="buttons">
          <button class="nav-btn" id="prevBtn">◀ <span>voltar</span></button>
          <button class="nav-btn primary" id="nextBtn">
            <span>avançar</span> ▶
          </button>
        </div>
      </div>
    </div>

    <script>
      const root = document.documentElement;
      const toggleTheme = document.getElementById("themeToggle");

      toggleTheme.addEventListener("click", () => {
        const current = root.getAttribute("data-theme") || "light";
        const next = current === "light" ? "dark" : "light";
        root.setAttribute("data-theme", next);
      });

      const steps = [
        {
          type: "normal",
          text: "Enquanto você está aí, no interior, na casa da sua mãe, com outros sons, outros cheiros, o tempo passando diferente, fico pensando que esse lugar conversa muito mais com o que existe dentro de você do que a cidade grande consegue alcançar.",
        },
        {
          type: "normal",
          text: "O interior de fora é esse que você está vendo agora: águas calmas, quintal que conhece seu passo, objetos que parecem te observar crescer desde sempre, gente que sabe seus apelidos mais íntimos.",
        },
        {
          type: "normal",
          text: "Já o interior de dentro é esse território que você guarda tão bem: o jeito sincero de sentir, as defesas que montou pelo caminho, a força que você usa para segurar o mundo nos ombros e, ainda assim, achar espaço para cuidar de quem está ao redor.",
        },
        {
          type: "normal",
          text: "Quando você volta para a casa da sua mãe, não é só a estrada que te leva para o interior. É como se uma parte sua também voltasse a respirar do jeito que precisava e não tinha conseguido nos últimos tempos.",
        },
        {
          type: "normal",
          text: "Daqui de longe, eu imagino você caminhando pelos cômodos, abrindo porta, ouvindo alguma lembrança bater, sentindo um tanto de saudade misturada com alívio. E penso que esse lugar faz com você algo que a cidade nunca vai conseguir imitar.",
        },
        {
          type: "normal",
          text: "Talvez seja justamente isso: o interior de fora lembrando para o interior de dentro que você não é feita só de correria, prazos e responsabilidades. Tem uma parte sua que é feita de varanda, conversa longa, cheiro de comida simples e abraço que não precisa de muita explicação.",
        },
        {
          type: "highlight",
          text: "Se puder, aproveita um pouco esse encontro: o lugar onde você nasceu e o lugar que você virou por dentro se reconhecendo de novo, mesmo que em silêncio.",
        },
        {
          type: "footer",
          text: "Às vezes, o norte mais importante é o que leva de volta para você mesma.",
        },
        {
          type: "footer",
          text: "Com carinho e 💜 ._.. ...",
        },
      ];

      const card = document.getElementById("card");
      const messageEl = document.getElementById("message");
      const stepLabel = document.getElementById("stepLabel");
      const progress = document.getElementById("progress");
      const prevBtn = document.getElementById("prevBtn");
      const nextBtn = document.getElementById("nextBtn");

      let currentStep = 0;

      function renderProgress() {
        progress.innerHTML = "";
        steps.forEach((_, index) => {
          const dot = document.createElement("div");
          dot.className = "dot" + (index === currentStep ? " active" : "");
          progress.appendChild(dot);
        });

        const counter = document.createElement("span");
        counter.className = "step-counter";
        counter.textContent = currentStep + 1 + " de " + steps.length;
        progress.appendChild(counter);
      }

      function renderStep() {
        const step = steps[currentStep];

        card.classList.remove("highlight", "card-footer");

        if (step.type === "highlight") {
          card.classList.add("highlight");
          stepLabel.textContent = "encontro de interiores";
        } else if (step.type === "footer") {
          card.classList.add("card-footer");
          stepLabel.textContent = "pra guardar em algum lugar aí dentro";
        } else {
          stepLabel.textContent = "";
        }

        messageEl.textContent = step.text;

        prevBtn.disabled = currentStep === 0;
        nextBtn.disabled = currentStep === steps.length - 1;

        requestAnimationFrame(() => {
          card.classList.add("visible");
        });

        renderProgress();
      }

      prevBtn.addEventListener("click", () => {
        if (currentStep > 0) {
          card.classList.remove("visible");
          setTimeout(() => {
            currentStep -= 1;
            renderStep();
          }, 200);
        }
      });

      nextBtn.addEventListener("click", () => {
        if (currentStep < steps.length - 1) {
          card.classList.remove("visible");
          setTimeout(() => {
            currentStep += 1;
            renderStep();
          }, 200);
        }
      });

      renderStep();
    </script>
  </body>
</html>
