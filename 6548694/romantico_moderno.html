<!DOCTYPE html>
<html lang="pt-BR" data-theme="light">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <meta name="color-scheme" content="light dark" />
    <title>Somente Poemas</title>
    <style>
      :root {
        --bg1: #f8efff;
        --bg2: #e8fbff;
        --ink: #1b1730;
        --muted: #6a6780;
        --card: rgba(255, 255, 255, 0.7);
        --ring: 0 0 0 1.5px rgba(124, 58, 237, 0.25);
        --accent: #7c3aed;
        --accent-2: #06b6d4;
        --radius: 18px;
        --blur: blur(12px);
      }

      @media (prefers-color-scheme: dark) {
        :root {
          --bg1: #0f0d14;
          --bg2: #101820;
          --ink: #efeaf6;
          --muted: #b5b1c6;
          --card: rgba(20, 18, 28, 0.6);
          --ring: 0 0 0 1.5px rgba(124, 58, 237, 0.35);
        }
      }

      * {
        box-sizing: border-box;
      }
      html,
      body {
        height: 100%;
      }
      body {
        margin: 0;
        font-family: ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto,
          Ubuntu, Cantarell, Noto Sans, "Helvetica Neue", Arial,
          "Apple Color Emoji", "Segoe UI Emoji";
        color: var(--ink);
        background: radial-gradient(
            1200px 800px at 20% 10%,
            var(--bg1),
            transparent
          ),
          radial-gradient(1000px 700px at 80% 90%, var(--bg2), transparent),
          linear-gradient(160deg, var(--bg1), var(--bg2));
        display: grid;
        place-items: center;
        padding: 24px;
      }

      .shell {
        width: min(840px, 100%);
        background: var(--card);
        backdrop-filter: var(--blur);
        border-radius: var(--radius);
        box-shadow: 0 20px 60px rgba(0, 0, 0, 0.12);
        border: var(--ring);
        overflow: clip;
      }

      header {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 12px;
        padding: 18px 20px;
        background: linear-gradient(
          90deg,
          rgba(124, 58, 237, 0.08),
          rgba(6, 182, 212, 0.08)
        );
      }

      .badge {
        font-size: 12px;
        letter-spacing: 0.4px;
        color: var(--muted);
      }

      h1 {
        font-size: clamp(24px, 3.6vw, 36px);
        margin: 0;
        line-height: 1.15;
      }

      main {
        padding: 28px 24px 8px;
      }

      .title {
        font-weight: 700;
        margin-bottom: 18px;
      }

      .poem {
        font-family: Georgia, "Times New Roman", serif;
        font-size: clamp(18px, 2.2vw, 20px);
        line-height: 1.65;
        white-space: pre-line;
      }

      .actions {
        display: flex;
        gap: 12px;
        flex-wrap: wrap;
        padding: 18px 24px 24px;
      }

      button {
        appearance: none;
        border: 0;
        cursor: pointer;
        padding: 12px 16px;
        border-radius: 12px;
        background: linear-gradient(135deg, var(--accent), var(--accent-2));
        color: white;
        font-weight: 600;
        letter-spacing: 0.3px;
        box-shadow: 0 6px 18px rgba(124, 58, 237, 0.3);
        transition: transform 0.12s ease, filter 0.2s ease;
      }
      button:hover {
        transform: translateY(-1px);
      }
      button:active {
        transform: translateY(0);
        filter: saturate(1.1);
      }

      .ghost {
        background: transparent;
        color: var(--ink);
        border: 1.5px solid rgba(124, 58, 237, 0.35);
        box-shadow: none;
      }

      .fade {
        animation: fade 0.36s ease both;
      }
      @keyframes fade {
        from {
          opacity: 0;
          transform: translateY(6px);
        }
        to {
          opacity: 1;
          transform: translateY(0);
        }
      }

      .counter {
        font-size: 12px;
        color: var(--muted);
        margin-left: auto;
      }
    </style>
  </head>
  <body>
    <div class="shell">
      <header>
        <div class="badge">Poemas românticos modernos</div>
        <div class="counter" id="counter">—</div>
      </header>
      <main>
        <div class="title" id="p-title"></div>
        <div class="poem fade" id="p-body"></div>
      </main>
      <div class="actions">
        <button id="next">Gostei, mas quero ler outro</button>
        <button id="again" class="ghost">Misturar e recomeçar</button>
      </div>
    </div>

    <script>
      const poems = [
        {
          title: "Enquanto o Mundo Corre",
          body: `Não prometo eternidade, prometo presença.\n\nEnquanto o mundo corre, eu te olho devagar.\n\nNão é sobre ser para sempre, é sobre ser agora, e fazer o agora valer o poema.`,
        },
        {
          title: "Instruções para não se apaixonar por mim",
          body: `1) Não sorria de volta.\n2) Não responda com ironia.\n3) Não me chame pelo apelido que só você inventaria.\n\nSe ainda assim tentar, boa sorte, eu também falhei.`,
        },
        {
          title: "Metade do Silêncio",
          body: `Há um espaço entre o que digo e o que sinto, e nele você mora.\n\nÀs vezes falo demais, só para disfarçar o silêncio que me entrega.`,
        },
        {
          title: "Wi-Fi instável, sentimentos fixos",
          body: `Conexão ruim, mensagem travada, e mesmo assim, você chegou.\n\nEntre uma notificação e outra, ainda há poesia no modo avião.`,
        },
        {
          title: "A Calma Depois de Você",
          body: `Você não é tempestade, é o que fica depois dela.\n\nO rastro de sol que insiste nas janelas do peito.`,
        },
      ];

      const shuffle = (arr) => {
        const a = arr.slice();
        for (let i = a.length - 1; i > 0; i--) {
          const j = Math.floor(Math.random() * (i + 1));
          [a[i], a[j]] = [a[j], a[i]];
        }
        return a;
      };

      let order = shuffle([...poems.keys()]);
      let cursor = 0;

      const els = {
        title: document.getElementById("p-title"),
        body: document.getElementById("p-body"),
        next: document.getElementById("next"),
        again: document.getElementById("again"),
        counter: document.getElementById("counter"),
      };

      function render(index) {
        const p = poems[index];
        els.title.textContent = p.title;
        els.body.textContent = p.body;
        els.body.classList.remove("fade");
        void els.body.offsetWidth;
        els.body.classList.add("fade");
        els.counter.textContent = `${cursor + 1} / ${poems.length}`;
      }

      function nextPoem() {
        cursor = cursor + 1;
        if (cursor >= order.length) {
          const lastShown = order[order.length - 1];
          order = shuffle([...poems.keys()]);
          if (order[0] === lastShown && order.length > 1) {
            [order[0], order[1]] = [order[1], order[0]];
          }
          cursor = 0;
        }
        render(order[cursor]);
      }

      els.next.addEventListener("click", nextPoem);
      els.again.addEventListener("click", () => {
        order = shuffle([...poems.keys()]);
        cursor = 0;
        render(order[cursor]);
      });

      cursor = 0;
      render(order[cursor]);
    </script>
  </body>
</html>
