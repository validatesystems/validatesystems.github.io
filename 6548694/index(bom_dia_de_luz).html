<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Bom Dia, Cléia ☀️</title>
    <style>
      :root {
        --bg1: #e0f7fa;
        --bg2: #fffde7;
        --accent: #0288d1;
        --text: #1a1a1a;
        --muted: #6b6b6b;
      }

      body {
        margin: 0;
        font-family: "Poppins", sans-serif;
        background: linear-gradient(145deg, var(--bg1), var(--bg2));
        color: var(--text);
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        min-height: 100vh;
        text-align: center;
        overflow: hidden;
      }

      h1 {
        font-size: 2.4rem;
        color: var(--accent);
        margin-bottom: 10px;
        animation: float 3s ease-in-out infinite;
      }

      p {
        font-size: 1.2rem;
        max-width: 600px;
        line-height: 1.6;
        color: var(--text);
        margin: 0 20px;
      }

      .sub {
        color: var(--muted);
        margin-top: 10px;
        font-size: 1rem;
      }

      .emoji {
        font-size: 3rem;
        margin: 20px 0;
        animation: pulse 2s ease-in-out infinite;
      }

      @keyframes pulse {
        0%,
        100% {
          transform: scale(1);
        }
        50% {
          transform: scale(1.15);
        }
      }

      @keyframes float {
        0% {
          transform: translateY(0);
        }
        50% {
          transform: translateY(-10px);
        }
        100% {
          transform: translateY(0);
        }
      }

      .card {
        background: rgba(255, 255, 255, 0.75);
        border-radius: 20px;
        box-shadow: 0 10px 25px rgba(0, 0, 0, 0.1);
        padding: 40px;
        backdrop-filter: blur(10px);
        animation: fadeIn 1.5s ease;
      }

      @keyframes fadeIn {
        from {
          opacity: 0;
          transform: translateY(20px);
        }
        to {
          opacity: 1;
          transform: translateY(0);
        }
      }

      footer {
        position: absolute;
        bottom: 20px;
        font-size: 0.9rem;
        color: var(--muted);
      }
      #pfooter {
        position: absolute;
        bottom: 20px;
        font-size: 0.9rem;
        color: var(--muted);
      }
    </style>
  </head>
  <body>
    <div class="card">
      <div class="emoji">🌤️💫</div>
      <h1>Bom dia, Cléia!</h1>
      <p>
        O dia acordou ensaiando um sorriso, provavelmente inspirado no seu. Que
        a leveza te encontre logo cedo, junto com um café que saiba o seu nome e
        um vento que traga boas ideias. ☕💭
      </p>
      <p class="sub">
        E se algo der errado, lembre-se: até o sol tem dias nublados. 🌥️
      </p>
    </div>
    <!-- <footer>Enviado direto do departamento de boas energias. 🌈</footer> -->
    <footer>Developed with 💜 by ._.. ...</footer>
  </body>
</html>
