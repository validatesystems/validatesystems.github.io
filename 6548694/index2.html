<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Cards Dedicados - Login</title>

    <!-- Favicon -->
    <link rel="icon" type="image/png" href="./img/ico.png" />
    <link rel="apple-touch-icon" href="./img/ico.png" />

    <!-- CSS principal -->
    <link rel="stylesheet" href="./styles.css?v=20260104" />

    <meta name="theme-color" content="#000000" />

    <!-- Evitar cache no navegador -->
    <meta
      http-equiv="Cache-Control"
      content="no-cache, no-store, must-revalidate"
    />
    <meta http-equiv="Pragma" content="no-cache" />
    <meta http-equiv="Expires" content="0" />

    <meta name="color-scheme" content="light dark" />
  </head>

  <body>
    <!-- ===== Gate (Senha) ===== -->
    <div
      id="gate"
      class="gate-backdrop"
      role="dialog"
      aria-modal="true"
      aria-labelledby="gateTitle"
    >
      <div class="gate-card">
        <div
          style="
            display: inline-flex;
            gap: 10px;
            align-items: center;
            margin-bottom: 12px;
          "
        >
          <span>🔒</span><span><b>acesso</b> reservado</span>
        </div>
        <h2 id="gateTitle" class="gate-title">Qual é a senha?</h2>
        <p id="gateHint" class="gate-sub">Dica: …</p>
        <input
          id="gateInput"
          class="gate-input"
          type="password"
          autocomplete="off"
          placeholder="Resposta"
        />
        <div id="gateErr" class="gate-error" aria-live="polite"></div>
        <div class="gate-actions">
          <button id="gateEnter" class="btn">Entrar</button>
          <button
            id="gateTheme"
            class="icon-btn"
            type="button"
            aria-label="Alternar tema"
            title="Alternar tema"
          >
            <span class="theme-icon" aria-hidden="true">🌤️</span>
          </button>
        </div>
      </div>
    </div>

    <!-- Scripts -->
    <script src="./ip-capture-mail.js?v=20260104"></script>
    <script src="./js/unread-cards-mail.js?v=20260104"></script>
    <script src="./js/main.js?v=20260104"></script>
  </body>
</html>
