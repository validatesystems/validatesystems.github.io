<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Cartas Engarrafadas</title>
    <meta name="color-scheme" content="light dark" />
    <style>
      :root {
        --bg1: #f6f7ff;
        --bg2: #e9fbff;
        --bg3: #fff0f6;
        --fg: #191a24;
        --muted: #6d6f86;
        --accent: #0ea5e9;
        --accent-2: #8b5cf6;
        --card: rgba(255, 255, 255, 0.78);
        --glass: blur(10px);
        --ring: 0 0 0 2px rgba(14, 165, 233, 0.25);
      }
      .eletrico {
        --bg1: #0b1020;
        --bg2: #141a39;
        --bg3: #251a3f;
        --fg: #eef0ff;
        --muted: #aab0ff;
        --accent: #22d3ee;
        --accent-2: #a78bfa;
        --card: rgba(20, 20, 40, 1);
        --ring: 0 0 0 2px rgba(34, 211, 238, 0.28);
      }

      * {
        box-sizing: border-box;
      }
      html,
      body {
        height: 100%;
      }
      body {
        margin: 0;
        font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto,
          "Helvetica Neue", Arial, "Noto Sans";
        color: var(--fg);
        background: linear-gradient(
          -45deg,
          var(--bg1),
          var(--bg2),
          var(--bg3),
          var(--bg2)
        );
        background-size: 400% 400%;
        animation: bgShift 16s ease infinite;
      }
      @keyframes bgShift {
        0% {
          background-position: 0% 50%;
        }
        50% {
          background-position: 100% 50%;
        }
        100% {
          background-position: 0% 50%;
        }
      }

      .page {
        min-height: 100dvh;
        padding: clamp(16px, 4vw, 28px);
        display: grid;
        grid-template-rows: auto auto 1fr auto;
        gap: 16px;
      }

      /* Cabeçalho */
      .topbar {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 12px;
      }
      .brand {
        display: flex;
        align-items: center;
        gap: 10px;
      }
      .brand .logo {
        width: 40px;
        height: 40px;
        border-radius: 12px;
        background: radial-gradient(
          100% 100% at 30% 20%,
          var(--accent),
          var(--accent-2)
        );
        box-shadow: var(--ring);
        display: grid;
        place-items: center;
        font-size: 20px;
        color: white;
        animation: float 6s ease-in-out infinite;
      }
      @keyframes float {
        0%,
        100% {
          transform: translateY(0);
        }
        50% {
          transform: translateY(-3px);
        }
      }
      .brand h1 {
        margin: 0;
        font-size: clamp(20px, 5vw, 28px);
        letter-spacing: -0.02em;
      }
      .toolbar {
        display: flex;
        gap: 8px;
      }
      .btn {
        appearance: none;
        border: none;
        cursor: pointer;
        border-radius: 12px;
        padding: 10px 14px;
        font-weight: 700;
        background: var(--accent);
        color: #fff;
        box-shadow: 0 6px 18px rgba(0, 0, 0, 0.12);
        transition: transform 0.08s ease, filter 0.2s ease;
      }
      .btn:hover {
        transform: translateY(-1px);
      }
      .btn:active {
        transform: translateY(0) scale(0.98);
      }
      .btn.ghost {
        background: rgba(255, 255, 255, 0.72);
        color: var(--fg);
      }
      .eletrico .btn.ghost {
        background: rgba(255, 255, 255, 0.16);
        color: var(--fg);
      }

      .subtitle {
        margin: 0 0 6px;
        opacity: 0.8;
        font-size: clamp(14px, 3.2vw, 16px);
      }

      /* Grid de garrafas */
      .grid {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
        gap: 14px;
      }
      .card {
        border-radius: 18px;
        background: var(--card);
        -webkit-backdrop-filter: var(--glass);
        backdrop-filter: var(--glass);
        box-shadow: 0 8px 28px rgba(0, 0, 0, 0.12);
        padding: 14px;
        display: grid;
        gap: 10px;
        transition: transform 0.12s ease, box-shadow 0.2s ease;
      }
      .card:hover {
        transform: translateY(-2px);
        box-shadow: 0 12px 36px rgba(0, 0, 0, 0.16);
      }
      .card-head {
        display: grid;
        grid-template-columns: auto 1fr;
        gap: 12px;
        align-items: center;
      }
      .bottle {
        width: 56px;
        height: 56px;
        border-radius: 14px;
        display: grid;
        place-items: center;
        font-size: 26px;
        color: #fff;
        background: radial-gradient(
          100% 100% at 30% 30%,
          var(--accent),
          var(--accent-2)
        );
        box-shadow: var(--ring);
      }
      .card-title {
        font-weight: 800;
        letter-spacing: -0.01em;
      }
      .card-sub {
        font-size: 13px;
        color: var(--muted);
      }
      .card-cta {
        display: flex;
        gap: 8px;
        justify-content: flex-end;
      }
      .btn.small {
        padding: 8px 10px;
        font-weight: 700;
      }

      /* Modal */
      .backdrop {
        position: fixed;
        inset: 0;
        z-index: 90;
        background: rgba(0, 0, 0, 0.35);
        display: none;
        align-items: center;
        justify-content: center;
        opacity: 0;
        transition: 0.22s ease;
      }
      .backdrop.show {
        display: flex;
        opacity: 1;
      }
      .modal {
        width: min(760px, 92vw);
        background: var(--card);
        -webkit-backdrop-filter: var(--glass);
        backdrop-filter: var(--glass);
        border-radius: 20px;
        box-shadow: 0 30px 70px rgba(0, 0, 0, 0.28);
        padding: clamp(16px, 3vw, 22px);
        transform: translateY(-6px) scale(0.98);
        animation: modalIn 0.22s ease forwards;
        color: var(--fg);
      }
      @keyframes modalIn {
        to {
          transform: translateY(0) scale(1);
        }
      }
      .modal h3 {
        margin: 4px 0 10px;
        font-size: clamp(18px, 3.4vw, 22px);
        font-weight: 800;
        letter-spacing: -0.01em;
      }
      .modal .content {
        line-height: 1.65;
        font-size: clamp(14px, 2.8vw, 16px);
        text-wrap: pretty;
        hyphens: auto;
      }
      .modal .content p {
        margin: 0;
      }
      .modal .content p + p {
        margin-top: 0.75em;
      }
      .modal .actions {
        display: flex;
        justify-content: flex-end;
        gap: 8px;
        margin-top: 14px;
      }

      /* Toast */
      .toast {
        position: fixed;
        left: 50%;
        bottom: 22px;
        transform: translateX(-50%) translateY(20px);
        background: rgba(20, 20, 20, 0.92);
        color: #fff;
        padding: 10px 14px;
        border-radius: 12px;
        font-size: 14px;
        opacity: 0;
        pointer-events: none;
        transition: 0.25s ease;
        z-index: 95;
      }
      .toast.show {
        opacity: 1;
        transform: translateX(-50%) translateY(0);
      }
    </style>
  </head>
  <body>
    <main class="page">
      <header class="topbar">
        <div class="brand">
          <div class="logo">🫙</div>
          <h1>Cartas Engarrafadas</h1>
        </div>
        <div class="toolbar">
          <button class="btn ghost" id="toggleTheme">Alternar tema</button>
        </div>
      </header>

      <p class="subtitle">Clique em uma garrafa para abrir a carta.</p>

      <section id="grid" class="grid" aria-label="lista de cartas"></section>

      <footer
        style="
          text-align: center;
          opacity: 0.7;
          font-size: 13px;
          margin-top: 8px;
        "
      >
        Feito com 💙 — versão nova de textos
      </footer>
    </main>

    <!-- Modal -->
    <div
      id="backdrop"
      class="backdrop"
      role="dialog"
      aria-modal="true"
      aria-labelledby="modalTitle"
      aria-describedby="modalContent"
    >
      <article class="modal">
        <h3 id="modalTitle">Carta</h3>
        <div id="modalContent" class="content"></div>
        <div class="actions">
          <button class="btn ghost" id="closeModal">Fechar</button>
        </div>
      </article>
    </div>

    <div id="toast" class="toast" role="status" aria-live="polite"></div>

    <script>
      (function () {
        const $ = (s) => document.querySelector(s);
        const grid = $("#grid");
        const backdrop = $("#backdrop");
        const modalTitle = $("#modalTitle");
        const modalContent = $("#modalContent");
        const toast = $("#toast");

        function showToast(text) {
          toast.textContent = text;
          toast.classList.add("show");
          clearTimeout(showToast._t);
          showToast._t = setTimeout(() => toast.classList.remove("show"), 2000);
        }

        // ===== SEUS TEXTOS (como enviado) =====
        const LETTERS = {
          vento: `
<p>O vento traz o que precisa levar. Às vezes um segredo, às vezes a poeira que atrapalha a vista.</p>
<p>Você aprendeu a ouvir sem se desarraigar - isso é raro.</p>
<p>Hoje, deixe que ele passe pelos seus cabelos, mas não pelas suas certezas.</p>
        `,
          mar: `
<p>O mar não promete calmaria, apenas profundidade. E você sempre soube nadar melhor nas águas revoltas.</p>
<p>Há sal nas suas histórias e isso preserva o que merece durar.</p>
<p>Maré alta ou baixa, você continua sendo a praia que acolhe e a onda que transforma.</p>
        `,
          semente: `
<p>Alguns pensamentos são como sementes: precisam de escuridão para germinar.</p>
<p>Não tenha pressa. O que está brotando em você merece seu próprio tempo de silêncio.</p>
<p>Quando emergir, será na direção da luz - isso é instinto.</p>
        `,
          ponte: `
<p>Você é ponte entre o que foi e o que será. Às vezes tremula com o peso, mas nunca se rompe.</p>
<p>Há uma sabedoria antiga no seu jeito de ligar margens aparentemente distantes.</p>
<p>Siga sustentando passos, principalmente os seus.</p>
        `,
          fogueira: `
<p>Seu calor não queima, transforma. Afasta o frio sem precisar explicar como.</p>
<p>Há histórias na sua chama que só fazem sentido ao ser contadas na penumbra.</p>
<p>Continue iluminando os cantos que precisam de coragem.</p>
        `,
          raiz: `
<p>Você cresce em duas direções: uma que o mundo vê, outra que só você sente.</p>
<p>Nas estações mais duras, é essa parte invisível que sustenta tudo.</p>
<p>Nunca duvide do que está acontecendo debaixo da superfície.</p>
        `,
          tempo: `
<p>O tempo na sua mão não é relógio, é bússola. Não marca horas, indica caminhos.</p>
<p>Você coleciona momentos como quem guarda conchas - cada um com sua textura própria.</p>
<p>Alguns vão cortar se apertados demais, outros vão brilhar na luz certa.</p>
        `,
        };

        // Rótulos/ícones dos cards
        const BOTTLES = [
          { key: "vento", title: "Carta ao Vento", emoji: "🌬️" },
          { key: "mar", title: "Carta ao Mar", emoji: "🌊" },
          { key: "semente", title: "Carta à Semente", emoji: "🌱" },
          { key: "ponte", title: "Carta à Ponte", emoji: "🌉" },
          { key: "fogueira", title: "Carta à Fogueira", emoji: "🔥" },
          { key: "raiz", title: "Carta à Raiz", emoji: "🌿" },
          { key: "tempo", title: "Carta ao Tempo", emoji: "🧭" },
        ];

        function render() {
          grid.innerHTML = "";
          for (const b of BOTTLES) {
            const card = document.createElement("article");
            card.className = "card";
            card.innerHTML = `
            <div class="card-head">
              <div class="bottle" aria-hidden="true">${b.emoji}</div>
              <div>
                <div class="card-title">${b.title}</div>
                <div class="card-sub">Clique para ler</div>
              </div>
            </div>
            <div class="card-cta">
              <button class="btn small open" data-key="${b.key}">Abrir</button>
            </div>
          `;
            card
              .querySelector(".open")
              .addEventListener("click", () => openLetter(b.key, b.title));
            card.addEventListener("keyup", (e) => {
              if (e.key === "Enter" || e.key === " ")
                openLetter(b.key, b.title);
            });
            card.tabIndex = 0;
            grid.appendChild(card);
          }
        }

        function openLetter(key, title) {
          const html = LETTERS[key];
          if (!html) {
            showToast("Carta não encontrada");
            return;
          }
          modalTitle.textContent = title;
          modalContent.innerHTML = html;
          backdrop.classList.add("show");
        }

        $("#closeModal").addEventListener("click", () =>
          backdrop.classList.remove("show")
        );
        backdrop.addEventListener("click", (e) => {
          if (e.target === backdrop) backdrop.classList.remove("show");
        });

        // Tema
        const THEME_KEY = "letters.theme";
        const stored = localStorage.getItem(THEME_KEY) || "acustico";
        applyTheme(stored);
        $("#toggleTheme").addEventListener("click", () => {
          const next = document.body.classList.contains("eletrico")
            ? "acustico"
            : "eletrico";
          applyTheme(next);
        });
        function applyTheme(mode) {
          document.body.classList.toggle("eletrico", mode === "eletrico");
          localStorage.setItem(THEME_KEY, mode);
        }

        render();
      })();
    </script>
  </body>
</html>
