<!DOCTYPE html>
<html lang="pt-BR" data-theme="light">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <meta name="color-scheme" content="light dark" />
    <title>Mensagem</title>

    <style>
      :root {
        --bg-light1: #faf8ff;
        --bg-light2: #eef6ff;
        --bg-dark1: #050510;
        --bg-dark2: #141425;

        --card-light: rgba(255, 255, 255, 0.82);
        --card-dark: rgba(8, 8, 16, 0.88);

        --fg-light: #111827;
        --fg-dark: #e5e7eb;

        --accent: #7c3aed;
        --accent-soft: rgba(124, 58, 237, 0.18);
        --accent-soft-strong: rgba(124, 58, 237, 0.32);

        --muted: #6b7280;
        --muted-dark: #9ca3af;

        --glass: blur(14px);

        --transition: 0.35s ease;
      }

      html[data-theme="light"] {
        --bg1: var(--bg-light1);
        --bg2: var(--bg-light2);
        --fg: var(--fg-light);
        --card: var(--card-light);
        --muted-final: var(--muted);
      }

      html[data-theme="dark"] {
        --bg1: var(--bg-dark1);
        --bg2: var(--bg-dark2);
        --fg: var(--fg-dark);
        --card: var(--card-dark);
        --muted-final: var(--muted-dark);
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        padding: 0;
        min-height: 100vh;
        font-family: system-ui, -apple-system, BlinkMacSystemFont, "Inter",
          sans-serif;
        color: var(--fg);
        background: radial-gradient(
            circle at 0% 0%,
            rgba(124, 58, 237, 0.18),
            transparent 50%
          ),
          radial-gradient(
            circle at 100% 100%,
            rgba(96, 165, 250, 0.16),
            transparent 52%
          ),
          linear-gradient(145deg, var(--bg1), var(--bg2));
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 20px;
        transition: background var(--transition), color var(--transition);
        text-align: justify;
      }

      .toggle-theme {
        position: fixed;
        top: 14px;
        right: 14px;
        background: var(--card);
        border: 1px solid var(--accent-soft);
        padding: 8px 10px;
        border-radius: 999px;
        cursor: pointer;
        transition: transform var(--transition), box-shadow var(--transition),
          background var(--transition), border-color var(--transition);
        backdrop-filter: var(--glass);
        font-size: 1.1rem;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        box-shadow: 0 6px 18px rgba(0, 0, 0, 0.12);
      }

      .toggle-theme span {
        font-size: 0.8rem;
        margin-left: 6px;
        color: var(--muted-final);
      }

      .toggle-theme:hover {
        transform: translateY(-1px) scale(1.04);
        box-shadow: 0 10px 26px rgba(0, 0, 0, 0.18);
      }

      .wrapper {
        max-width: 440px;
        width: 100%;
      }

      .card {
        background: var(--card);
        backdrop-filter: var(--glass);
        border-radius: 26px;
        padding: 22px 20px 18px;
        box-shadow: 0 10px 32px rgba(15, 23, 42, 0.24);
        border: 1px solid rgba(148, 163, 184, 0.22);
        transition: transform var(--transition), box-shadow var(--transition),
          border-color var(--transition), background var(--transition);
        position: relative;
        overflow: hidden;
      }

      .card::before {
        content: "";
        position: absolute;
        width: 180px;
        height: 180px;
        border-radius: 50%;
        background: radial-gradient(
          circle,
          var(--accent-soft-strong),
          transparent 60%
        );
        opacity: 0.25;
        top: -90px;
        right: -70px;
        pointer-events: none;
      }

      .card::after {
        content: "";
        position: absolute;
        width: 42px;
        height: 42px;
        border-radius: 50%;
        border: 1px solid var(--accent-soft);
        opacity: 0.4;
        bottom: -14px;
        left: 18%;
        transform: translateY(-4px);
      }

      .card:hover {
        transform: translateY(-3px);
        box-shadow: 0 16px 40px rgba(15, 23, 42, 0.32);
        border-color: var(--accent-soft-strong);
      }

      .chip-row {
        display: flex;
        justify-content: space-between;
        align-items: center;
        gap: 8px;
        margin-bottom: 14px;
        position: relative;
        z-index: 1;
      }

      .chip {
        display: inline-flex;
        align-items: center;
        gap: 6px;
        padding: 5px 11px;
        border-radius: 999px;
        background: rgba(15, 23, 42, 0.04);
        border: 1px solid var(--accent-soft);
        font-size: 0.74rem;
        text-transform: uppercase;
        letter-spacing: 0.12em;
        color: var(--muted-final);
        font-weight: 600;
        backdrop-filter: var(--glass);
      }

      .chip span.emoji {
        font-size: 0.95rem;
      }

      .dot {
        width: 5px;
        height: 5px;
        border-radius: 999px;
        background: var(--accent);
      }

      .time-label {
        font-size: 0.7rem;
        color: var(--muted-final);
        display: inline-flex;
        align-items: center;
        gap: 6px;
        opacity: 0.9;
      }

      .time-label .dot {
        opacity: 0.8;
      }

      .meta-row {
        display: flex;
        flex-wrap: wrap;
        gap: 6px 12px;
        align-items: center;
        margin-bottom: 14px;
        font-size: 0.78rem;
        color: var(--muted-final);
        position: relative;
        z-index: 1;
      }

      .pill {
        display: inline-flex;
        align-items: center;
        gap: 6px;
        padding: 5px 9px;
        border-radius: 999px;
        background: rgba(15, 23, 42, 0.02);
      }

      .pill strong {
        color: var(--fg);
        font-weight: 600;
      }

      .avatars {
        margin-left: auto;
        display: inline-flex;
        align-items: center;
        gap: 4px;
      }

      .avatar {
        width: 22px;
        height: 22px;
        border-radius: 50%;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        font-size: 0.7rem;
        font-weight: 600;
        background: rgba(15, 23, 42, 0.06);
        color: var(--fg);
        border: 1px solid rgba(148, 163, 184, 0.5);
      }

      .avatar.me {
        background: rgba(124, 58, 237, 0.2);
        border-color: rgba(124, 58, 237, 0.7);
      }

      .avatar.you {
        background: rgba(59, 130, 246, 0.18);
        border-color: rgba(59, 130, 246, 0.7);
      }

      .message-bubble {
        position: relative;
        margin-top: 4px;
        margin-bottom: 12px;
        background: rgba(15, 23, 42, 0.04);
        border-radius: 18px;
        padding: 14px 14px 13px;
        border: 1px solid rgba(148, 163, 184, 0.35);
        backdrop-filter: var(--glass);
        z-index: 1;
      }

      .message-bubble::after {
        content: "";
        position: absolute;
        bottom: -7px;
        right: 26px;
        width: 14px;
        height: 14px;
        background: inherit;
        border-right: 1px solid rgba(148, 163, 184, 0.35);
        border-bottom: 1px solid rgba(148, 163, 184, 0.35);
        transform: rotate(45deg);
        border-radius: 0 0 4px 0;
      }

      .msg {
        margin: 0;
        font-size: 1.02rem;
        line-height: 1.6;
        /* white-space: pre-line; */
        text-align: justify;
      }

      .footer-row {
        display: flex;
        justify-content: space-between;
        align-items: center;
        font-size: 0.72rem;
        color: var(--muted-final);
        margin-top: 10px;
        gap: 6px;
        position: relative;
        z-index: 1;
      }

      .status {
        display: inline-flex;
        align-items: center;
        gap: 4px;
        margin-left: auto;
      }

      .checks {
        font-size: 0.8rem;
        color: #22c55e;
      }

      @media (max-width: 480px) {
        .card {
          padding: 20px 16px 16px;
          border-radius: 22px;
        }

        .message-bubble {
          padding: 13px 12px 12px;
        }

        .msg {
          font-size: 0.98rem;
        }

        .footer-row {
          flex-direction: column;
          align-items: flex-end;
        }
      }
    </style>
  </head>

  <body>
    <button class="toggle-theme" id="themeToggle">🌓 <span>tema</span></button>

    <div class="wrapper">
      <div class="card">
        <div class="chip-row">
          <div class="chip">
            <span class="emoji">💌</span>
            <span>Mensagem</span>
          </div>
          <div class="time-label">
            <span class="dot"></span>
            <span>agora mesmo</span>
          </div>
        </div>

        <div class="meta-row">
          <div class="pill">
            <span>De:</span>
            <strong>._.. ...</strong>
          </div>
          <div class="pill">
            <span>Para:</span>
            <strong>Cléia</strong>
          </div>
          <!-- <div class="avatars">
            <div class="avatar me">L</div>
            <div class="avatar you">C</div>
          </div> -->
        </div>

        <div class="message-bubble">
          <p class="msg">
            Não sei como tá aí dentro, mas desejo que você pelo menos saiba o
            que é verdadeiro.
          </p>
        </div>

        <div class="footer-row">
          <!-- <span>Hoje • mensagem guardada em sigilo bonito</span> -->
          <div class="status">
            <span class="checks">✔✔</span>
            <span>lida em pensamento</span>
          </div>
        </div>
      </div>
    </div>

    <script>
      const root = document.documentElement;
      const themeToggle = document.getElementById("themeToggle");

      themeToggle.addEventListener("click", () => {
        const current = root.getAttribute("data-theme") || "light";
        const next = current === "light" ? "dark" : "light";
        root.setAttribute("data-theme", next);
      });
    </script>
  </body>
</html>
