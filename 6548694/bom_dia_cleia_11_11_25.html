<!DOCTYPE html>
<html lang="pt-BR" data-theme="light">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <link rel="stylesheet" href="./modal.css" />
    <script type="module" src="./modal.js"></script>
    <script type="module" src="./comment.js"></script>
    <script>
      // Configuração do endpoint e segredo (ajuste aqui uma vez)
      window.COMMENT_CONFIG = {
        GAS_ENDPOINT:
          "https://script.google.com/macros/s/AKfycbzaoXScQkYEQN7jpXEEEcvduWEyCVXZXfSFbLWv7vCKfQwMUd3_kSqaF7H6dypC70kiBg/exec",
        SECRET: "6548694", // exemplo; troque se quiser
      };
    </script>
    <meta name="color-scheme" content="light dark" />
    <meta name="theme-color" content="#fffbef" />
    <title>Bom dia, Cléia ☀️</title>
    <style>
      :root {
        --bg1: #fff9ef;
        --bg2: #e9f7ff;
        --ink: #1b1a2b;
        --muted: #5e5a7a;
        --accent: #f59e0b;
        --accent-2: #3b82f6;
        --card: color-mix(in oklab, white 86%, transparent);
        --shadow: 0 10px 28px rgba(0, 0, 0, 0.1);
        --blur: blur(10px);
        --fs-body: clamp(1rem, 0.92rem + 0.7vw, 1.2rem);
        --fs-small: clamp(0.9rem, 0.86rem + 0.35vw, 1rem);
        --radius: 20px;
        --pad: clamp(16px, 4vw, 28px);
        --maxw: min(92vw, 760px);
        --stage-min-h: 4.8em;
        --type-ms: 40; /* velocidade da digitação */
        --fade: 600ms;

        /* Variáveis do botão comentar (tema claro) */
        --btn-cmt-bg: color-mix(in oklab, black 6%, white 85%);
        --btn-cmt-fg: #1c1a30;
        --btn-cmt-bd: color-mix(in oklab, black 12%, white 88%);
        --btn-cmt-bg-hover: color-mix(in oklab, black 10%, white 85%);
      }

      [data-theme="night"] {
        --bg1: #0d0b1a;
        --bg2: #1a1630;
        --ink: #f2edff;
        --muted: #b8b0db;
        --card: color-mix(in oklab, white 8%, transparent);
        --shadow: 0 10px 30px rgba(0, 0, 0, 0.35);
        --accent: #8b5cf6;
        --accent-2: #06b6d4;

        /* Botão comentar (tema escuro) */
        --btn-cmt-bg: color-mix(in oklab, white 12%, transparent);
        --btn-cmt-fg: var(--ink);
        --btn-cmt-bd: color-mix(in oklab, white 22%, transparent);
        --btn-cmt-bg-hover: color-mix(in oklab, white 22%, transparent);
      }

      * {
        box-sizing: border-box;
      }
      html,
      body {
        height: 100%;
      }

      body {
        margin: 0;
        min-height: 100dvh;
        background: radial-gradient(
          1200px 800px at 50% 0%,
          var(--bg2),
          var(--bg1)
        );
        color: var(--ink);
        font-family: ui-serif, Georgia, "Times New Roman", serif;
        font-size: var(--fs-body);
        line-height: 1.55;
        display: grid;
        place-items: center;
        overflow: hidden;
      }

      .sunrise {
        position: fixed;
        inset: auto -20% -35% -20%;
        height: 70vh;
        pointer-events: none;
        background: radial-gradient(
          circle at 50% 100%,
          color-mix(in oklab, var(--accent) 65%, white 10%) 0%,
          color-mix(in oklab, var(--accent) 45%, transparent) 35%,
          transparent 60%
        );
        opacity: 0.8;
        filter: blur(20px) saturate(1.05);
        transform: translateY(30%);
        animation: rise 2800ms ease-out forwards;
      }
      @keyframes rise {
        to {
          transform: translateY(0%);
          opacity: 1;
        }
      }

      .frame {
        width: 100%;
        max-width: var(--maxw);
        background: var(--card);
        backdrop-filter: var(--blur);
        border-radius: var(--radius);
        box-shadow: var(--shadow);
        padding: var(--pad);
        display: grid;
        gap: 0.9rem;
        text-align: center;
        position: relative;
        z-index: 1;
      }

      .header {
        font-weight: 600;
        letter-spacing: 0.2px;
        opacity: 0.95;
        font-size: clamp(1.05rem, 1rem + 0.7vw, 1.25rem);
      }

      .stage {
        position: relative;
        min-height: var(--stage-min-h);
        display: grid;
        place-items: center;
        padding-block: 0.25rem;
      }

      .line {
        opacity: 0;
        transition: opacity var(--fade) ease;
      }
      .line.show {
        opacity: 1;
      }
      .muted {
        color: var(--muted);
      }

      .cursor {
        display: inline-block;
        width: 0.6ch;
        translate: 0 0.08em;
        border-right: 2px solid currentColor;
        animation: blink 1s steps(1) infinite;
      }
      @keyframes blink {
        50% {
          border-color: transparent;
        }
      }

      .signature {
        opacity: 0.8;
        font-style: italic;
        font-size: var(--fs-small);
      }

      /* Botão de tema */
      .theme-toggle {
        position: fixed;
        top: 10px;
        right: 12px;
        background: color-mix(in oklab, white 18%, transparent);
        border: 1px solid color-mix(in oklab, white 30%, transparent);
        backdrop-filter: blur(6px);
        border-radius: 50%;
        width: 44px;
        height: 44px;
        display: grid;
        place-items: center;
        font-size: 1.2rem;
        cursor: pointer;
        transition: background 0.25s ease, transform 0.15s ease;
        z-index: 3;
      }

      /* Botão comentar */
      .btn-comment {
        position: fixed;
        z-index: 3;
        right: 16px;
        bottom: 16px;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        min-height: 44px;
        padding: 10px 14px;
        border-radius: 999px;
        background: var(--btn-cmt-bg);
        color: var(--btn-cmt-fg);
        border: 1px solid var(--btn-cmt-bd);
        box-shadow: 0 6px 20px rgba(0, 0, 0, 0.18);
        backdrop-filter: blur(8px);
        font: inherit;
        cursor: pointer;
        transition: background 0.25s ease, transform 0.15s ease,
          box-shadow 0.25s ease;
      }
      .btn-comment:hover {
        background: var(--btn-cmt-bg-hover);
        transform: translateY(-1px);
      }

      /* Botão LER DE NOVO (chip) */
      .controls {
        display: none;
        gap: 0.5rem;
        justify-content: center;
      }
      .chip {
        padding: 0.6rem 0.9rem;
        border-radius: 999px;
        cursor: pointer;
        border: 1px solid color-mix(in oklab, var(--ink) 22%, transparent);
        background: color-mix(in oklab, white 14%, transparent);
        transition: transform 0.15s ease, background 0.25s ease;
      }
      .chip:hover {
        transform: translateY(-1px);
      }
    </style>
  </head>
  <body>
    <div class="sunrise" aria-hidden="true"></div>

    <!-- Alternância de tema -->
    <button id="themeToggle" class="theme-toggle" aria-label="Alternar tema">
      ☀️
    </button>

    <main class="frame" aria-live="polite" aria-atomic="true">
      <div class="header">Bom dia, Cléia ☀️</div>
      <section class="stage"><p id="line" class="line"></p></section>
      <p id="signature" class="signature" hidden>._.. ...</p>

      <!-- Controles (aparecem no fim) -->
      <div id="controls" class="controls">
        <button id="btnReplay" class="chip" aria-label="Rever mensagem">
          🔁 LER DE NOVO
        </button>
      </div>
    </main>

    <!-- Botão comentar -->
    <button id="openComment" class="btn-comment">💬 Comentar</button>

    <script>
      // ===== Tema: persistência e alternância =====
      const root = document.documentElement;
      const themeToggle = document.getElementById("themeToggle");
      const savedTheme =
        localStorage.getItem("theme") ||
        root.getAttribute("data-theme") ||
        "light";
      setTheme(savedTheme);

      themeToggle.addEventListener("click", () => {
        const next =
          root.getAttribute("data-theme") === "light" ? "night" : "light";
        setTheme(next);
      });

      function setTheme(mode) {
        root.setAttribute("data-theme", mode);
        localStorage.setItem("theme", mode);
        themeToggle.textContent = mode === "light" ? "☀️" : "🌙";
        // Opcional: ajustar theme-color do navegador
        const themeColor = document.querySelector('meta[name="theme-color"]');
        if (themeColor)
          themeColor.setAttribute(
            "content",
            mode === "light" ? "#fffbef" : "#0d0b1a"
          );
      }

      // ===== Texto com emojis =====
      const LINES = [
        "☀️ Bom dia!",
        "Passei só pra te dizer que hoje acordei pensando em você.💭",
        "Tive um pesadelo daqueles chatos, sabe?😴",
        "Você estava lá, mas não era o seu melhor dia.😕",
        "Tudo parecia pesado, difícil, sem graça.🌧️",
        "Aí você me olhou com aquele seu sorriso leve e disse:🙂",
        "Tá pensando que não vai sentar no meu colo hoje, é?🪶",
        "Então eu ri alto, te abracei forte e acordei.😂",
        "Devo ter sonhado isso por causa das sentadas do dia a dia.🙃",
        "Enfim...",
        "E, sim, já sei que você vai fazer graça…😉",
        "rsrs, impossível não ser você.😄",
        "Ainda bem. O mundo fica mais bonito quando você sorri sem esforço.🌸",
        "Que a manhã não seja a metade do dia que você espera:🌤️",
        "senta, levanta, senta de novo e levanta sorrindo.🪑",
        "A vida é mais leve quando você está por perto, mesmo longe.🌈",
        "Vai lá!🚶‍♀️",
        "E eu te admiro daqui, no volume exato do silêncio.👀",
        "e naquela torcida boa que não precisa aparecer para existir.💫",
        "Bom dia, do jeito que você sabe transformar o dia em você.🌻",
      ];

      const lineEl = document.getElementById("line");
      const signature = document.getElementById("signature");
      const controls = document.getElementById("controls");
      const btnReplay = document.getElementById("btnReplay");

      let cancelToken = { cancelled: false };
      const TYPE_MS =
        Number(
          getComputedStyle(document.documentElement).getPropertyValue(
            "--type-ms"
          )
        ) || 40;

      function sleep(ms) {
        return new Promise((r) => setTimeout(r, ms));
      }

      async function typeLine(text, token) {
        lineEl.classList.remove("show");
        await sleep(40);
        lineEl.textContent = "";
        const cursor = document.createElement("span");
        cursor.className = "cursor";
        lineEl.appendChild(cursor);
        lineEl.classList.add("show");

        for (let i = 0; i < text.length; i++) {
          if (token.cancelled) return;
          cursor.before(document.createTextNode(text[i]));
          await sleep(TYPE_MS);
        }
        await sleep(300);
        cursor.remove();
      }

      async function playMessage() {
        // reset UI
        cancelToken.cancelled = true; // interrompe execução anterior, se houver
        await sleep(10);
        cancelToken = { cancelled: false };
        signature.hidden = true;
        controls.style.display = "none";

        const token = cancelToken;
        for (let i = 0; i < LINES.length; i++) {
          await typeLine(LINES[i], token);
          if (token.cancelled) return;
          await sleep(1400);
        }
        signature.hidden = false;
        controls.style.display = "flex";
      }

      btnReplay.addEventListener("click", playMessage);

      // autoplay inicial
      playMessage();
    </script>
    <script src="./js/card-telemetry.js"></script>
  </body>
</html>
