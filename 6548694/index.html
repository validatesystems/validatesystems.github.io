<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Cards dedicados</title>
    <meta name="color-scheme" content="light dark" />
    <style>
      :root {
        /* Tema Acústico (claro) */
        --bg1: #f8efff;
        --bg2: #e7f3ff;
        --bg3: #ffe9f1;
        --fg: #17172a;
        --muted: #6b6b83;
        --accent: #7c3aed;
        --accent-2: #06b6d4;
        --card: rgba(255, 255, 255, 0.78);
        --glass: blur(10px);
        --ring: 0 0 0 2px rgba(124, 58, 237, 0.25);
      }
      /* Tema Elétrico (escuro) */
      .eletrico {
        --bg1: #0b1020;
        --bg2: #141a39;
        --bg3: #2a1847;
        --fg: #eef0ff;
        --muted: #aab0ff;
        --accent: #22d3ee;
        --accent-2: #a78bfa;
        --card: rgba(20, 20, 40, 1);
        --ring: 0 0 0 2px rgba(34, 211, 238, 0.28);
      }

      * {
        box-sizing: border-box;
      }
      html,
      body {
        height: 100%;
      }
      body {
        margin: 0;
        font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto,
          "Helvetica Neue", Arial;
        color: var(--fg);
        background: linear-gradient(
          -45deg,
          var(--bg1),
          var(--bg2),
          var(--bg3),
          var(--bg2)
        );
        background-size: 400% 400%;
        animation: bgShift 16s ease infinite;
      }
      @keyframes bgShift {
        0% {
          background-position: 0% 50%;
        }
        50% {
          background-position: 100% 50%;
        }
        100% {
          background-position: 0% 50%;
        }
      }

      .page {
        min-height: 100dvh;
        padding: clamp(16px, 4vw, 28px);
        display: grid;
        grid-template-rows: auto auto 1fr auto;
        gap: 18px;
      }

      /* Header */
      .topbar {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 12px;
      }
      .brand {
        display: flex;
        align-items: center;
        gap: 10px;
      }
      .logo {
        width: 36px;
        height: 36px;
        border-radius: 12px;
        object-fit: cover;
        box-shadow: 0 0 8px rgba(0, 0, 0, 0.1);
        animation: float 6s ease-in-out infinite;
      }
      @keyframes float {
        0%,
        100% {
          transform: translateY(0);
        }
        50% {
          transform: translateY(-4px);
        }
      }
      .title {
        margin: 0;
        font-weight: 900;
        font-size: clamp(22px, 4.8vw, 34px);
        letter-spacing: -0.02em;
        line-height: 1.1;
      }
      .subtitle {
        margin: 0;
        opacity: 0.75;
        font-size: 14px;
      }

      .btn {
        appearance: none;
        border: none;
        border-radius: 12px;
        padding: 10px 14px;
        font-weight: 700;
        cursor: pointer;
        background: var(--accent);
        color: #fff;
        box-shadow: 0 6px 18px rgba(0, 0, 0, 0.12);
        transition: transform 0.08s ease, filter 0.2s ease;
      }
      .btn:hover {
        transform: translateY(-1px);
      }
      .btn:active {
        transform: translateY(0) scale(0.98);
      }
      .btn.ghost {
        background: rgba(255, 255, 255, 0.7);
        color: var(--fg);
      }
      .btn.secondary {
        background: var(--accent-2);
      }

      /* Barra de ações */
      .toolbar {
        display: flex;
        gap: 8px;
        justify-content: flex-end;
        align-items: center;
      }

      /* Grid de cards */
      .grid {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
        gap: 14px;
      }
      .card {
        position: relative;
        border-radius: 18px;
        background: var(--card);
        -webkit-backdrop-filter: var(--glass);
        backdrop-filter: var(--glass);
        padding: 14px;
        box-shadow: 0 8px 28px rgba(0, 0, 0, 0.12);
        transition: transform 0.12s ease, box-shadow 0.2s ease;
        overflow: hidden;
      }
      .card:hover {
        transform: translateY(-2px);
        box-shadow: 0 12px 36px rgba(0, 0, 0, 0.16);
      }
      .card-head {
        display: grid;
        grid-template-columns: auto 1fr;
        gap: 12px;
        align-items: center;
      }
      .art {
        width: 56px;
        height: 56px;
        border-radius: 14px;
        display: grid;
        place-items: center;
        font-size: 26px;
        background: radial-gradient(
          100% 100% at 30% 30%,
          var(--accent),
          var(--accent-2)
        );
        color: #fff;
        box-shadow: var(--ring);
      }
      .card-title {
        margin: 0;
        font-weight: 800;
        letter-spacing: -0.01em;
      }
      .card-sub {
        margin: 2px 0 0;
        font-size: 13px;
        color: var(--muted);
      }
      .card-body {
        margin: 10px 0 0;
        font-size: 14px;
        opacity: 0.9;
      }
      .card-actions {
        display: flex;
        gap: 8px;
        margin-top: 12px;
        align-items: center;
      }

      footer {
        text-align: center;
        font-size: 13px;
        opacity: 0.72;
        margin-top: 10px;
      }

      /* ===== Gate (Senha) ===== */
      .gate-backdrop {
        position: fixed;
        inset: 0;
        z-index: 999;
        background: linear-gradient(
          -45deg,
          var(--bg1),
          var(--bg2),
          var(--bg3),
          var(--bg2)
        );
        background-size: 400% 400%;
        display: flex;
        align-items: center;
        justify-content: center;
      }
      .gate-card {
        width: min(560px, 92vw);
        background: var(--card);
        -webkit-backdrop-filter: var(--glass);
        backdrop-filter: var(--glass);
        border-radius: 24px;
        padding: 22px;
        box-shadow: 0 20px 60px rgba(0, 0, 0, 0.25);
        text-align: center;
      }
      .gate-title {
        font-size: clamp(22px, 5vw, 28px);
        margin: 6px 0 4px;
      }
      .gate-sub {
        font-size: clamp(14px, 3.6vw, 16px);
        opacity: 0.85;
        margin: 4px 0 12px;
      }
      .gate-input {
        width: 100%;
        padding: 12px 14px;
        border-radius: 12px;
        border: 1px solid rgba(0, 0, 0, 0.08);
        background: rgba(255, 255, 255, 0.9);
        font-size: 16px;
        outline: none;
      }
      .gate-actions {
        display: flex;
        gap: 10px;
        justify-content: center;
        margin-top: 14px;
        flex-wrap: wrap;
      }
      .gate-error {
        margin-top: 10px;
        color: #ff7b7b;
        font-size: 14px;
        min-height: 18px;
      }

      @keyframes shakeX {
        10%,
        90% {
          transform: translateX(-2px);
        }
        20%,
        80% {
          transform: translateX(4px);
        }
        30%,
        50%,
        70% {
          transform: translateX(-6px);
        }
        40%,
        60% {
          transform: translateX(6px);
        }
      }
      .shake {
        animation: shakeX 0.45s ease;
      }
      .hidden {
        display: none !important;
      }

      /* Evita scroll por trás do gate */
      body.gate-open {
        overflow: hidden;
        height: 100vh;
        position: fixed;
        inset: 0;
        width: 100%;
      }
    </style>
  </head>
  <body>
    <!-- ===== Gate (Senha) ===== -->
    <div
      id="gate"
      class="gate-backdrop"
      role="dialog"
      aria-modal="true"
      aria-labelledby="gateTitle"
    >
      <div class="gate-card">
        <div
          style="
            display: inline-flex;
            gap: 10px;
            align-items: center;
            margin-bottom: 12px;
          "
        >
          <span>🔒</span><span><b>acesso</b> reservado</span>
        </div>
        <h2 id="gateTitle" class="gate-title">Qual é a senha?</h2>
        <p id="gateHint" class="gate-sub">Dica: …</p>
        <input
          id="gateInput"
          class="gate-input"
          type="password"
          autocomplete="off"
          placeholder="Resposta (MAIÚSCULAS)"
        />
        <div id="gateErr" class="gate-error" aria-live="polite"></div>
        <div class="gate-actions">
          <button id="gateEnter" class="btn">Entrar</button>
          <button id="gateTheme" class="btn ghost">Alternar tema</button>
        </div>
      </div>
    </div>

    <main class="page" aria-hidden="true" id="appRoot">
      <!-- Topo -->
      <header class="topbar" aria-label="cabeçalho">
        <div class="brand">
          <img src="./img/ico.png" alt="" class="logo" />
          <div>
            <h1 class="title">Cards para você</h1>
            <p class="subtitle">Escolhar um card</p>
          </div>
        </div>
        <div class="actions">
          <button id="toggleTheme" class="btn ghost" type="button">
            Alternar tema
          </button>
        </div>
      </header>

      <!-- (Opcional) barra extra -->
      <nav class="toolbar" aria-label="ações rápidas"></nav>

      <!-- Grid de projetos -->
      <section class="grid" id="grid" aria-label="lista de páginas"></section>

      <footer>Developed with 💜 by ._.. ...</footer>
    </main>

    <script>
      (function () {
        const $ = (s) => document.querySelector(s);

        /* ==================== CONFIGURE AQUI AS CHAVES ==================== */
        /**
         * Cada item: { id: string, pass: "SENHA", hint: "Dica para exibir" }
         * Obs.: comparação é case-sensitive. Coloque como desejar (ex.: MAIÚSCULAS).
         */
        const KEYS = [
          { id: "lua", pass: "LUA", hint: "Quando o mar dorme, quem brilha?" },
          { id: "vento", pass: "VENTO", hint: "Balança sua rede." },
          { id: "dj", pass: "SEREIA", hint: "DJ do mar" },

          // ---- novas chaves sugeridas ----
          { id: "mare", pass: "MARE", hint: "Sobe e desce sem pedir licença." },
          // { id: "concha", pass: "CONCHA", hint: "Guarda o som do mar." },
          // { id: "farol", pass: "FAROL", hint: "Guia navios na noite." },
          // { id: "sal", pass: "SAL", hint: "Dá sabor e conserva lembranças." },
          // { id: "brisa", pass: "BRISA", hint: "Vento leve do fim de tarde." },
          { id: "onda", pass: "ONDA", hint: "Chega, molha, bagunça e vai." },
          // {
          //   id: "ancora",
          //   pass: "ANCORA",
          //   hint: "Mantém no lugar quando tudo se move.",
          // },
        ];
        /* ================================================================== */

        /* ===== Tema com persistência ===== */
        const THEME_KEY = "theme.mode";
        const themeParam = (
          new URL(location.href).searchParams.get("theme") || ""
        ).toLowerCase();
        const storedTheme = localStorage.getItem(THEME_KEY) || "";
        let currentTheme =
          themeParam === "eletrico"
            ? "eletrico"
            : themeParam === "acustico"
            ? "acustico"
            : storedTheme || "acustico";

        function applyTheme(mode) {
          document.body.classList.toggle("eletrico", mode === "eletrico");
          localStorage.setItem(THEME_KEY, mode);
          currentTheme = mode;
          const btn = $("#toggleTheme");
          if (btn) btn.textContent = "Alternar tema";
        }
        function toggleTheme() {
          applyTheme(currentTheme === "eletrico" ? "acustico" : "eletrico");
        }
        applyTheme(currentTheme);
        $("#toggleTheme")?.addEventListener("click", toggleTheme);

        /* ===== Gate: seleção da chave ===== */
        const gate = $("#gate");
        const gateHint = $("#gateHint");
        const gateInput = $("#gateInput");
        const gateEnter = $("#gateEnter");
        const gateErr = $("#gateErr");
        const gateTheme = $("#gateTheme");
        const appRoot = $("#appRoot");

        // Escolhe o índice com base no horário (muda a cada hora).
        function pickKeyIndex() {
          return Math.floor(Math.random() * KEYS.length);
        }

        // Permite escolher uma chave específica via ?key=id (opcional)
        const keyParam = (
          new URL(location.href).searchParams.get("key") || ""
        ).toLowerCase();
        let currentKeyIndex = (() => {
          const indexByParam = KEYS.findIndex(
            (k) => k.id.toLowerCase() === keyParam
          );
          return indexByParam >= 0 ? indexByParam : pickKeyIndex();
        })();
        let currentKey = KEYS[currentKeyIndex];

        // Exibe a dica selecionada
        function refreshHint() {
          gateHint.textContent = "Dica: " + (currentKey?.hint || "—");
        }

        /* ===== Persistência de sessão ===== */
        const ACCESS_TAG = "cardsAccess.v1"; // chave no sessionStorage
        function grantAccess() {
          try {
            sessionStorage.setItem(ACCESS_TAG, "ok:" + (currentKey?.id || ""));
          } catch {}
          hideGate();
        }
        function hasAccess() {
          try {
            const v = sessionStorage.getItem(ACCESS_TAG) || "";
            return v.startsWith("ok:");
          } catch {
            return false;
          }
        }

        /* ===== Mostrar/ocultar gate ===== */
        function showGate() {
          document.body.classList.add("gate-open");
          gate.classList.remove("hidden");
          appRoot.setAttribute("aria-hidden", "true");
          refreshHint();
          setTimeout(() => gateInput?.focus(), 60);
        }
        function hideGate() {
          gate.classList.add("hidden");
          document.body.classList.remove("gate-open");
          appRoot.removeAttribute("aria-hidden");
        }

        function shake(msg) {
          if (gateErr) gateErr.textContent = msg || "Senha incorreta 😅";
          const card = gate.querySelector(".gate-card");
          card.classList.remove("shake");
          void card.offsetWidth;
          card.classList.add("shake");
        }

        function checkPass() {
          const v = (gateInput?.value || "").trim();
          if (!currentKey) return shake("Nenhuma chave ativa.");
          if (v === currentKey.pass) {
            grantAccess();
          } else {
            shake("Ops, foi quase. Tenta de novo?");
          }
        }

        // Inicializa gate
        if (hasAccess()) {
          hideGate();
        } else {
          showGate();
        }

        // Eventos do gate
        gateEnter?.addEventListener("click", checkPass);
        gateInput?.addEventListener("keyup", (e) => {
          if (e.key === "Enter") checkPass();
        });
        gateTheme?.addEventListener("click", () => {
          toggleTheme();
          const card = gate.querySelector(".gate-card");
          card.classList.add("shake");
          setTimeout(() => card.classList.remove("shake"), 380);
        });

        /* ===== Grid de cards ===== */
        const grid = $("#grid");
        const cards = [
          {
            emoji: "🌱",
            title: "Bom dia - Semente de luz.",
           sub: "Bom dia especial para alguém mais do que especial",
           desc: "Página de bom dia que planta uma semente para você iluminar.",
           href: "./index(bom dia semente de luz).html",
         },
          {
            emoji: "🫙",
            title: "Cartas Engarrafadas",
            sub: "Mensagens especiais do mar",
            desc: "Página de cartas engarrafadas: mensagens que o mar traz pra você.",
            href: "./index(cartas engarrafadas).html",
          },
          {
            emoji: "🌅",
            title: "Bom dia — Caos que acalma",
            sub: "Mensagem especial",
            desc: "Página de bom dia no estilo morde & assopra: revira e acalma.",
            href: "./index(bom dia morde e assopra).html",
          },
          {
            emoji: "🎧",
            title: "Cards Musicais",
            sub: "Página com player e faixas",
            desc: "Set de músicas, citações e aquele clima de mar + caos bom.",
            href: "./index(musical).html",
          },
          {
            emoji: "🍯",
            title: "Doce e Salgado",
            sub: "Página com mensagens que trazem a combinação de doce e salgado",
            desc: "Entre o doce e o salgado…",
            href: "./index(doce e salgado).html",
          },
        ];

        function render() {
          grid.innerHTML = "";
          for (const c of cards) {
            const a = document.createElement("article");
            a.className = "card";
            a.innerHTML = `
              <div class="card-head">
                <div class="art" aria-hidden="true">${c.emoji}</div>
                <div>
                  <h3 class="card-title">${c.title}</h3>
                  <p class="card-sub">${c.sub}</p>
                </div>
              </div>
              <div class="card-body">${c.desc}</div>
              <div class="card-actions">
                <a class="btn secondary" href="${c.href}">Abrir</a>
              </div>
            `;
            // acessibilidade via teclado (Enter/Space abre o link)
            a.tabIndex = 0;
            a.addEventListener("click", (e) => {
              const isButton = e.target.closest("a,button");
              if (!isButton) location.href = c.href;
            });
            a.addEventListener("keyup", (e) => {
              if (e.key === "Enter" || e.key === " ") location.href = c.href;
            });
            grid.appendChild(a);
          }
        }
        render();
      })();
    </script>
  </body>
</html>
