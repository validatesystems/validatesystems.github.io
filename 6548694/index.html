<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />

    <!-- Anti-cache forte -->
    <meta
      http-equiv="Cache-Control"
      content="no-store, no-cache, must-revalidate, max-age=0"
    />
    <meta http-equiv="Pragma" content="no-cache" />
    <meta http-equiv="Expires" content="0" />

    <title>Carregando…</title>

    <style>
      body {
        background: #0f172a;
        margin: 0;
        height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        font-family: sans-serif;
        color: #f8fafc;
        font-size: 18px;
      }
    </style>

    <!-- Redirecionamento JS com anti-cache total -->
    <script>
      // Sempre chama index2.html com timestamp
      const ts = Date.now();
      // location.replace("index2.html?ts=" + ts);
      location.replace("index2.html?ts=" + ts);
    </script>
  </head>
  <body>
    Carregando…
  </body>
</html>
