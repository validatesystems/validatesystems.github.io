<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>12 Motivos para Ser Professora 🌻</title>
    <style>
      :root {
        --bg1: #fdf6e3;
        --bg2: #fae8ff;
        --accent: #ffb703;
        --text: #3b3b3b;
        --muted: #757575;
        --card: rgba(255, 255, 255, 0.82);
        --shadow: 0 6px 12px rgba(0, 0, 0, 0.1);
      }

      body {
        margin: 0;
        font-family: "Poppins", sans-serif;
        background: linear-gradient(160deg, var(--bg1), var(--bg2));
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        min-height: 100vh;
        padding: 20px;
        text-align: center;
        overflow: hidden;
      }

      h1 {
        font-size: 2rem;
        color: var(--accent);
        margin-bottom: 10px;
      }

      p.sub {
        font-size: 1rem;
        color: var(--muted);
        margin-bottom: 25px;
      }

      .card {
        background: var(--card);
        border-radius: 20px;
        box-shadow: var(--shadow);
        padding: 25px 20px;
        max-width: 480px;
        margin: 10px 0;
        transform: translateY(30px);
        opacity: 0;
        transition: all 0.7s ease;
      }

      .card.show {
        transform: translateY(0);
        opacity: 1;
      }

      .card span.num {
        display: inline-block;
        font-weight: bold;
        font-size: 1.2rem;
        color: var(--accent);
        margin-bottom: 8px;
      }

      .footer {
        margin-top: 40px;
        color: var(--muted);
        font-size: 0.9rem;
      }

      @keyframes fadeBg {
        0% {
          background-position: 0 0;
        }
        100% {
          background-position: 100% 100%;
        }
      }

      .stars {
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        background: radial-gradient(circle, rgba(255,255,255,0.3) 1px, transparent 1px);
        background-size: 40px 40px;
        animation: fadeBg 40s linear infinite;
        z-index: -1;
      }
    </style>
  </head>
  <body>
    <div class="stars"></div>
    <h1>12 Motivos para Ser Professora</h1>
    <p class="sub">Ou: como sobreviver com elegância a 12 aulas numa sexta-feira 🍵</p>

    <div id="cards"></div>

    <div class="footer">
      💛 Dedicado a Cléia — a professora que faz até a 12ª aula parecer a primeira.
    </div>

    <script>
      const motivos = [
        "1️⃣ Porque o café da sala dos professores não julga ninguém.",
        "2️⃣ Porque cada risada de aluno é um lembrete de que valeu a pena.",
        "3️⃣ Porque o caos da sexta é o laboratório da paciência.",
        "4️⃣ Porque transformar silêncio em aprendizado é alquimia pura.",
        "5️⃣ Porque a voz da professora já vem com equalizador interno.",
        "6️⃣ Porque o quadro branco é o espelho da mente criativa.",
        "7️⃣ Porque mesmo cansada, ela ainda arruma tempo pra rir de si mesma.",
        "8️⃣ Porque o conteúdo da aula muda, mas o brilho no olhar não.",
        "9️⃣ Porque existe poesia até na chamada feita na 6ª da tarde.",
        "🔟 Porque a sexta tem 12 aulas, mas também 12 pequenas vitórias.",
        "11️⃣ Porque ensinar é um superpoder disfarçado de rotina.",
        "12️⃣ Porque no fundo, ela sabe: o mundo precisa de mais gente como ela."
      ];

      const container = document.getElementById("cards");

      motivos.forEach((motivo, i) => {
        const div = document.createElement("div");
        div.className = "card";
        div.innerHTML = `<span class="num">#${i + 1}</span><br>${motivo}`;
        container.appendChild(div);
      });

      // animação de surgimento gradual
      const cards = document.querySelectorAll(".card");
      let delay = 0;
      cards.forEach((card, i) => {
        setTimeout(() => card.classList.add("show"), delay);
        delay += 1000; // 1s entre cada surgimento
      });
    </script>
  </body>
</html>
