<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Constelação de Pensamentos — para Cléia</title>
    <meta name="color-scheme" content="light dark" />
    <style>
      :root {
        --space1: #050815;
        --space2: #0b1025;
        --space3: #111a34;
        --fg: #e8edf6;
        --muted: #9fb0c7;
        --accent: #7dd3fc; /* ciano */
        --accent-2: #c4b5fd; /* lavanda */
        --card: rgba(15, 23, 42, 0.55);
        --glass: blur(12px);
        --ring: 0 0 0 2px rgba(125, 211, 252, 0.25);
        --shadow: 0 18px 60px rgba(0, 0, 0, 0.35);
      }

      html,
      body {
        height: 100%;
      }
      body {
        margin: 0;
        color: var(--fg);
        font-family: ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto,
          Ubuntu, Cantarell, "Helvetica Neue", Arial;
        background: radial-gradient(
            1200px 800px at 50% -10%,
            var(--space3),
            transparent 60%
          ),
          radial-gradient(
            900px 600px at 100% 0%,
            var(--space2),
            transparent 55%
          ),
          linear-gradient(180deg, var(--space1), var(--space2));
        overflow: hidden;
      }

      header {
        position: fixed;
        top: 10px;
        left: 50%;
        transform: translateX(-50%);
        background: var(--card);
        backdrop-filter: var(--glass);
        border-radius: 14px;
        box-shadow: var(--shadow);
        padding: 8px 12px;
        z-index: 20;
        display: flex;
        align-items: center;
        gap: 10px;
        font-size: 13px;
      }
      header h1 {
        margin: 0;
        font-size: 14px;
        letter-spacing: 0.3px;
      }
      .pill {
        display: inline-flex;
        align-items: center;
        gap: 6px;
        padding: 6px 10px;
        border-radius: 999px;
        background: rgba(125, 211, 252, 0.12);
        border: 1px solid rgba(125, 211, 252, 0.25);
      }

      .controls {
        position: fixed;
        right: 12px;
        bottom: 12px;
        z-index: 22;
        display: flex;
        flex-direction: column;
        gap: 10px;
      }
      .btn {
        background: var(--card);
        color: var(--fg);
        border: 1px solid rgba(255, 255, 255, 0.08);
        backdrop-filter: var(--glass);
        border-radius: 12px;
        padding: 10px 12px;
        cursor: pointer;
        display: inline-flex;
        align-items: center;
        gap: 8px;
        font-size: 13px;
        box-shadow: var(--shadow);
        transition: transform 0.08s ease;
        user-select: none;
      }
      .btn:active {
        transform: scale(0.98);
      }
      .btn:focus-visible {
        outline: var(--ring);
      }

      canvas {
        position: fixed;
        inset: 0;
        display: block;
      }

      /* Painel de texto ao clicar na estrela */
      .panel {
        position: fixed;
        left: 50%;
        top: 50%;
        transform: translate(-50%, -46%);
        width: min(92vw, 720px);
        background: linear-gradient(
          180deg,
          rgba(17, 24, 39, 0.66),
          rgba(2, 6, 23, 0.66)
        );
        border: 1px solid rgba(148, 163, 184, 0.18);
        border-radius: 16px;
        box-shadow: var(--shadow);
        padding: 18px 18px 16px;
        z-index: 40;
        opacity: 0;
        pointer-events: none;
      }
      .panel.show {
        opacity: 1;
        pointer-events: auto;
      }
      .panel h2 {
        margin: 0 0 10px;
        font-size: 18px;
        color: var(--accent);
      }
      .panel p {
        margin: 0;
        font-size: 16px;
        color: var(--fg);
        line-height: 1.5;
      }
      .panel .meta {
        margin-top: 10px;
        font-size: 12px;
        color: var(--muted);
      }
      .panel .close {
        position: absolute;
        right: 10px;
        top: 10px;
        cursor: pointer;
        font-size: 16px;
        opacity: 0.8;
      }

      /* Tooltip próximo da estrela */
      .bubble {
        position: absolute;
        transform: translate(-50%, -140%);
        background: var(--card);
        backdrop-filter: var(--glass);
        padding: 8px 10px;
        border-radius: 10px;
        font-size: 12px;
        box-shadow: var(--shadow);
        opacity: 0;
        pointer-events: none;
        z-index: 30;
      }

      .hint {
        position: fixed;
        bottom: 12px;
        left: 12px;
        background: var(--card);
        backdrop-filter: var(--glass);
        border-radius: 12px;
        padding: 8px 12px;
        color: var(--muted);
        font-size: 13px;
        z-index: 21;
      }
    </style>
  </head>
  <body>
    <header>
      <h1>🌌 Constelação de Pensamentos</h1>
      <span class="pill">Clique em uma estrela ✨</span>
    </header>

    <canvas id="sky" aria-label="Céu estrelado interativo"></canvas>

    <div class="controls" aria-label="Controles">
      <button class="btn" id="btnDrift">🚀 Modo viagem</button>
      <button class="btn" id="btnAudio">🔇 Som</button>
      <button class="btn" id="btnReset">♻️ Reset conexões</button>
    </div>

    <div class="hint">
      Dica: arraste para passear, role para aproximar. Toque em uma estrela para
      ouvir e ler.
    </div>

    <div class="panel" id="panel">
      <div class="close" id="panelClose" title="Fechar">✖</div>
      <h2 id="panelTitle">Estrela</h2>
      <p id="panelText">Texto</p>
      <div class="meta" id="panelMeta"></div>
    </div>

    <div class="bubble" id="bubble">texto</div>

    <!-- GSAP -->
    <script src="https://unpkg.com/gsap@3/dist/gsap.min.js"></script>

    <script>
      // ==========================
      // Dados: lembranças & frases
      // ==========================
      const DATA = {
        qualidades: [
          "calma que organiza",
          "humor que desarma",
          "intuição matemática",
          "olhar que acolhe",
          "coragem silenciosa",
          "elegância nas pausas",
          "clareza que não intimida",
          "paciência com brilho",
          "jeito de luz sem holofote",
        ],
        lembrancas: [
          "a risada que salva a sexta",
          "o café que virou piada",
          "o link enviado na hora certa",
          "a reunião que ficou leve",
          "o áudio que virou abraço",
          "o dia chuvoso que riu de si",
          "o conselho que economizou um mês",
          "o silêncio que explicou tudo",
        ],
        frases: [
          "Você é bússola em noite sem lua.",
          "Seu jeito acalma marés internas.",
          "Até o caos aceita sua diplomacia.",
          "Seu riso é meteorologia: muda o clima.",
          "Quando você chega, as vírgulas respiram.",
          "Seu cuidado tem gravidade própria.",
        ],
      };

      // ==========================
      // Áudio: ambiente + chime
      // ==========================
      const AudioKit = (() => {
        let ctx,
          master,
          lfo,
          gainAmb,
          enabled = false;
        function init() {
          if (ctx) return;
          ctx = new (window.AudioContext || window.webkitAudioContext)();
          master = ctx.createGain();
          master.gain.value = 0.6;
          master.connect(ctx.destination);
          // ambiente: duas ondas suaves com LFO
          const osc1 = ctx.createOscillator();
          osc1.type = "sine";
          osc1.frequency.value = 156; // sol grave
          const osc2 = ctx.createOscillator();
          osc2.type = "sine";
          osc2.frequency.value = 196; // lá grave aprox
          gainAmb = ctx.createGain();
          gainAmb.gain.value = 0.0; // começa mudo
          osc1.connect(gainAmb);
          osc2.connect(gainAmb);
          gainAmb.connect(master);
          lfo = ctx.createOscillator();
          lfo.type = "sine";
          lfo.frequency.value = 0.06; // respiração lenta
          const lfoGain = ctx.createGain();
          lfoGain.gain.value = 0.25; // profundidade da modulação
          lfo.connect(lfoGain);
          lfoGain.connect(gainAmb.gain);
          osc1.start();
          osc2.start();
          lfo.start();
        }
        function resume() {
          if (ctx && ctx.state === "suspended") ctx.resume();
        }
        function toggle(on) {
          init();
          resume();
          enabled = on !== undefined ? on : !enabled;
          gsap.to(gainAmb.gain, {
            value: enabled ? 0.12 : 0.0,
            duration: 0.8,
            ease: "power2.out",
          });
          return enabled;
        }
        function chime() {
          init();
          resume();
          const o = ctx.createOscillator();
          o.type = "sine";
          o.frequency.setValueAtTime(660, ctx.currentTime);
          const g = ctx.createGain();
          g.gain.value = 0.0001;
          o.connect(g);
          g.connect(master);
          const t = ctx.currentTime;
          g.gain.exponentialRampToValueAtTime(0.2, t + 0.02);
          g.gain.exponentialRampToValueAtTime(0.00001, t + 1.2);
          o.frequency.exponentialRampToValueAtTime(990, t + 0.6);
          o.start();
          o.stop(t + 1.25);
        }
        return { toggle, chime };
      })();

      // ==========================
      // Sky: cena em Canvas 2D
      // ==========================
      const canvas = document.getElementById("sky");
      const ctx = canvas.getContext("2d");
      let W, H, DPR;

      const stars = []; // {x,y,depth,size,twinkle, label}
      const links = []; // pares conectados ao clicar
      let offsetX = 0,
        offsetY = 0; // pan
      let zoom = 1; // zoom
      let drift = false; // modo viagem
      let mouse = { x: 0, y: 0 };

      function resize() {
        DPR = Math.min(devicePixelRatio || 1, 2);
        W = canvas.clientWidth = window.innerWidth;
        H = canvas.clientHeight = window.innerHeight;
        canvas.width = W * DPR;
        canvas.height = H * DPR;
        ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
      }
      window.addEventListener("resize", resize);
      resize();

      function rand(a, b) {
        return a + Math.random() * (b - a);
      }
      function choice(arr) {
        return arr[Math.floor(Math.random() * arr.length)];
      }

      function buildStars(count = 220) {
        stars.length = 0;
        const labels = [
          ...DATA.qualidades.map((t) => ({ group: "Qualidade", text: t })),
          ...DATA.lembrancas.map((t) => ({ group: "Lembrança", text: t })),
          ...DATA.frases.map((t) => ({ group: "Frase", text: t })),
        ];
        for (let i = 0; i < count; i++) {
          const depth = rand(0.3, 1.0); // 0.3 = mais distante
          const size = Math.pow(1 / depth, 1.2) * rand(0.6, 1.8);
          const label = i < labels.length ? labels[i] : choice(labels);
          stars.push({
            x: rand(-2000, 2000),
            y: rand(-1200, 1200),
            depth,
            size,
            twinkle: rand(0, Math.PI * 2),
            label,
          });
        }
      }
      buildStars();

      // Converte de mundo -> tela
      function worldToScreen(x, y, d) {
        const px = (x + offsetX) * zoom * (1 / d) + W / 2;
        const py = (y + offsetY) * zoom * (1 / d) + H / 2;
        return { x: px, y: py };
      }

      function draw() {
        ctx.clearRect(0, 0, W, H);
        // fundo nebuloso
        const g = ctx.createRadialGradient(
          W * 0.7,
          H * 0.1,
          0,
          W * 0.7,
          H * 0.1,
          Math.max(W, H)
        );
        g.addColorStop(0, "rgba(124, 58, 237, 0.06)");
        g.addColorStop(1, "rgba(0,0,0,0)");
        ctx.fillStyle = g;
        ctx.fillRect(0, 0, W, H);

        // leve drift
        if (drift) {
          offsetX += 0.05;
          offsetY += Math.sin(Date.now() / 4000) * 0.02;
        }

        // desenha linhas de conexões primeiro (atrás das estrelas mais próximas)
        ctx.lineWidth = 1;
        ctx.strokeStyle = "rgba(125, 211, 252, 0.28)";
        links.forEach(({ a, b, alpha }) => {
          const sa = worldToScreen(a.x, a.y, a.depth);
          const sb = worldToScreen(b.x, b.y, b.depth);
          ctx.globalAlpha = alpha ?? 0.7;
          ctx.beginPath();
          ctx.moveTo(sa.x, sa.y);
          ctx.lineTo(sb.x, sb.y);
          ctx.stroke();
          ctx.globalAlpha = 1;
        });

        // estrelas
        for (const s of stars) {
          const p = worldToScreen(s.x, s.y, s.depth);
          if (p.x < -20 || p.x > W + 20 || p.y < -20 || p.y > H + 20) continue;
          const tw = 0.6 + 0.4 * Math.sin(Date.now() / 800 + s.twinkle);
          const r = s.size * tw * zoom * (1 / s.depth);
          ctx.beginPath();
          ctx.fillStyle = "rgba(255,255,255,0.9)";
          ctx.arc(p.x, p.y, r, 0, Math.PI * 2);
          ctx.fill();
          // halo
          const grd = ctx.createRadialGradient(p.x, p.y, 0, p.x, p.y, r * 4);
          grd.addColorStop(0, "rgba(125, 211, 252, 0.35)");
          grd.addColorStop(1, "rgba(125, 211, 252, 0.0)");
          ctx.fillStyle = grd;
          ctx.beginPath();
          ctx.arc(p.x, p.y, r * 4, 0, Math.PI * 2);
          ctx.fill();
        }
        requestAnimationFrame(draw);
      }
      requestAnimationFrame(draw);

      // Interação: pan, zoom
      let isPanning = false;
      let panStart = { x: 0, y: 0 };
      let startOffset = { x: 0, y: 0 };
      canvas.addEventListener("pointerdown", (e) => {
        isPanning = true;
        panStart.x = e.clientX;
        panStart.y = e.clientY;
        startOffset.x = offsetX;
        startOffset.y = offsetY;
        canvas.setPointerCapture(e.pointerId);
      });
      canvas.addEventListener("pointermove", (e) => {
        if (!isPanning) return;
        const dx = (e.clientX - panStart.x) / (zoom * 0.9);
        const dy = (e.clientY - panStart.y) / (zoom * 0.9);
        offsetX = startOffset.x + dx;
        offsetY = startOffset.y + dy;
      });
      canvas.addEventListener("pointerup", () => {
        isPanning = false;
      });
      canvas.addEventListener("wheel", (e) => {
        e.preventDefault();
        const z0 = zoom;
        zoom *= e.deltaY > 0 ? 0.95 : 1.05;
        zoom = Math.min(Math.max(zoom, 0.5), 3);
      });

      // Picking (descobrir qual estrela foi clicada)
      function pickStar(clientX, clientY) {
        // invert worldToScreen aproximando (busca linear suficiente p/ N baixo)
        let picked = null;
        let minD = 12;
        for (const s of stars) {
          const p = worldToScreen(s.x, s.y, s.depth);
          const dx = clientX - p.x,
            dy = clientY - p.y;
          const d = Math.hypot(dx, dy);
          const r = s.size * zoom * (1 / s.depth) * 3.0; // tolerância
          if (d < r && d < minD) {
            picked = s;
            minD = d;
          }
        }
        return picked;
      }

      const bubble = document.getElementById("bubble");
      function showBubbleAt(x, y, text) {
        bubble.textContent = text;
        bubble.style.left = x + "px";
        bubble.style.top = y + "px";
        gsap.killTweensOf(bubble);
        bubble.style.opacity = 0;
        gsap.to(bubble, {
          opacity: 1,
          duration: 0.25,
          y: -4,
          ease: "power2.out",
          onComplete: () => {
            gsap.to(bubble, {
              opacity: 0,
              duration: 0.6,
              delay: 2.8,
              y: -8,
              ease: "power1.inOut",
            });
          },
        });
      }

      function connectNearest(from, k = 3) {
        // conecta a k estrelas mais próximas para sugerir constelação
        const sorted = [...stars].sort(
          (a, b) =>
            (a === from ? Infinity : dist(from, a)) -
            (b === from ? Infinity : dist(from, b))
        );
        const candidates = sorted.slice(1, k + 1);
        candidates.forEach((to) => {
          links.push({ a: from, b: to, alpha: 0.0 });
          gsap.to(links[links.length - 1], {
            alpha: 0.7,
            duration: 0.8,
            ease: "power2.out",
          });
        });
      }
      function dist(a, b) {
        const dx = a.x - b.x,
          dy = a.y - b.y;
        return Math.hypot(dx, dy);
      }

      // Painel
      const panel = document.getElementById("panel");
      const panelTitle = document.getElementById("panelTitle");
      const panelText = document.getElementById("panelText");
      const panelMeta = document.getElementById("panelMeta");
      const panelClose = document.getElementById("panelClose");
      function openPanel(star) {
        panelTitle.textContent = "⭐ " + star.label.text;
        panelText.textContent = pickPanelLine(star);
        panelMeta.textContent =
          star.label.group + " — " + new Date().toLocaleString();
        panel.classList.add("show");
        gsap.fromTo(
          panel,
          { scale: 0.96, opacity: 0 },
          { scale: 1, opacity: 1, duration: 0.35, ease: "power2.out" }
        );
      }
      function closePanel() {
        gsap.to(panel, {
          scale: 0.98,
          opacity: 0,
          duration: 0.25,
          ease: "power2.in",
          onComplete: () => panel.classList.remove("show"),
        });
      }
      panelClose.addEventListener("click", closePanel);
      window.addEventListener("keydown", (e) => {
        if (e.key === "Escape") closePanel();
      });

      function pickPanelLine(star) {
        const lines = [
          "Quando penso em você, até o céu muda de assunto.",
          "Seu riso é trilha sonora de noite sem pressa.",
          "A calma que você traz cabe em constelações inteiras.",
          "Algumas presenças têm gravidade: a sua puxa o melhor de mim.",
          "Seus conselhos são estrelas-guia — pequenos e decisivos.",
        ];
        return lines[Math.floor(Math.random() * lines.length)];
      }

      // Clique/tap numa estrela
      canvas.addEventListener("click", (e) => {
        const rect = canvas.getBoundingClientRect();
        const x = e.clientX - rect.left,
          y = e.clientY - rect.top;
        const s = pickStar(x, y);
        if (!s) return;
        // Anima: pulso da estrela + linhas
        AudioKit.chime();
        pulseAt(s, x, y);
        connectNearest(s, 3);
        showBubbleAt(x, y, s.label.text);
        openPanel(s);
      });

      function pulseAt(star, sx, sy) {
        // pequeno círculo expandindo no canvas (overlay via DOM)
        const circle = document.createElement("div");
        circle.style.position = "fixed";
        circle.style.left = sx + "px";
        circle.style.top = sy + "px";
        circle.style.width = "8px";
        circle.style.height = "8px";
        circle.style.borderRadius = "999px";
        circle.style.border = "2px solid rgba(125,211,252,.9)";
        circle.style.pointerEvents = "none";
        circle.style.zIndex = 25;
        document.body.appendChild(circle);
        gsap.to(circle, {
          width: 180,
          height: 180,
          x: -86,
          y: -86,
          borderWidth: 1,
          opacity: 0,
          duration: 0.8,
          ease: "power2.out",
          onComplete: () => circle.remove(),
        });
      }

      // Controles
      const btnDrift = document.getElementById("btnDrift");
      const btnAudio = document.getElementById("btnAudio");
      const btnReset = document.getElementById("btnReset");

      btnDrift.addEventListener("click", () => {
        drift = !drift;
        btnDrift.textContent = drift ? "🛰️ Pausar viagem" : "🚀 Modo viagem";
      });

      btnAudio.addEventListener("click", () => {
        const on = AudioKit.toggle();
        btnAudio.textContent = on ? "🔊 Som" : "🔇 Som";
      });

      btnReset.addEventListener("click", () => {
        links.length = 0;
      });

      // Habilitar áudio no primeiro gesto do usuário (políticas de autoplay)
      window.addEventListener(
        "pointerdown",
        () => {
          // Pré-liga ambiente, mas em volume baixo (só após usuário clicar no botão Som ativará de fato)
          // Mantemos aqui apenas a retomada do contexto para permitir chimes.
          AudioKit.toggle(false); // garante init
        },
        { once: true }
      );

      // Texto de boas-vindas
      setTimeout(() => {
        const welcome = document.createElement("div");
        welcome.textContent =
          "Bem-vinda à Constelação de Pensamentos. Toque as estrelas ✨";
        welcome.style.position = "fixed";
        welcome.style.left = "50%";
        welcome.style.top = "72px";
        welcome.style.transform = "translateX(-50%)";
        welcome.style.padding = "10px 14px";
        welcome.style.background = "rgba(2,6,23,.55)";
        welcome.style.backdropFilter = "blur(8px)";
        welcome.style.border = "1px solid rgba(148,163,184,.18)";
        welcome.style.borderRadius = "12px";
        welcome.style.boxShadow = "0 10px 30px rgba(0,0,0,.35)";
        welcome.style.fontSize = "14px";
        welcome.style.zIndex = "19";
        welcome.style.opacity = "0";
        document.body.appendChild(welcome);
        gsap.to(welcome, {
          opacity: 1,
          y: 0,
          duration: 0.4,
          ease: "power2.out",
        });
        gsap.to(welcome, {
          opacity: 0,
          duration: 0.6,
          delay: 3.2,
          ease: "power1.inOut",
          onComplete: () => welcome.remove(),
        });
      }, 400);
    </script>
  </body>
</html>
