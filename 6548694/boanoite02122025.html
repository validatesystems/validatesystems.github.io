<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <title>Boa noite, Cléia</title>

    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500;600&display=swap"
    />

    <style>
      :root {
        --bg1: #0b0f19;
        --bg2: #141a29;
        --bg3: #0d1220;
        --card: rgba(23, 28, 45, 0.92);
        --border-soft: rgba(148, 163, 184, 0.35);
        --text-main: #e5e7eb;
        --text-soft: #9ca3af;
      }

      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      body {
        min-height: 100vh;
        font-family: "DM Sans", sans-serif;
        color: var(--text-main);
        background: radial-gradient(circle at 20% 0%, #1b2437, transparent 60%),
          radial-gradient(circle at 100% 80%, #0a0f1a, transparent 60%),
          linear-gradient(135deg, var(--bg1), var(--bg2), var(--bg3));
        padding: 20px;
        display: flex;
        justify-content: center;
        align-items: center;
        position: relative;
        overflow: hidden;
      }

      /* textura suave */
      body::before {
        content: "";
        position: absolute;
        inset: 0;
        background-image: url("https://www.transparenttextures.com/patterns/noisy.png");
        opacity: 0.18;
        mix-blend-mode: soft-light;
        pointer-events: none;
      }

      .shell {
        width: 100%;
        max-width: 540px;
        z-index: 2;
      }

      .card {
        background: var(--card);
        border: 1px solid var(--border-soft);
        border-radius: 22px;
        padding: 26px 22px;
        backdrop-filter: blur(10px);
        -webkit-backdrop-filter: blur(10px);
        box-shadow: 0 18px 40px rgba(0, 0, 0, 0.5),
          0 0 0 1px rgba(15, 15, 30, 0.7);
        animation: fadeIn 700ms ease-out;
      }

      @keyframes fadeIn {
        0% {
          opacity: 0;
          transform: translateY(18px);
          filter: blur(4px);
        }
        100% {
          opacity: 1;
          transform: translateY(0);
          filter: blur(0);
        }
      }

      .chip {
        display: inline-flex;
        align-items: center;
        gap: 6px;
        padding: 4px 11px;
        border-radius: 999px;
        font-size: 10px;
        letter-spacing: 0.16em;
        text-transform: uppercase;
        border: 1px solid rgba(148, 163, 184, 0.5);
        color: var(--text-soft);
        margin-bottom: 16px;
      }

      .chip-dot {
        width: 6px;
        height: 6px;
        border-radius: 999px;
        background: #818cf8;
        box-shadow: 0 0 0 3px rgba(129, 140, 248, 0.35);
      }

      h1 {
        font-size: 1.3rem;
        margin-bottom: 14px;
      }

      .text {
        font-size: 1rem;
        line-height: 1.75;
        text-wrap: balance;
      }

      .text-soft {
        margin-top: 10px;
        font-size: 0.9rem;
        color: var(--text-soft);
      }

      .divider {
        height: 1px;
        background: linear-gradient(90deg, transparent, #94a3b8, transparent);
        margin: 22px 0 14px;
      }

      .signature-label {
        font-size: 0.78rem;
        color: var(--text-soft);
      }

      .signature {
        text-align: right;
        font-size: 0.86rem;
        color: var(--text-soft);
        margin-top: 6px;
        min-height: 24px;
      }

      @media (max-width: 480px) {
        .card {
          padding: 22px 16px;
        }
        h1 {
          font-size: 1.22rem;
        }
        .text {
          font-size: 0.95rem;
        }
      }
    </style>
  </head>

  <body>
    <div class="shell">
      <div class="card">
        <div class="chip">
          <span class="chip-dot"></span>
          boa noite, Cléia
        </div>

        <h1>Oi, boa noite!</h1>

        <p class="text">
          Passando por aqui para te desejar uma excelente noite.
        </p>

        <p class="text">
          Como quase sempre, estou até a madrugada debruçado em códigos.
        </p>

        <p class="text">Se quiser, me chama no WhatsApp para bater um papo.</p>
        <p class="text">Se fizer isso, me manda o emoji abaixo.</p>
        <p class="text">😶‍🌫️</p>

        <!-- <p class="text-soft">
          E que esse pouquinho de calma chegue até aí com sinceridade.
        </p> -->

        <div class="divider"></div>

        <!-- <p class="signature-label"></p> -->
        <p class="signature">._.. ...</p>
      </div>
    </div>
  </body>
</html>
