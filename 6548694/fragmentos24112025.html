<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <title>Fragmentos que te encontram</title>

    <!-- Fonte elegante e simples -->
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500&display=swap"
    />

    <style>
      :root {
        --bg-1: #05060a;
        --bg-2: #050710;
        --accent: #f5e6ff;
        --accent-soft: #c7b2ff;
        --muted: #a0a0bd;
        --text-main: #f8f5ff;
      }

      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      html,
      body {
        height: 100%;
      }

      body {
        font-family: "DM Sans", system-ui, -apple-system, BlinkMacSystemFont,
          "Segoe UI", sans-serif;
        background: radial-gradient(
            circle at 0% 0%,
            rgba(255, 255, 255, 0.05),
            transparent 55%
          ),
          radial-gradient(
            circle at 100% 0%,
            rgba(255, 255, 255, 0.03),
            transparent 55%
          ),
          radial-gradient(
            circle at 0% 100%,
            rgba(0, 0, 0, 0.5),
            transparent 65%
          ),
          linear-gradient(145deg, var(--bg-1), var(--bg-2));
        color: var(--text-main);
        -webkit-font-smoothing: antialiased;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 16px;
        position: relative;
        overflow: hidden;
      }

      /* Granulação suave */
      body::before {
        content: "";
        position: fixed;
        inset: 0;
        pointer-events: none;
        opacity: 0.25;
        background-image: repeating-linear-gradient(
            0deg,
            rgba(255, 255, 255, 0.06),
            rgba(255, 255, 255, 0.06) 1px,
            transparent 1px,
            transparent 3px
          ),
          repeating-linear-gradient(
            90deg,
            rgba(0, 0, 0, 0.45),
            rgba(0, 0, 0, 0.45) 1px,
            transparent 1px,
            transparent 4px
          );
        mix-blend-mode: soft-light;
        z-index: 0;
      }

      .shell {
        position: relative;
        z-index: 1;
        max-width: 520px;
        width: 100%;
      }

      .orb {
        position: absolute;
        inset: -40%;
        background: radial-gradient(
            circle at 10% 15%,
            rgba(199, 178, 255, 0.16),
            transparent 60%
          ),
          radial-gradient(
            circle at 80% 85%,
            rgba(103, 232, 249, 0.08),
            transparent 60%
          );
        opacity: 0.9;
        filter: blur(18px);
        pointer-events: none;
        z-index: -1;
      }

      .card {
        position: relative;
        border-radius: 24px;
        padding: 28px 22px 22px;
        background: radial-gradient(
            circle at 0 0,
            rgba(255, 255, 255, 0.05),
            transparent 60%
          ),
          rgba(11, 12, 22, 0.8);
        border: 1px solid rgba(255, 255, 255, 0.08);
        box-shadow: 0 18px 60px rgba(0, 0, 0, 0.75),
          0 0 0 1px rgba(255, 255, 255, 0.04);
        backdrop-filter: blur(20px);
        -webkit-backdrop-filter: blur(20px);
        transform-origin: center;
        animation: card-enter 700ms ease-out;
      }

      @keyframes card-enter {
        0% {
          opacity: 0;
          transform: translateY(12px) scale(0.98);
        }
        100% {
          opacity: 1;
          transform: translateY(0) scale(1);
        }
      }

      .chip {
        display: inline-flex;
        align-items: center;
        gap: 8px;
        padding: 4px 10px;
        border-radius: 999px;
        background: rgba(15, 23, 42, 0.7);
        border: 1px solid rgba(255, 255, 255, 0.12);
        font-size: 11px;
        letter-spacing: 0.14em;
        text-transform: uppercase;
        color: var(--muted);
        margin-bottom: 18px;
      }

      .chip-dot {
        width: 6px;
        height: 6px;
        border-radius: 999px;
        background: var(--accent-soft);
        box-shadow: 0 0 10px rgba(199, 178, 255, 0.9);
      }

      .fragment-wrapper {
        min-height: 110px;
        display: flex;
        align-items: center;
      }

      .fragment {
        font-size: 1.22rem;
        line-height: 1.6;
        color: var(--text-main);
        letter-spacing: 0.02em;
        text-wrap: balance;
        opacity: 0;
        transform: translateY(8px);
        animation: fragment-in 650ms ease-out forwards;
      }

      @keyframes fragment-in {
        to {
          opacity: 1;
          transform: translateY(0);
        }
      }

      .fragment.fade-out {
        animation: fragment-out 250ms ease-in forwards;
      }

      @keyframes fragment-out {
        to {
          opacity: 0;
          transform: translateY(-6px);
          filter: blur(2px);
        }
      }

      .footer-row {
        margin-top: 22px;
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 12px;
      }

      .hint {
        font-size: 0.72rem;
        color: var(--muted);
        opacity: 0.9;
      }

      .hint span {
        color: var(--accent-soft);
      }

      .actions {
        display: flex;
        align-items: center;
        gap: 8px;
      }

      .btn-next {
        border: none;
        outline: none;
        border-radius: 999px;
        padding: 8px 14px;
        font-size: 0.78rem;
        letter-spacing: 0.08em;
        text-transform: uppercase;
        background: radial-gradient(
          circle at 0 0,
          rgba(245, 230, 255, 0.26),
          rgba(79, 70, 229, 0.96)
        );
        color: #f9f7ff;
        cursor: pointer;
        display: inline-flex;
        align-items: center;
        gap: 8px;
        border: 1px solid rgba(255, 255, 255, 0.16);
        box-shadow: 0 12px 30px rgba(15, 23, 42, 0.85),
          0 0 0 1px rgba(148, 163, 184, 0.4);
        transition: transform 160ms ease, box-shadow 160ms ease,
          filter 160ms ease, background 160ms ease;
      }

      .btn-next:hover {
        transform: translateY(-1px);
        box-shadow: 0 18px 38px rgba(15, 23, 42, 0.95),
          0 0 0 1px rgba(191, 219, 254, 0.55);
        filter: brightness(1.08);
      }

      .btn-next:active {
        transform: translateY(0);
        box-shadow: 0 10px 24px rgba(15, 23, 42, 0.85),
          0 0 0 1px rgba(148, 163, 184, 0.6);
        filter: brightness(0.98);
      }

      .btn-next-icon {
        font-size: 0.9rem;
        translate: 0 0;
        transition: translate 160ms ease;
      }

      .btn-next:hover .btn-next-icon {
        translate: 2px 0;
      }

      .signature {
        font-size: 0.74rem;
        color: rgba(226, 232, 240, 0.85);
        text-align: right;
        opacity: 0.9;
      }

      .signature span {
        letter-spacing: 0.06em;
        text-transform: uppercase;
        font-size: 0.68rem;
        color: rgba(148, 163, 184, 0.95);
      }

      /* Ajustes para telas pequenas */
      @media (max-width: 480px) {
        .card {
          padding: 22px 18px 18px;
          border-radius: 20px;
        }

        .fragment {
          font-size: 1.05rem;
        }

        .footer-row {
          flex-direction: column;
          align-items: flex-start;
        }

        .signature {
          align-self: flex-end;
          width: 100%;
        }
      }
    </style>
  </head>
  <body>
    <div class="shell">
      <div class="orb" aria-hidden="true"></div>

      <div class="card">
        <div class="chip">
          <span class="chip-dot"></span>
          <span>cléia, fragmentos que te encontram</span>
        </div>

        <div class="fragment-wrapper">
          <p id="fragment" class="fragment"></p>
        </div>

        <div class="footer-row">
          <p class="hint">
            Toque em <span>outro fragmento</span> quando quiser ficar mais um
            pouco.
          </p>

          <div class="actions">
            <button class="btn-next" id="nextFragment">
              outro fragmento
              <span class="btn-next-icon">⟶</span>
            </button>
          </div>
        </div>

        <p class="signature">
          <span>de alguém que guarda carinho</span><br />
          por tudo o que você acende sem perceber
        </p>
        <p class="signature"><span>with 💜 ._.. ...</span><br /></p>
      </div>
    </div>

    <script>
      // Lista inicial de fragmentos
      const fragments = [
        "Tem presenças que seguem acendendo a gente mesmo quando os dias ficam pesados.",
        "Algumas pessoas não resolvem nossa vida, mas acalmam um mundo inteiro dentro da gente.",
        "É curioso como certas pessoas continuam perto, mesmo quando a rotina tenta afastar.",
        "Tem gente que vira aquele pensamento bom que visita sem pedir licença.",
        "Às vezes não é a conversa que faz bem, é quem está do outro lado.",
        "Existem pessoas que afinam o nosso caos sem nem perceber que fizeram isso.",
        "Tem encontros que seguem acontecendo só de lembrar que aconteceram um dia.",
        "Certas presenças fazem o tempo passar devagar, do jeito que a alma precisava.",
        "Algumas pessoas não são passageiras, elas mudam o caminho inteiro para sempre.",
        "Tem gente que é casa em forma de pessoa, mesmo quando a gente está longe de tudo.",
        "Existem olhares que a gente guarda como se fossem um lugar para voltar depois.",
        "Alguns sorrisos seguem acendendo memórias mesmo quando a rotina apaga as horas.",
        "Tem pessoas que não fazem barulho, mas mudam o volume da nossa vida inteira.",
        "É estranho como uma lembrança simples pode clarear um dia inteiro cinza.",
        "Tem gente que chega como quem não promete nada e acaba ficando em tudo.",
        "Algumas pessoas não sabem, mas viraram o cantinho calmo que a mente procura.",
        "Tem presenças que ensinam a respirar de novo, só por existirem assim do jeito que são.",
      ];

      const fragmentEl = document.getElementById("fragment");
      const nextBtn = document.getElementById("nextFragment");

      let lastIndex = -1;

      function getRandomIndex() {
        if (fragments.length === 1) return 0;

        let index;
        do {
          index = Math.floor(Math.random() * fragments.length);
        } while (index === lastIndex);

        lastIndex = index;
        return index;
      }

      function showRandomFragment() {
        if (!fragmentEl) return;

        // animação de saída
        fragmentEl.classList.add("fade-out");

        setTimeout(() => {
          const index = getRandomIndex();
          fragmentEl.textContent = fragments[index];

          // reseta animação de entrada
          fragmentEl.classList.remove("fade-out");
          fragmentEl.style.animation = "none";
          // força reflow
          void fragmentEl.offsetWidth;
          fragmentEl.style.animation = "";
          fragmentEl.classList.add("fragment");
        }, 230);
      }

      // Exibe o primeiro fragmento ao carregar
      document.addEventListener("DOMContentLoaded", () => {
        const index = getRandomIndex();
        fragmentEl.textContent = fragments[index];
      });

      // Botão de próximo fragmento
      nextBtn.addEventListener("click", showRandomFragment);

      // Opcional: permitir trocar o fragmento ao tocar no próprio texto
      fragmentEl.addEventListener("click", showRandomFragment);
    </script>
  </body>
</html>
