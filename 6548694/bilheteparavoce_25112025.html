<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <title>Bilhete para você</title>
    <meta name="viewport" content="width=device-width, initial-scale=1" />

    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Homemade+Apple&family=Poppins:wght@300;400&display=swap"
    />

    <style>
      :root {
        --bg-1: #f2eee9;
        --bg-2: #f9f5ee;
        --ink: #40372e;
        --ink-soft: #7a6a58;
        --paper: #fffaf3;
        --shadow-soft: 0 10px 24px rgba(0, 0, 0, 0.22);
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        min-height: 100vh;
        display: flex;
        justify-content: center;
        align-items: center;
        font-family: "Poppins", sans-serif;
        background: radial-gradient(circle at top, var(--bg-2), var(--bg-1));
      }

      .page-wrapper {
        width: 100%;
        max-width: 420px;
        padding: 16px;
        text-align: center;
      }

      .hint {
        font-size: 0.9rem;
        color: rgba(64, 55, 46, 0.7);
        margin-bottom: 14px;
      }

      .note {
        width: 100%;
        max-width: 340px;
        max-height: 150px;
        overflow: hidden;
        transition: max-height 0.7s ease, transform 0.7s ease;
        transform: rotateX(10deg) translateY(-4px);
        border-radius: 12px;
        cursor: pointer;
      }

      .note.open {
        max-height: 1000px;
        transform: rotateX(0deg) translateY(0);
      }

      .note-paper {
        background: var(--paper);
        border-radius: 12px;
        box-shadow: var(--shadow-soft);
        padding: 20px;
        position: relative;
      }

      /* Etiqueta da frente (enquanto fechado) */
      .note-front-label {
        position: absolute;
        inset: 0;
        display: block;
        justify-content: center;
        align-items: center;
        padding: 20px;
        font-size: 1.05rem;
        color: var(--ink-soft);
        text-align: center;
        transition: opacity 0.7s ease, transform 0.7s ease;
      }

      .note.open .note-front-label {
        opacity: 0;
        transform: translateY(-40%);
        pointer-events: none;
      }

      /* ===============================
         ÁREA SUPERIOR (DE / PARA)
         Sempre acima da dobra
      ==================================*/

      .top-section {
        opacity: 0;
        transform: translateY(-8px);
        transition: opacity 0.6s ease 0.2s, transform 0.6s ease 0.2s;
      }

      .note.open .top-section {
        opacity: 1;
        transform: translateY(0);
      }

      .top-section p {
        margin: 4px 0;
        font-family: "Homemade Apple", cursive;
        font-size: 1rem;
        color: var(--ink);
      }

      /* ===============================
         LINHA DE DOBRA (sempre central)
      ==================================*/

      .fold-line {
        height: 1px;
        margin: 14px 0;
        background: linear-gradient(
          to right,
          transparent,
          rgba(0, 0, 0, 0.22),
          transparent
        );
        opacity: 0;
        transition: opacity 0.6s ease;
      }

      .note.open .fold-line {
        opacity: 0.7;
      }

      /* ===============================
         ÁREA INFERIOR (MENSAGEM)
         Sempre abaixo da dobra
      ==================================*/

      .bottom-section {
        opacity: 0;
        transform: translateY(14px);
        transition: opacity 0.7s ease 0.2s, transform 0.7s ease 0.2s;
      }

      .note.open .bottom-section {
        opacity: 1;
        transform: translateY(0);
      }

      .bottom-section p {
        margin: 0;
        font-family: "Homemade Apple", cursive;
        font-size: 1.16rem;
        color: var(--ink);
        line-height: 1.5;
        white-space: pre-line;
      }

      /* Brilho sutil */
      .note-glow {
        position: absolute;
        inset: 0;
        border-radius: 12px;
        background: radial-gradient(
          circle at top left,
          rgba(255, 255, 255, 0.7),
          transparent 60%
        );
        mix-blend-mode: screen;
        opacity: 0;
        pointer-events: none;
        transition: opacity 0.7s ease;
      }

      .note.open .note-glow {
        opacity: 1;
      }
    </style>
  </head>

  <body>
    <div class="page-wrapper">
      <div class="hint">
        Tem um bilhete dobrado bem aqui. Toque com calma para abrir.
      </div>

      <div class="note" id="note">
        <div class="note-paper">
          <div class="note-front-label">
            <p>
              Sim, eu fiz um bilhete. </br>
              Sim, é para você. </br>
              Sim, eu sei… exagero.</br>
              Mas deixa eu.
            </p>
          </div>

          <div class="top-section">
            <p>De: ._.. ...</p>
            <p>Para: Cléia</p>
          </div>

          <div class="fold-line"></div>

          <div class="bottom-section">
            <p>
              Não sei explicar, mas tem algo em você que acalma até as partes que eu nem sabia que estavam cansadas.
            </p>
          </div>

          <div class="note-glow"></div>
        </div>
      </div>
    </div>

    <script>
      document.addEventListener("DOMContentLoaded", () => {
        const note = document.getElementById("note");
        note.addEventListener("click", () => note.classList.toggle("open"));
      });
    </script>
    <script src="./js/card-telemetry.js"></script>
  </body>
</html>
