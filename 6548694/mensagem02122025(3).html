<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <title>Entrelinhas</title>

    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500;600&display=swap"
    />

    <style>
      :root {
        --bg1: #050816;
        --bg2: #0b1020;
        --bg3: #15192a;
        --card: rgba(15, 23, 42, 0.96);
        --border-soft: rgba(148, 163, 184, 0.4);
        --text-main: #e5e7eb;
        --text-soft: #9ca3af;
        --accent: #8b5cf6;
        --accent-soft: rgba(139, 92, 246, 0.25);
        --btn-bg: rgba(15, 23, 42, 0.95);
        --btn-border: rgba(148, 163, 184, 0.6);
      }

      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      html,
      body {
        height: 100%;
      }

      body {
        min-height: 100vh;
        font-family: "DM Sans", system-ui, -apple-system, BlinkMacSystemFont,
          "Segoe UI", sans-serif;
        color: var(--text-main);
        background: radial-gradient(circle at 0% 0%, #111827, transparent 55%),
          radial-gradient(circle at 100% 0%, #020617, transparent 55%),
          radial-gradient(circle at 50% 100%, #020617, transparent 60%),
          linear-gradient(135deg, var(--bg1), var(--bg2), var(--bg3));
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 18px;
        position: relative;
        overflow: hidden;
      }

      /* textura suave */
      body::before {
        content: "";
        position: fixed;
        inset: 0;
        pointer-events: none;
        opacity: 0.18;
        mix-blend-mode: soft-light;
        background-image: url("https://www.transparenttextures.com/patterns/noisy.png");
        z-index: 0;
      }

      /* brilho discreto ao fundo */
      body::after {
        content: "";
        position: fixed;
        inset: -40%;
        background: radial-gradient(
            circle at 10% 20%,
            rgba(139, 92, 246, 0.23),
            transparent 60%
          ),
          radial-gradient(
            circle at 80% 80%,
            rgba(56, 189, 248, 0.13),
            transparent 60%
          );
        mix-blend-mode: screen;
        opacity: 0.7;
        pointer-events: none;
        z-index: 0;
      }

      .shell {
        position: relative;
        z-index: 1;
        width: 100%;
        max-width: 560px;
        padding: env(safe-area-inset-top, 0) 0 env(safe-area-inset-bottom, 0);
      }

      .card {
        background: var(--card);
        border-radius: 24px;
        padding: 26px 22px 20px;
        border: 1px solid var(--border-soft);
        box-shadow: 0 22px 55px rgba(0, 0, 0, 0.6),
          0 0 0 1px rgba(15, 23, 42, 0.9);
        animation: cardIn 650ms ease-out;
      }

      @keyframes cardIn {
        0% {
          opacity: 0;
          transform: translateY(18px) scale(0.98);
          filter: blur(3px);
        }
        100% {
          opacity: 1;
          transform: translateY(0) scale(1);
          filter: blur(0);
        }
      }

      .chip {
        display: inline-flex;
        align-items: center;
        gap: 6px;
        padding: 4px 12px;
        border-radius: 999px;
        font-size: 11px;
        letter-spacing: 0.16em;
        text-transform: uppercase;
        color: var(--text-soft);
        border: 1px solid rgba(148, 163, 184, 0.55);
        background: rgba(15, 23, 42, 0.95);
        margin-bottom: 14px;
      }

      .chip-dot {
        width: 7px;
        height: 7px;
        border-radius: 999px;
        background: var(--accent);
        box-shadow: 0 0 0 4px var(--accent-soft);
      }

      .icon {
        font-size: 1.9rem;
        margin-bottom: 6px;
        opacity: 0.9;
      }

      h1 {
        font-size: 1.34rem;
        margin-bottom: 10px;
        letter-spacing: 0.01em;
      }

      .step-indicator {
        font-size: 0.8rem;
        color: var(--text-soft);
        margin-bottom: 14px;
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 8px;
      }

      .step-dots {
        display: flex;
        gap: 6px;
        align-items: center;
      }

      .step-dot {
        width: 7px;
        height: 7px;
        border-radius: 999px;
        background: rgba(148, 163, 184, 0.5);
        opacity: 0.6;
        transition: opacity 0.2s ease, transform 0.2s ease, background 0.2s ease;
      }

      .step-dot.active {
        background: var(--accent);
        opacity: 1;
        transform: scale(1.15);
      }

      .text-block {
        font-size: 0.98rem;
        line-height: 1.8;
        color: var(--text-main);
        text-wrap: balance;
        margin-bottom: 8px;
      }

      .text-soft {
        font-size: 0.9rem;
        color: var(--text-soft);
        line-height: 1.7;
        text-wrap: balance;
      }

      .text-block + .text-block {
        margin-top: 10px;
      }

      .divider {
        margin: 20px 0 10px;
        height: 1px;
        border-radius: 999px;
        background: linear-gradient(
          90deg,
          transparent,
          rgba(148, 163, 184, 0.85),
          transparent
        );
      }

      .signature-label {
        font-size: 0.8rem;
        color: var(--text-soft);
        margin-bottom: 4px;
      }

      .signature {
        margin-top: 4px;
        text-align: right;
        font-size: 0.86rem;
        color: var(--text-soft);
        min-height: 24px;
      }

      .nav {
        margin-top: 16px;
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 10px;
      }

      .nav-btn {
        flex: 1;
        border-radius: 999px;
        border: 1px solid var(--btn-border);
        padding: 8px 14px;
        font-size: 0.86rem;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        gap: 6px;
        background: var(--btn-bg);
        color: var(--text-main);
        cursor: pointer;
        transition: background 0.2s ease, border-color 0.2s ease,
          transform 0.1s ease, box-shadow 0.1s ease;
      }

      .nav-btn span {
        font-size: 0.9rem;
      }

      .nav-btn-primary {
        border-color: var(--accent);
        box-shadow: 0 0 0 1px rgba(139, 92, 246, 0.4);
      }

      .nav-btn:hover:not(:disabled) {
        background: rgba(15, 23, 42, 0.98);
        transform: translateY(-1px);
        box-shadow: 0 10px 25px rgba(0, 0, 0, 0.45);
      }

      .nav-btn:active:not(:disabled) {
        transform: translateY(0);
        box-shadow: none;
      }

      .nav-btn:disabled {
        opacity: 0.35;
        cursor: default;
        box-shadow: none;
      }

      .nav-btn-icon-left {
        font-size: 1rem;
        transform: translateX(-2px);
      }

      .nav-btn-icon-right {
        font-size: 1rem;
        transform: translateX(2px);
      }

      @media (max-width: 480px) {
        .card {
          padding: 22px 16px 18px;
          border-radius: 20px;
        }

        h1 {
          font-size: 1.24rem;
        }

        .text-block {
          font-size: 0.95rem;
        }

        .text-soft {
          font-size: 0.86rem;
        }

        .nav-btn {
          font-size: 0.84rem;
          padding: 8px 10px;
        }
      }
    </style>
  </head>

  <body>
    <div class="shell">
      <article class="card">
        <div class="chip">
          <span class="chip-dot"></span>
          entrelinhas
        </div>

        <div class="icon">✉️</div>

        <h1>Sendo sincero</h1>

        <div class="step-indicator">
          <span id="step-text">trecho 1 de 4</span>
          <div class="step-dots">
            <span class="step-dot active" data-step="0"></span>
            <span class="step-dot" data-step="1"></span>
            <span class="step-dot" data-step="2"></span>
            <span class="step-dot" data-step="3"></span>
            <span class="step-dot" data-step="4"></span>
            <span class="step-dot" data-step="5"></span>
            <span class="step-dot" data-step="6"></span>
            <span class="step-dot" data-step="7"></span>
            <span class="step-dot" data-step="8"></span>
            <span class="step-dot" data-step="9"></span>
            <span class="step-dot" data-step="10"></span>
            <span class="step-dot" data-step="11"></span>
            <span class="step-dot" data-step="12"></span>
            <span class="step-dot" data-step="13"></span>
            <span class="step-dot" data-step="14"></span>
            <!-- <span class="step-dot" data-step="15"></span> -->
          </div>
        </div>

        <!-- Conteúdo dinâmico dos cards -->
        <div id="card-content"></div>

        <div class="divider"></div>

        <!-- <p class="signature-label">assinatura:</p> -->
        <p class="signature">._.. ...</p>

        <div class="nav">
          <button class="nav-btn" id="btn-prev">
            <span class="nav-btn-icon-left">←</span>
            <span>Voltar</span>
          </button>

          <button class="nav-btn nav-btn-primary" id="btn-next">
            <span>Próximo</span>
            <span class="nav-btn-icon-right">→</span>
          </button>
        </div>
      </article>
    </div>

    <script>
      // Passos da mensagem divididos em "cards"
      const steps = [
        {
          blocks: [
            "Cléia,",
            "Eu sei das suas circunstâncias e respeito o seu espaço. Não fiz estas páginas para te exigir nada, só para te deixar saber onde você mora aqui dentro.",
          ],
        },
        {
          blocks: [
            "Às vezes me pego tentando esconder o que sinto, mas você deve perceber: meu jeito perto de você sempre entrega um pouco.",
          ],
        },
        {
          blocks: [
            "Gosto da tua presença, do teu brilho. Não é algo que acontece com qualquer pessoa, e eu não sei explicar melhor do que isso.",
          ],
        },
        {
          blocks: [
            "Não te digo essas coisas pessoalmente para não te deixar desconfortável. Mas eu sentir, eu sinto, e não finjo o contrário.",
            "Não é um pedido, nem uma expectativa. É só a verdade do que existe aqui dentro, dita com cuidado.",
          ],
          soft: "Sei que a vida aí do lado é cheia de camadas. Aqui deste lado, o que eu faço é só admitir, com calma, o quanto você é presença especial em mim.",
        },
        {
          blocks: [
            "Se você ainda tinha dúvidas sobre isso? Espero que agora não tenha.",
          ],
        },
        {
          blocks: [
            "Eu, ao contrário, não sei exatamente o que se passa aí com você. Se um dia estiver pronta pra conversarmos sobre isso e se for de seu interesse, estarei aqui.",
          ],
        },
        {
          blocks: [
            "Saiba, não estou criando expectativas. Sou realista, entendo todo o seu contexto e respeito. Mas isso não me impede de continar sentindo o que sinto por você.",
          ],
        },
        {
          blocks: [
            "O ideal seria podermos ser diretos um com o outro, mas você entende que não posso? Ou eu poderia?",
          ],
        },
        {
          blocks: [
            "A letra daquela música (Mala) que você me mandou hoje, entendi como um recado pra mim, já que você nunca disse nada diretamente.",
          ],
        },
        {
          blocks: [
            "Espero não ter sido MV, mas não me arrependo de dizer o que sinto.",
          ],
        },
        {
          blocks: [
            "Em outras circunstâncias eu já teria tomado uma iniciativa, exatamente há 5 meses quando passamos a ter contato mais próximo.",
          ],
        },
        {
          blocks: ["Mas, existe uma barreira, você é comprometida."],
        },
        {
          blocks: [
            "O que você pensa sobre isso? Não sei. Você nunca deixou nada claro pra mim. Sempre respondendo algumas indiretas minhas com figurinhas engraçadas ou desviando a conversa. Posso até entender o motivo, mas só eu estou falando até agora.",
          ],
        },
        {
          blocks: [
            "Então, aqui, te coloquei dentro da minha cabeça para que você me entenda.",
          ],
        },
        {
          blocks: ["Ainda estou aqui."],
        },
      ];

      const contentEl = document.getElementById("card-content");
      const stepTextEl = document.getElementById("step-text");
      const dots = Array.from(document.querySelectorAll(".step-dot"));
      const btnPrev = document.getElementById("btn-prev");
      const btnNext = document.getElementById("btn-next");

      let currentStep = 0;

      function renderStep(index) {
        const step = steps[index];
        contentEl.innerHTML = "";

        step.blocks.forEach((text) => {
          const p = document.createElement("p");
          p.className = "text-block";
          p.textContent = text;
          contentEl.appendChild(p);
        });

        if (step.soft) {
          const pSoft = document.createElement("p");
          pSoft.className = "text-soft";
          pSoft.textContent = step.soft;
          contentEl.appendChild(pSoft);
        }

        stepTextEl.textContent = `trecho ${index + 1} de ${steps.length}`;

        dots.forEach((dot, i) => {
          dot.classList.toggle("active", i === index);
        });

        btnPrev.disabled = index === 0;

        if (index === steps.length - 1) {
          btnNext.querySelector("span:first-child").textContent =
            "Voltar ao início";
          btnNext.querySelector(".nav-btn-icon-right").textContent = "↺";
        } else {
          btnNext.querySelector("span:first-child").textContent = "Próximo";
          btnNext.querySelector(".nav-btn-icon-right").textContent = "→";
        }
      }

      btnPrev.addEventListener("click", () => {
        if (currentStep > 0) {
          currentStep -= 1;
          renderStep(currentStep);
        }
      });

      btnNext.addEventListener("click", () => {
        if (currentStep < steps.length - 1) {
          currentStep += 1;
        } else {
          // se já estiver no último, volta para o primeiro
          currentStep = 0;
        }
        renderStep(currentStep);
      });

      // Permite clicar nos pontinhos para navegar
      dots.forEach((dot, i) => {
        dot.addEventListener("click", () => {
          currentStep = i;
          renderStep(currentStep);
        });
      });

      // renderiza o primeiro card ao carregar
      renderStep(currentStep);
    </script>
  </body>
</html>
