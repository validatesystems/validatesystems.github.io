<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <title>Para a Cléia</title>

    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500;600;700&family=Playfair+Display:wght@500;600&display=swap"
      rel="stylesheet"
    />

    <style>
      :root {
        --bgA: #050816;
        --bgB: #0b1020;
        --card: rgba(15, 23, 42, 0.92);
        --border: rgba(148, 163, 184, 0.35);
        --text: #e5e7eb;
        --muted: rgba(229, 231, 235, 0.72);

        /* Vai mudar via JS conforme o turno */
        --accent: #f97316;
        --accentSoft: rgba(249, 115, 22, 0.18);
        --glow: rgba(249, 115, 22, 0.45);
      }

      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      html,
      body {
        height: 100%;
      }

      body {
        font-family: "DM Sans", system-ui, -apple-system, Segoe UI, Roboto,
          "Helvetica Neue", Arial, "Noto Sans", "Liberation Sans", sans-serif;
        color: var(--text);
        background: radial-gradient(
            circle at 10% 5%,
            rgba(99, 102, 241, 0.16),
            transparent 55%
          ),
          radial-gradient(
            circle at 85% 95%,
            rgba(16, 185, 129, 0.14),
            transparent 55%
          ),
          linear-gradient(135deg, var(--bgA), var(--bgB));
        overflow-x: hidden;
        padding: calc(14px + env(safe-area-inset-top)) 14px
          calc(14px + env(safe-area-inset-bottom));
        display: grid;
        place-items: center;
      }

      /* Granulação suave */
      body::before {
        content: "";
        position: fixed;
        inset: 0;
        pointer-events: none;
        background-image: url("https://www.transparenttextures.com/patterns/noisy.png");
        opacity: 0.18;
        mix-blend-mode: soft-light;
        z-index: 0;
      }

      /* Brilho de turno */
      .glow {
        position: fixed;
        inset: -120px;
        z-index: 0;
        pointer-events: none;
        background: radial-gradient(
            circle at 20% 15%,
            var(--accentSoft),
            transparent 45%
          ),
          radial-gradient(
            circle at 80% 85%,
            rgba(139, 92, 246, 0.12),
            transparent 55%
          ),
          radial-gradient(
            circle at 70% 25%,
            rgba(56, 189, 248, 0.1),
            transparent 55%
          );
        filter: blur(12px);
        opacity: 1;
      }

      .wrap {
        width: 100%;
        max-width: 640px;
        z-index: 2;
      }

      .card {
        background: var(--card);
        border: 1px solid var(--border);
        border-radius: 26px;
        box-shadow: 0 22px 55px rgba(0, 0, 0, 0.45),
          0 0 0 1px rgba(15, 23, 42, 0.55);
        backdrop-filter: blur(18px);
        -webkit-backdrop-filter: blur(18px);
        overflow: hidden;
        transform: translateY(14px);
        opacity: 0;
        animation: enter 0.7s ease-out forwards;
      }

      @keyframes enter {
        to {
          transform: translateY(0);
          opacity: 1;
        }
      }

      .topbar {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 12px;
        padding: 18px 18px 12px;
        border-bottom: 1px solid rgba(148, 163, 184, 0.18);
      }

      .badge {
        display: inline-flex;
        align-items: center;
        gap: 10px;
        padding: 6px 12px;
        border-radius: 999px;
        border: 1px solid rgba(148, 163, 184, 0.28);
        color: var(--muted);
        font-size: 12px;
        letter-spacing: 0.12em;
        text-transform: uppercase;
        user-select: none;
      }

      .dot {
        width: 8px;
        height: 8px;
        border-radius: 999px;
        background: var(--accent);
        box-shadow: 0 0 18px var(--glow);
        flex: 0 0 auto;
      }

      .clock {
        font-size: 12px;
        color: var(--muted);
        letter-spacing: 0.06em;
        user-select: none;
      }

      .content {
        padding: 18px;
      }

      h1 {
        font-family: "Playfair Display", serif;
        font-weight: 600;
        font-size: 1.35rem;
        line-height: 1.15;
        margin-bottom: 10px;
      }

      .subtitle {
        color: var(--muted);
        font-size: 0.95rem;
        line-height: 1.6;
        margin-bottom: 16px;
        text-wrap: balance;
      }

      .stage {
        border-radius: 20px;
        border: 1px solid rgba(148, 163, 184, 0.22);
        background: radial-gradient(
            circle at 25% 10%,
            rgba(255, 255, 255, 0.06),
            transparent 55%
          ),
          linear-gradient(180deg, rgba(2, 6, 23, 0.55), rgba(2, 6, 23, 0.15));
        padding: 16px 14px;
        min-height: 180px;
        position: relative;
        overflow: hidden;
      }

      .stage::before {
        content: "";
        position: absolute;
        inset: -40px;
        background: radial-gradient(
          circle at 30% 20%,
          rgba(255, 255, 255, 0.06),
          transparent 55%
        );
        filter: blur(12px);
        opacity: 0.8;
        pointer-events: none;
      }

      .text {
        position: relative;
        z-index: 2;
        font-size: 1.02rem;
        line-height: 1.75;
        color: rgba(229, 231, 235, 0.96);
        opacity: 0;
        transform: translateY(10px);
        animation: textIn 0.5s ease-out forwards;
      }

      @keyframes textIn {
        to {
          opacity: 1;
          transform: translateY(0);
        }
      }

      .progress {
        display: flex;
        gap: 8px;
        align-items: center;
        justify-content: center;
        padding: 14px 0 2px;
        user-select: none;
      }

      .pip {
        width: 7px;
        height: 7px;
        border-radius: 999px;
        border: 1px solid rgba(148, 163, 184, 0.35);
        opacity: 0.7;
        transition: transform 0.2s ease, opacity 0.2s ease, background 0.2s ease,
          box-shadow 0.2s ease;
      }

      .pip.on {
        background: var(--accent);
        border-color: rgba(255, 255, 255, 0.18);
        box-shadow: 0 0 16px var(--glow);
        opacity: 1;
        transform: scale(1.15);
      }

      .controls {
        display: flex;
        gap: 10px;
        flex-wrap: wrap;
        justify-content: space-between;
        padding: 14px 0 0;
      }

      .btnRow {
        display: flex;
        gap: 10px;
        flex-wrap: wrap;
      }

      .btn {
        border: 1px solid rgba(248, 250, 252, 0.18);
        background: rgba(248, 250, 252, 0.06);
        color: #f9fafb;
        border-radius: 999px;
        padding: 10px 14px;
        font-size: 0.84rem;
        letter-spacing: 0.08em;
        text-transform: uppercase;
        cursor: pointer;
        transition: transform 0.18s ease, background 0.18s ease,
          box-shadow 0.18s ease, border-color 0.18s ease;
        display: inline-flex;
        align-items: center;
        gap: 8px;
        user-select: none;
      }

      .btn:hover {
        background: rgba(248, 250, 252, 0.12);
        box-shadow: 0 14px 30px rgba(0, 0, 0, 0.25);
        transform: translateY(-1px);
        border-color: rgba(248, 250, 252, 0.26);
      }

      .btn:active {
        transform: translateY(0);
        box-shadow: 0 10px 24px rgba(0, 0, 0, 0.28);
      }

      .btn.primary {
        background: linear-gradient(
          135deg,
          rgba(249, 115, 22, 0.18),
          rgba(249, 115, 22, 0.06)
        );
        border-color: rgba(249, 115, 22, 0.34);
      }

      .btn.primary .mini {
        width: 7px;
        height: 7px;
        border-radius: 999px;
        background: var(--accent);
        box-shadow: 0 0 16px var(--glow);
      }

      .hint {
        color: var(--muted);
        font-size: 0.82rem;
        line-height: 1.45;
        padding-top: 10px;
        opacity: 0.9;
      }

      .footer {
        padding: 14px 18px 18px;
        border-top: 1px solid rgba(148, 163, 184, 0.18);
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 12px;
        flex-wrap: wrap;
      }

      .sig {
        font-size: 0.78rem;
        color: rgba(229, 231, 235, 0.62);
        letter-spacing: 0.02em;
      }

      .mode {
        font-size: 0.78rem;
        color: rgba(229, 231, 235, 0.62);
        display: inline-flex;
        align-items: center;
        gap: 8px;
        user-select: none;
      }

      .mode b {
        color: rgba(229, 231, 235, 0.9);
        font-weight: 600;
      }

      @media (max-width: 480px) {
        .topbar {
          padding: 16px 14px 10px;
        }
        .content {
          padding: 16px 14px;
        }
        .footer {
          padding: 12px 14px 14px;
        }
        h1 {
          font-size: 1.22rem;
        }
        .stage {
          min-height: 195px;
        }
        .controls {
          justify-content: flex-start;
        }
      }
    </style>
  </head>

  <body>
    <div class="glow" aria-hidden="true"></div>

    <main class="wrap" role="main">
      <section class="card" aria-live="polite">
        <header class="topbar">
          <div class="badge">
            <span class="dot" aria-hidden="true"></span>
            <span id="badgeText">Mensagem do momento</span>
          </div>
          <div class="clock" id="clock">--:--</div>
        </header>

        <div class="content">
          <h1 id="title">Cléia</h1>
          <p class="subtitle" id="subtitle">
            Volte em cada turno (manhã, tarde e noite) para ver a mensagem
            daquele momento.
          </p>

          <div class="stage" id="stage" title="Toque para avançar">
            <p class="text" id="text"></p>

            <div class="progress" id="progress" aria-label="Progresso"></div>

            <div class="controls">
              <div class="btnRow">
                <button class="btn" id="prevBtn" type="button">Voltar</button>
                <button class="btn primary" id="nextBtn" type="button">
                  <span class="mini" aria-hidden="true"></span>
                  Avançar
                </button>
              </div>

              <div class="btnRow">
                <button class="btn" id="restartBtn" type="button">
                  Recomeçar
                </button>
              </div>
            </div>

            <div class="hint" id="hint">
              Dica: você pode tocar na área do texto para avançar.
            </div>
          </div>
        </div>

        <footer class="footer">
          <div class="mode" id="modeLine">Turno: <b id="modeName">...</b></div>
          <div class="sig">._.. ...</div>
        </footer>
      </section>
    </main>

    <script>
      (function () {
        "use strict";

        const $ = (s) => document.querySelector(s);

        const el = {
          badgeText: $("#badgeText"),
          clock: $("#clock"),
          title: $("#title"),
          subtitle: $("#subtitle"),
          text: $("#text"),
          progress: $("#progress"),
          modeName: $("#modeName"),
          stage: $("#stage"),
          prevBtn: $("#prevBtn"),
          nextBtn: $("#nextBtn"),
          restartBtn: $("#restartBtn"),
        };

        function pad(n) {
          return String(n).padStart(2, "0");
        }

        function updateClock() {
          const now = new Date();
          el.clock.textContent = `${pad(now.getHours())}:${pad(
            now.getMinutes()
          )}`;
        }

        function setTheme(accent) {
          document.documentElement.style.setProperty("--accent", accent);
          const glow =
            accent === "#60a5fa"
              ? "rgba(96, 165, 250, 0.45)"
              : accent === "#f59e0b"
              ? "rgba(245, 158, 11, 0.45)"
              : "rgba(167, 139, 250, 0.45)";
          document.documentElement.style.setProperty("--glow", glow);

          const soft =
            accent === "#60a5fa"
              ? "rgba(96, 165, 250, 0.18)"
              : accent === "#f59e0b"
              ? "rgba(245, 158, 11, 0.18)"
              : "rgba(167, 139, 250, 0.18)";
          document.documentElement.style.setProperty("--accentSoft", soft);
        }

        function getTurno(h) {
          // manhã: 05-11, tarde: 12-17, noite: 18-04
          if (h >= 5 && h <= 11) return "manha";
          if (h >= 12 && h <= 17) return "tarde";
          return "noite";
        }

        const TURN_NOTICE =
          "Volte em cada turno (manhã, tarde e noite) para ver a mensagem daquele momento.";

        const copy = {
          manha: {
            modeLabel: "manhã",
            badge: "Bom dia",
            accent: "#60a5fa",
            title: "Cléia, bom dia",
            subtitle:
              "Se você abriu isso agora, eu só queria falar umas verdades.",
            steps: [
              "Que esta manhã você se lembre que o dia está só começando.",
              "Se começar agitado, guarda um pouco de energia para mais tarde, vai piorar.\nRespira.\nE segue, não tem outro jeito.",
              "Não é um pedido.\nÉ a realidade.\nUm lembrete simples: você não precisa carregar tudo sozinha, você deve.",
              "Que hoje, no fim do dia, você lembre que é responsável pelo seu sucesso e fracasso.\nNão adianta responsabilizar os outros.",
            ],
          },

          tarde: {
            modeLabel: "tarde",
            badge: "Boa tarde",
            accent: "#f59e0b",
            title: "Cléia, boa tarde",
            subtitle:
              "A tarde costuma ser mais tranquila. Então eu vou lembrá-la da real.",
            steps: [
              "Se a manhã foi puxada, dá uma pausa pequena e depois volta ao trabalho, ninguém vai pagar suas contas.",
              "Nem tudo precisa ser resolvido agora.\nMas, se precisa ser resolvido, por quê não agora?.",
              "Eu não vim te dar sermão.\nNinguém dá nada de graça.\nSó estou te lembrando que a realidade não muda só por que você quer, e sim quando você age.",
              "Espero que a tarde termine e que você esteja inteira.\nE com aquela sensação boa de: hoje eu fiz muito, mas deveria ter feito mais.",
              "Amanhã, espero que você compense o que deixou de fazer hoje.\nAliás, não espere o amanhã, faça agora.",
            ],
          },

          noite: {
            modeLabel: "noite",
            badge: "Boa noite",
            accent: "#a78bfa",
            title: "Cléia, boa noite",
            subtitle: "Se o dia acabou, espero que você esteja acabada também.",
            steps: [
              "Se hoje foi puxado, espera pra ver amanhã! Se você acha que foi forte, prepare-se para novos desafios.",
              "Você não precisa ter todas as respostas.\nMas as respostas precisam ser dadas.",
              "A boca que diz 'sim' também tem que saber dizer 'não'.\nReage menina.\nO mundo não vai te esperar, então não carrega ele nas tuas costas.",
              "Se você quer paz, é obrigatório passar por guerras.\nTrave suas batalhas, uma por vez.\nNão espere que as coisas se resolvam sozinhas.",
            ],
          },
        };

        let steps = [];
        let idx = 0;
        let currentKey = "manha";

        function buildPips() {
          el.progress.innerHTML = "";
          for (let i = 0; i < steps.length; i++) {
            const d = document.createElement("div");
            d.className = "pip" + (i === idx ? " on" : "");
            d.title = `Parte ${i + 1} de ${steps.length}`;
            d.addEventListener("click", () => {
              idx = i;
              render();
            });
            el.progress.appendChild(d);
          }
        }

        function renderText(t) {
          el.text.textContent = t;
          el.text.style.animation = "none";
          void el.text.offsetHeight;
          el.text.style.animation = "";
        }

        function render() {
          const pack = copy[currentKey];

          el.badgeText.textContent = pack.badge;
          el.title.textContent = pack.title;
          el.subtitle.textContent = `${pack.subtitle} ${TURN_NOTICE}`;
          el.modeName.textContent = pack.modeLabel;

          renderText(steps[idx]);
          buildPips();

          el.prevBtn.disabled = idx === 0;
          el.nextBtn.disabled = idx === steps.length - 1;

          el.prevBtn.style.opacity = idx === 0 ? "0.55" : "1";
          el.nextBtn.style.opacity = idx === steps.length - 1 ? "0.55" : "1";
        }

        function next() {
          if (idx < steps.length - 1) {
            idx++;
            render();
          }
        }

        function prev() {
          if (idx > 0) {
            idx--;
            render();
          }
        }

        function restart() {
          idx = 0;
          render();
        }

        function init() {
          const now = new Date();
          const h = now.getHours();
          currentKey = getTurno(h);

          const pack = copy[currentKey];
          setTheme(pack.accent);

          steps = pack.steps.slice();
          idx = 0;

          updateClock();
          setInterval(updateClock, 1000 * 20);

          render();

          el.nextBtn.addEventListener("click", next);
          el.prevBtn.addEventListener("click", prev);
          el.restartBtn.addEventListener("click", restart);

          el.stage.addEventListener("click", (ev) => {
            const tag =
              ev.target && ev.target.tagName
                ? ev.target.tagName.toLowerCase()
                : "";
            if (tag === "button") return;
            next();
          });

          window.addEventListener("keydown", (e) => {
            if (e.key === "ArrowRight") next();
            if (e.key === "ArrowLeft") prev();
            if (e.key === "Home") restart();
          });
        }

        init();
      })();
    </script>
  </body>
</html>
