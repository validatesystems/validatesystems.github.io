<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <title>Boa noite</title>

    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500;600&display=swap"
    />

    <style>
      :root {
        --bg1: #05070f;
        --bg2: #0a0d17;
        --bg3: #111625;
        --card: rgba(17, 23, 41, 0.85);
        --border-soft: rgba(148, 163, 184, 0.4);
        --text-main: #e5e7eb;
        --text-soft: #9ca3af;
        --accent: #6366f1;
        --accent-soft: rgba(99, 102, 241, 0.25);
      }

      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      body {
        height: 100vh;
        font-family: "DM Sans", sans-serif;
        color: var(--text-main);
        background: radial-gradient(
            circle at 20% 0%,
            rgba(99, 102, 241, 0.25),
            transparent 60%
          ),
          radial-gradient(
            circle at 80% 20%,
            rgba(56, 189, 248, 0.15),
            transparent 60%
          ),
          linear-gradient(135deg, var(--bg1), var(--bg2), var(--bg3));
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 20px;
        overflow: hidden;
        position: relative;
      }

      /* textura suave */
      body::before {
        content: "";
        position: fixed;
        inset: 0;
        pointer-events: none;
        background-image: url("https://www.transparenttextures.com/patterns/noisy.png");
        opacity: 0.17;
        z-index: 0;
      }

      .shell {
        position: relative;
        z-index: 2;
        max-width: 520px;
        width: 100%;
      }

      .card {
        background: var(--card);
        border-radius: 24px;
        padding: 26px 24px 20px;
        border: 1px solid var(--border-soft);
        box-shadow: 0 22px 50px rgba(0, 0, 0, 0.5),
          0 0 0 1px rgba(15, 23, 42, 0.9);
        animation: fadeCard 700ms ease-out;
      }

      @keyframes fadeCard {
        0% {
          opacity: 0;
          transform: translateY(18px) scale(0.96);
          filter: blur(4px);
        }
        100% {
          opacity: 1;
          transform: translateY(0) scale(1);
          filter: blur(0);
        }
      }

      .chip {
        display: inline-flex;
        align-items: center;
        gap: 6px;
        padding: 4px 14px;
        border-radius: 999px;
        font-size: 11px;
        letter-spacing: 0.16em;
        text-transform: uppercase;
        color: var(--text-soft);
        background: rgba(17, 23, 41, 0.9);
        border: 1px solid rgba(148, 163, 184, 0.45);
        margin-bottom: 18px;
      }

      .chip-dot {
        width: 7px;
        height: 7px;
        border-radius: 999px;
        background: var(--accent);
        box-shadow: 0 0 0 4px var(--accent-soft);
      }

      .icon {
        font-size: 2rem;
        opacity: 0.85;
        margin-bottom: 12px;
      }

      h1 {
        font-size: 1.42rem;
        margin-bottom: 10px;
        font-weight: 500;
      }

      .text-main {
        font-size: 1rem;
        line-height: 1.7;
        color: var(--text-main);
        margin-bottom: 12px;
        text-wrap: balance;
      }

      .text-soft {
        font-size: 0.88rem;
        color: var(--text-soft);
        line-height: 1.65;
        text-wrap: balance;
      }

      .divider {
        margin: 20px 0 14px;
        height: 1px;
        background: linear-gradient(
          90deg,
          transparent,
          rgba(148, 163, 184, 0.8),
          transparent
        );
        border-radius: 999px;
      }

      .footnote {
        font-size: 0.78rem;
        display: flex;
        justify-content: space-between;
        align-items: center;
        color: var(--text-soft);
      }

      .tag {
        padding: 4px 10px;
        border-radius: 999px;
        border: 1px solid rgba(148, 163, 184, 0.55);
        font-size: 0.68rem;
        text-transform: uppercase;
        letter-spacing: 0.12em;
        background: rgba(17, 23, 41, 0.8);
      }

      .signature {
        margin-top: 18px;
        text-align: right;
        font-size: 0.8rem;
        color: var(--text-soft);
      }

      @media (max-width: 480px) {
        .card {
          padding: 22px 18px 18px;
          border-radius: 20px;
        }

        h1 {
          font-size: 1.28rem;
        }

        .text-main {
          font-size: 0.96rem;
        }

        .text-soft {
          font-size: 0.86rem;
        }

        .footnote {
          flex-direction: column;
          align-items: flex-start;
          gap: 4px;
        }
      }
    </style>
  </head>

  <body>
    <div class="shell">
      <article class="card">
        <div class="chip">
          <span class="chip-dot"></span>
          boa noite
        </div>

        <div class="icon">⋯</div>

        <h1>Cléia, Boa noite.</h1>

        <p class="text-main">
          Não vou escrever muito agora, só quero te falar bem rapidinho.
        </p>

        <p class="text-soft">Que sua noite te faça bem.</p>

        <div class="divider"></div>

        <div class="footnote">
          <span>É só isso que eu queria te desejar.</span>
          <!-- <span class="tag">último boa noite</span> -->
        </div>

        <p class="signature">._.. ...</p>
      </article>
    </div>
    <script src="./js/card-telemetry.js"></script>
  </body>
</html>
