<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Poema para você</title>

    <!-- Fonte escrita à mão -->
    <link
      href="https://fonts.googleapis.com/css2?family=Homemade+Apple&display=swap"
      rel="stylesheet"
    />

    <style>
      :root {
        --paper-bg: #faf7f1;
        --ink: #2a2a2a;
      }

      body {
        margin: 0;
        padding: 0;
        background: #e5dfd4;
        font-family: sans-serif;
        display: flex;
        align-items: center;
        justify-content: center;
        min-height: 100vh;
      }

      .paper {
        background: var(--paper-bg);
        width: 90%;
        max-width: 600px;
        padding: 40px 30px;
        box-shadow: 0 10px 25px rgba(0, 0, 0, 0.15);
        border-radius: 6px;
        position: relative;
        animation: appear 0.9s ease;
        background-image: radial-gradient(
            rgba(0, 0, 0, 0.04) 1px,
            transparent 0
          ),
          linear-gradient(transparent 97%, rgba(0, 0, 0, 0.08) 100%);
        background-size: 3px 3px, 100% 25px;
      }

      .paper::before {
        content: "";
        position: absolute;
        top: 0;
        left: 0;
        width: 18px;
        height: 100%;
        background: linear-gradient(to right, #f0ebe2, #ffffff00);
        border-right: 1px solid #e0d8c8;
      }

      .paper::after {
        content: "";
        position: absolute;
        top: 0;
        right: 0;
        width: 70px;
        height: 70px;
        background: linear-gradient(
          135deg,
          #ffffff00 0%,
          #ffffffaa 50%,
          #ffffff 100%
        );
        clip-path: polygon(100% 0, 0 0, 100% 100%);
        opacity: 0.4;
      }

      @keyframes appear {
        from {
          opacity: 0;
          transform: translateY(20px) rotate(-2deg);
        }
        to {
          opacity: 1;
          transform: translateY(0) rotate(0deg);
        }
      }

      .poem,
      .signature {
        font-family: "Homemade Apple", cursive;
        color: var(--ink);
      }

      .poem {
        font-size: 1.35rem;
        line-height: 2.2;
        white-space: pre-line;
      }

      .signature {
        margin-top: 25px;
        text-align: right;
        font-size: 1.15rem;
        opacity: 0.85;
      }
    </style>
  </head>

  <body>
    <div class="paper">
      <div class="poem">
        A vida é tão bela que chega a dar medo. Medo de não saber viver, medo de
        perder o que encanta, medo de não perceber as pequenas coisas que fazem
        tudo valer a pena.
      </div>

      <div class="signature">Mário Quintana</div>
      <div class="signature">._.. ...</div>
    </div>
    <script src="./js/card-telemetry.js"></script>
  </body>
</html>
