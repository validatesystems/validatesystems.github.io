<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Das Utopias</title>

    <!-- Fonte manuscrita (Caveat) -->
    <link
      href="https://fonts.googleapis.com/css2?family=Caveat:wght@400;600&display=swap"
      rel="stylesheet"
    />

    <style>
      body {
        margin: 0;
        padding: 0;
        background: #d9d2c1;
        font-family: sans-serif;
        display: flex;
        justify-content: center;
        align-items: center;
        min-height: 100vh;
      }

      .paper {
        background: #fdfbf6;
        width: 90%;
        max-width: 650px;
        padding: 55px 40px;
        color: #2a2a2a;
        position: relative;
        box-shadow: 0 12px 28px rgba(0, 0, 0, 0.25);
        border-radius: 8px;

        /* textura e bordas irregulares */
        background-image: url("https://i.imgur.com/1z7o8n9.png"),
          linear-gradient(transparent 97%, rgba(0, 0, 0, 0.06));
        background-size: cover, 100% 27px;
        overflow: hidden;
        animation: fade 0.9s ease;
      }

      /* rasgo nas bordas */
      .paper::before,
      .paper::after {
        content: "";
        position: absolute;
        width: 100%;
        height: 18px;
        left: 0;
        background-repeat: repeat-x;
        opacity: 0.45;
      }

      .paper::before {
        top: 0;
        background-image: url("https://i.imgur.com/oeJwE8h.png");
      }

      .paper::after {
        bottom: 0;
        background-image: url("https://i.imgur.com/oeJwE8h.png");
        transform: rotate(180deg);
      }

      @keyframes fade {
        from {
          opacity: 0;
          transform: translateY(25px);
        }
        to {
          opacity: 1;
        }
      }

      .poem {
        font-family: "Caveat", cursive;
        font-size: 1.8rem;
        line-height: 2.2rem;
        white-space: pre-line;
        padding-bottom: 20px;
      }

      .signature {
        font-family: "Caveat", cursive;
        font-size: 1.4rem;
        margin-top: 15px;
        text-align: right;
      }
    </style>
  </head>

  <body>
    <div class="paper">
      <div class="poem">
        <p>Das Utopias</p>
        Se as coisas são inatingíveis... ora! Não é motivo para não querê-las...
        Que tristes os caminhos, se não fora a presença distante das estrelas!
      </div>

      <div class="signature">Mário Quintana</div>
    </div>
  </body>
</html>
