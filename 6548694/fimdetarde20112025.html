<!DOCTYPE html>
<html lang="pt-BR" data-theme="light">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <meta name="color-scheme" content="light dark" />
    <title>Pensamento de fim de tarde</title>

    <style>
      :root {
        --bg-light1: #fdf5ff;
        --bg-light2: #e7f3ff;
        --bg-dark1: #050816;
        --bg-dark2: #0b1220;

        --bubble-light: rgba(255, 255, 255, 0.96);
        --bubble-dark: rgba(15, 23, 42, 0.96);

        --fg-light: #111827;
        --fg-dark: #e5e7eb;

        --muted-light: #6b7280;
        --muted-dark: #9ca3af;

        --accent: #7c3aed;
        --accent-soft: rgba(124, 58, 237, 0.2);

        --glass: blur(18px);
        --transition: 0.35s ease;
      }

      html[data-theme="light"] {
        --bg1: var(--bg-light1);
        --bg2: var(--bg-light2);
        --bubble: var(--bubble-light);
        --fg: var(--fg-light);
        --muted: var(--muted-light);
      }

      html[data-theme="dark"] {
        --bg1: var(--bg-dark1);
        --bg2: var(--bg-dark2);
        --bubble: var(--bubble-dark);
        --fg: var(--fg-dark);
        --muted: var(--muted-dark);
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        min-height: 100vh;
        font-family: system-ui, -apple-system, BlinkMacSystemFont, "Inter",
          sans-serif;
        background: radial-gradient(
            circle at 10% 10%,
            rgba(251, 191, 36, 0.22),
            transparent 60%
          ),
          radial-gradient(
            circle at 85% 90%,
            rgba(56, 189, 248, 0.2),
            transparent 60%
          ),
          linear-gradient(145deg, var(--bg1), var(--bg2));
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 24px 16px;
        color: var(--fg);
        transition: background var(--transition), color var(--transition);
      }

      .toggle-theme {
        position: fixed;
        top: 14px;
        right: 14px;
        background: var(--bubble);
        border: 1px solid var(--accent-soft);
        padding: 7px 11px;
        border-radius: 999px;
        cursor: pointer;
        backdrop-filter: var(--glass);
        display: inline-flex;
        align-items: center;
        gap: 6px;
        font-size: 0.9rem;
        transition: var(--transition);
      }

      .toggle-theme span {
        font-size: 0.8rem;
        color: var(--muted);
      }

      .wrapper {
        max-width: 520px;
        width: 100%;
        position: relative;
      }

      .subtitle {
        text-align: center;
        font-size: 0.9rem;
        color: var(--muted);
        margin-bottom: 16px;
      }

      /* Nuvem de pensamento de verdade */
      /* Nuvem de pensamento */
      /* Nuvem de pensamento ajustável */
      .cloud-thought {
        position: relative;
        margin: 0 auto;
        max-width: 520px;
        background: var(--bubble);
        border-radius: 60px 80px 70px 85px / 70px 60px 80px 75px; /* formato irregular */
        padding: 34px 32px;
        box-shadow: 0 20px 45px rgba(15, 23, 42, 0.35);
        border: 1px solid rgba(148, 163, 184, 0.55);
        backdrop-filter: var(--glass);
        display: flex;
        align-items: center;
        justify-content: center;
        text-align: center;
        overflow: visible;
        transition: padding 0.3s ease, border-radius 0.3s ease;
      }

      /* REMOVIDAS as bolhas grandes de cima */

      /* Bolhas pequenas: rastro de pensamento */
      .cloud-bubble-small {
        position: absolute;
        border-radius: 50%;
        background: var(--bubble);
        border: 1px solid rgba(148, 163, 184, 0.4);
        box-shadow: 0 8px 18px rgba(15, 23, 42, 0.28);
      }

      .cloud-bubble-small.b1 {
        width: 22px;
        height: 22px;
        bottom: -18px;
        left: 26%;
      }

      .cloud-bubble-small.b2 {
        width: 16px;
        height: 16px;
        bottom: -36px;
        left: 21%;
      }

      .cloud-inner {
        position: relative;
        z-index: 2;
        max-width: 420px;
      }

      .phrase {
        margin: 0;
        font-size: 1.1rem;
        line-height: 1.7;
        opacity: 0;
        transform: translateY(8px);
        transition: opacity 0.6s ease, transform 0.6s ease;
        white-space: pre-line;
      }

      .phrase.visible {
        opacity: 1;
        transform: translateY(0);
      }

      .footer-info {
        margin-top: 22px;
        text-align: center;
        font-size: 0.82rem;
        color: var(--muted);
      }

      .signature {
        margin-top: 4px;
        text-align: center;
        font-size: 0.86rem;
        color: var(--muted);
      }

      .hint {
        margin-top: 8px;
        text-align: center;
        font-size: 0.78rem;
        color: var(--muted);
      }

      @media (max-width: 480px) {
        .cloud-thought {
          padding: 20px 18px;
          border-radius: 999px;
        }

        .phrase {
          font-size: 1.02rem;
        }

        .cloud-thought::before {
          width: 70px;
          height: 70px;
          top: -24px;
          left: 12%;
        }

        .cloud-thought::after {
          width: 54px;
          height: 54px;
          top: -16px;
          right: 10%;
        }

        .cloud-bubble-small.b1 {
          left: 24%;
        }

        .cloud-bubble-small.b2 {
          left: 19%;
        }
      }
      .replay-btn {
        margin: 18px auto 0;
        display: block;
        padding: 10px 18px;
        font-size: 0.9rem;
        border: 0;
        border-radius: 999px;
        background: linear-gradient(
          120deg,
          rgba(124, 58, 237, 0.9),
          rgba(56, 189, 248, 0.9)
        );
        color: #fff;
        cursor: pointer;
        transition: transform 0.2s ease, opacity 0.25s ease;
      }

      .replay-btn:hover {
        transform: scale(1.04);
      }

      .replay-btn:active {
        transform: scale(0.97);
      }
    </style>
  </head>

  <body>
    <button class="toggle-theme" id="themeToggle">🌓 <span>tema</span></button>

    <div class="wrapper">
      <p class="subtitle">Fim de tarde, modo saudade em pensamento.</p>

      <div class="cloud-thought">
        <div class="cloud-inner">
          <p id="phrase" class="phrase"></p>
        </div>

        <!-- bolhas pequenas do pensamento -->
        <div class="cloud-bubble-small b1"></div>
        <div class="cloud-bubble-small b2"></div>
      </div>

      <p class="footer-info" id="footerInfo"></p>
      <p class="signature" id="signature"></p>
      <p class="hint" id="hint"></p>
      <button class="replay-btn" id="replayBtn" style="display: none">
        🔄 Rever pensamento
      </button>
    </div>

    <script>
      const root = document.documentElement;
      const toggleTheme = document.getElementById("themeToggle");

      toggleTheme.addEventListener("click", () => {
        const current = root.getAttribute("data-theme") || "light";
        const next = current === "light" ? "dark" : "light";
        root.setAttribute("data-theme", next);
      });

      const phrases = [
        "Cléia, fim de tarde aí no \ninterior (supondo que você ainda esteja), na casa da sua mãe, e eu fico imaginando como você está agora.\nTalvez descansando, talvez olhando o movimento das águas, talvez só existindo no seu próprio ritmo.",
        "Por aqui, entre uma \ncoisa e outra, você continua aparecendo nos meus pensamentos.\nNão do jeito exagerado dos filmes, mas naquele jeito discreto que \ninsiste em voltar.",
        "É curioso como, mesmo longe, eu sinto como se pudesse te alcançar por aqui,\ncomo se essa tela fosse só um atalho entre o meu silêncio e o seu.",
        "Se esse fim de tarde \ntivesse um som, seria algo calmo.\nSe tivesse uma imagem, teria você em algum detalhe, mesmo que fosse só na minha memória.",
        "Então eu deixo \nessa nuvem aqui,\ncomo se fosse um pensamento meu indo te encontrar, só pra te lembrar que você está sendo lembrada.",
        "E só pra deixar claro:\nnessa mensagem eu não estou me despedindo de hoje.\nAinda tem um boa noite reservado pra você em outro card.\nAguarde as 20h.",
      ];

      const phraseEl = document.getElementById("phrase");
      const footerInfoEl = document.getElementById("footerInfo");
      const signatureEl = document.getElementById("signature");
      const hintEl = document.getElementById("hint");
      const replayBtn = document.getElementById("replayBtn");

      let index = 0;

      function showPhrase() {
        const text = phrases[index];
        phraseEl.classList.remove("visible");

        setTimeout(() => {
          phraseEl.textContent = text;
          phraseEl.classList.add("visible");

          if (index < phrases.length - 1) {
            setTimeout(() => {
              index++;
              showPhrase();
            }, 6000);
          } else {
            footerInfoEl.textContent =
              "Essa foi só o fim de tarde em pensamento.";
            signatureEl.textContent = "._.. ...";
            hintEl.textContent =
              "A mensagem de boa noite ainda está a caminho em outro card. Aguarde as 20h.";
            replayBtn.style.display = "block"; // mostra o botão
          }
        }, 260);
      }

      replayBtn.addEventListener("click", () => {
        index = 0;
        replayBtn.style.display = "none";
        footerInfoEl.textContent = "";
        signatureEl.textContent = "";
        hintEl.textContent = "";
        showPhrase();
      });

      showPhrase();
    </script>
  </body>
</html>
